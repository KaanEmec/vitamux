# Source of truth for Vitamux.xcodeproj (generated by `xcodegen`, never committed).
# Layout and rules: README.md and docs/adr/0023-ios-app.md.
name: Vitamux
options:
  bundleIdPrefix: org.vitamux
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    # Set your Apple developer team (or pass DEVELOPMENT_TEAM=... to xcodebuild). Left empty on purpose.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.4.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  VitamuxKit:
    path: ../VitamuxKit
targets:
  Vitamux:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: VitamuxKit
    settings:
      base:
        # Bridge's bundle id, so an installed Vitamux Bridge upgrades in place; with it the app keeps
        # HealthBridgeKit's Keychain service (org.vitamux.healthbridge) and the paired device token.
        PRODUCT_BUNDLE_IDENTIFIER: org.vitamux.healthbridge
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Vitamux
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # The fixed deep-link and OAuth-return scheme (docs/architecture/ios-app-screens.md).
        CFBundleURLTypes:
          - CFBundleURLName: org.vitamux.app
            CFBundleURLSchemes: [vitamux]
  VitamuxUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Vitamux
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.vitamux.healthbridge.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Vitamux:
    build:
      targets:
        Vitamux: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [VitamuxUITests]
