# Source of truth for Vitamux.xcodeproj (generated by `xcodegen`, never committed), grown from
# Bridge's project.yml (apple/HealthBridgeApp, removed in J22.14). Layout and rules: README.md and docs/adr/0023-ios-app.md.
name: Vitamux
options:
  bundleIdPrefix: org.vitamux
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    # Set your Apple developer team (or pass DEVELOPMENT_TEAM=... to xcodebuild). Left empty on purpose.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.4.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  VitamuxKit:
    path: ../VitamuxKit
  HealthBridgeKit:
    path: ../HealthBridgeKit
targets:
  Vitamux:
    type: application
    platform: iOS
    sources:
      - Sources
      # The widgets' snapshot type, written by the dashboard (J22.20).
      - Widgets/Shared
    dependencies:
      - package: VitamuxKit
      - package: HealthBridgeKit
        product: HealthBridgeCore
      - package: HealthBridgeKit
        product: HealthBridgeHealthKit
      - target: VitamuxWidgets
        embed: true
    settings:
      base:
        # Bridge's bundle id, so an installed Vitamux Bridge upgrades in place; with it the app keeps
        # HealthBridgeKit's Keychain service (org.vitamux.healthbridge) and the paired device token.
        PRODUCT_BUNDLE_IDENTIFIER: org.vitamux.healthbridge
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Vitamux
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiredDeviceCapabilities: [healthkit]
        # The fixed deep-link and OAuth-return scheme (docs/architecture/ios-app-screens.md).
        CFBundleURLTypes:
          - CFBundleURLName: org.vitamux.app
            CFBundleURLSchemes: [vitamux]
        # Read only, as Bridge: no write scope, so no NSHealthUpdateUsageDescription.
        NSHealthShareUsageDescription: >-
          Vitamux reads the health data types you enable and uploads them to your own Vitamux server.
          It only reads: it never writes to Apple Health and sends data nowhere else.
        NSCameraUsageDescription: >-
          Used only to scan the pairing QR code shown by your Vitamux server, and lab reports you choose to scan,
          which are sent only to your own Vitamux server.
        # "Open in Vitamux" for PDFs from another app's share sheet (lab documents, J22.12). iOS copies the
        # file into the app's Inbox; the app deletes that copy after uploading it.
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf]
        LSSupportsOpeningDocumentsInPlace: false
        NSFaceIDUsageDescription: Used only to unlock Vitamux when you turn on app lock.
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [org.vitamux.healthbridge.refresh]
    entitlements:
      path: Sources/Vitamux.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
        # Cache and widget data (docs/architecture/ios-app.md#offline-cache-widgets-and-notifications).
        com.apple.security.application-groups: [group.org.vitamux.healthbridge]
        # The app's own identifier group first, so new items land where Bridge's are (its default
        # group) and the widget, which lists the same group, can read the app session.
        keychain-access-groups: [$(AppIdentifierPrefix)org.vitamux.healthbridge]
  VitamuxWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
        excludes: [Tests]
      # The card's metric tile, shared with the app.
      - Sources/Shared/MetricTile.swift
    dependencies:
      # The chart kit's colours, sparkline and status glyphs, and the session's Keychain item;
      # no client: the widgets read the app's snapshot and never fetch (J22.20).
      - package: VitamuxKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: AppIntents.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.vitamux.healthbridge.widgets
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_APPROACHABLE_CONCURRENCY: YES
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Vitamux
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/VitamuxWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.org.vitamux.healthbridge]
        keychain-access-groups: [$(AppIdentifierPrefix)org.vitamux.healthbridge]
  # The widgets' timeline, states and previews, rendered for every family without the extension
  # host (a WidgetKit extension cannot host tests).
  VitamuxWidgetsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Widgets
        excludes: [VitamuxWidgetsBundle.swift, PrivacyInfo.xcprivacy, Info.plist, VitamuxWidgets.entitlements]
      - Sources/Shared/MetricTile.swift
    dependencies:
      - package: VitamuxKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: AppIntents.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.vitamux.healthbridge.widgetstests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_APPROACHABLE_CONCURRENCY: YES
  VitamuxUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Vitamux
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.vitamux.healthbridge.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Vitamux:
    build:
      targets:
        Vitamux: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [VitamuxUITests, VitamuxWidgetsTests]
