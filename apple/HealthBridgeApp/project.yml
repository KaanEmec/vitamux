name: HealthBridgeApp
options:
  bundleIdPrefix: org.vitamux
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    # Set your Apple developer team (or pass DEVELOPMENT_TEAM=... to xcodebuild). Left empty on purpose.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  HealthBridgeKit:
    path: ../HealthBridgeKit
targets:
  HealthBridgeApp:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: HealthBridgeKit
        product: HealthBridgeCore
      - package: HealthBridgeKit
        product: HealthBridgeHealthKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.vitamux.healthbridge
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Vitamux Bridge
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiredDeviceCapabilities: [healthkit]
        # Read only: the app has no write scope, so there is no NSHealthUpdateUsageDescription.
        NSHealthShareUsageDescription: >-
          Vitamux Bridge reads the health data types you enable and uploads them to your own Vitamux server.
          It only reads: it never writes to Apple Health and sends data nowhere else.
        NSCameraUsageDescription: Used only to scan the pairing QR code shown by your Vitamux server.
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [org.vitamux.healthbridge.refresh]
    entitlements:
      path: Sources/HealthBridgeApp.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
  HealthBridgeAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: HealthBridgeApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.vitamux.healthbridge.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  HealthBridgeApp:
    build:
      targets:
        HealthBridgeApp: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [HealthBridgeAppUITests]
