# Compose overlay for the sidecar `whoop` (docs/sidecars.md#enable-a-sidecar-in-compose).
# Enable it next to deploy/compose/compose.yaml by adding to deploy/compose/.env:
#   COMPOSE_FILE=compose.yaml:../../sidecars/whoop/compose.yaml
#   COMPOSE_PROFILES=sidecar-whoop
#   VITAMUX_SIDECARS=whoop=http://sidecar-whoop:8080      (comma-separated for several)
# Without the profile nothing here starts. The sidecar has no database access: it joins only
# `frontend` (outbound access to the provider; vitamux reaches it there), never `backend`.
# The image follows :stable; pin a digest instead for manual updates (docs/sidecars.md#updates).
x-sidecar: &sidecar
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 128
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

services:
  # Writes the shared secret once (never overwrites). Both vitamux and the sidecar read it.
  sidecar-whoop-secret:
    <<: *sidecar
    image: busybox:stable@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662 # for its shell and a random source
    profiles: [sidecar-whoop]
    user: "0:0" # a fresh named volume is root-owned
    entrypoint: ["/bin/sh", "-euc"]
    command:
      - |
        [ -s /s/secret ] || { umask 077; od -An -tx1 -N32 /dev/urandom | tr -d ' \n' > /s/secret; }
        chmod 0444 /s/secret
    volumes: ["sidecar-whoop-secret:/s"]
    network_mode: none
    restart: "no"
    mem_limit: 16m
    healthcheck: {disable: true}

  sidecar-whoop:
    <<: *sidecar
    image: ${VITAMUX_SIDECAR_WHOOP_IMAGE:-ghcr.io/kaanemec/vitamux-sidecar-whoop:stable}
    profiles: [sidecar-whoop]
    restart: unless-stopped
    environment:
      VITAMUX_SIDECAR_SECRET_FILE: /sidecar-secret/secret
    volumes: ["sidecar-whoop-secret:/sidecar-secret:ro"]
    tmpfs: ["/tmp:size=16m,mode=1777"]
    networks: [frontend]
    mem_limit: 256m
    healthcheck: # TCP connect: /v1/* needs the bearer secret, so the probe does not call it
      test: ["CMD", "node", "-e", "require('net').connect(8080, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s
    depends_on:
      sidecar-whoop-secret: {condition: service_completed_successfully}

  vitamux:
    environment:
      VITAMUX_SIDECARS: ${VITAMUX_SIDECARS:-whoop=http://sidecar-whoop:8080}
      VITAMUX_SIDECAR_WHOOP_SECRET_FILE: /sidecar-secret/whoop/secret
    volumes: ["sidecar-whoop-secret:/sidecar-secret/whoop:ro"]
    depends_on:
      sidecar-whoop-secret: {condition: service_completed_successfully}

volumes:
  sidecar-whoop-secret:
