# Compose overlay for the sidecar `garmin` (docs/sidecars.md#enable-a-sidecar-in-compose).
# Enable it next to deploy/compose/compose.yaml by adding to deploy/compose/.env:
#   COMPOSE_FILE=compose.yaml:../../sidecars/garmin/compose.yaml
#   COMPOSE_PROFILES=sidecar-garmin
#   VITAMUX_SIDECARS=garmin=http://sidecar-garmin:8080      (comma-separated for several)
# Without the profile nothing here starts. The sidecar has no database access: it joins only
# `frontend` (outbound access to the provider; vitamux reaches it there), never `backend`.
# The image follows :stable; pin a digest instead for manual updates (docs/sidecars.md#updates).
x-sidecar: &sidecar
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 128
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

services:
  # Writes the shared secret once (never overwrites). Both vitamux and the sidecar read it.
  sidecar-garmin-secret:
    <<: *sidecar
    image: busybox:stable@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662 # for its shell and a random source
    profiles: [sidecar-garmin]
    user: "0:0" # a fresh named volume is root-owned
    entrypoint: ["/bin/sh", "-euc"]
    command:
      - |
        [ -s /s/secret ] || { umask 077; od -An -tx1 -N32 /dev/urandom | tr -d ' \n' > /s/secret; }
        chmod 0444 /s/secret
    volumes: ["sidecar-garmin-secret:/s"]
    network_mode: none
    restart: "no"
    mem_limit: 16m
    healthcheck: {disable: true}

  sidecar-garmin:
    <<: *sidecar
    image: ${VITAMUX_SIDECAR_GARMIN_IMAGE:-ghcr.io/kaanemec/vitamux-sidecar-garmin:stable}
    profiles: [sidecar-garmin]
    restart: unless-stopped
    environment:
      VITAMUX_SIDECAR_SECRET_FILE: /sidecar-secret/secret
    volumes: ["sidecar-garmin-secret:/sidecar-secret:ro"]
    tmpfs: ["/tmp:size=16m,mode=1777"]
    networks: [frontend]
    mem_limit: 256m
    healthcheck: # TCP connect: /v1/* needs the bearer secret, so the probe does not call it
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8080), 2)"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s
    depends_on:
      sidecar-garmin-secret: {condition: service_completed_successfully}

  vitamux:
    environment:
      VITAMUX_SIDECARS: ${VITAMUX_SIDECARS:-garmin=http://sidecar-garmin:8080}
      VITAMUX_SIDECAR_GARMIN_SECRET_FILE: /sidecar-secret/garmin/secret
    volumes: ["sidecar-garmin-secret:/sidecar-secret/garmin:ro"]
    depends_on:
      sidecar-garmin-secret: {condition: service_completed_successfully}

volumes:
  sidecar-garmin-secret:
