# Update policy (docs/security.md#supply-chain): one grouped PR per ecosystem per week, reviewed
# like any other change; risky bumps (new maintainers, install scripts, majors) get a closer look.
version: 2
updates:
  - package-ecosystem: gomod # dependencies and the go.mod tool pins (sqlc, govulncheck, ...)
    directory: /
    schedule: {interval: weekly, day: monday}
    groups:
      go: {patterns: ["*"]}

  - package-ecosystem: npm
    directory: /web
    schedule: {interval: weekly, day: monday}
    groups:
      npm-production: {dependency-type: production}
      npm-development: {dependency-type: development}

  - package-ecosystem: github-actions # SHA pins; the version comment is updated too
    directory: /
    schedule: {interval: weekly, day: monday}
    groups:
      actions: {patterns: ["*"]}

  - package-ecosystem: docker # Dockerfile base image digests
    directories: [/, /examples/sidecar-python]
    schedule: {interval: weekly, day: monday}
    groups:
      base-images: {patterns: ["*"]}
    ignore:
      - dependency-name: node # stay on the LTS line; move majors by hand
        update-types: ["version-update:semver-major"]

# Sidecars (docs/sidecars.md#automatic-upstream-updates). Entries are per directory, so a new
# sidecars/<name>/ adds its own pair below (uncomment, replace <name>, <package>, <lockstep>);
# keep the template commented. Upstream bumps are checked
# daily, wait one day after a release (a pulled or malicious release is usually caught by then)
# and group the upstream package with the packages it releases in lockstep, so one PR changes
# only upstream lines and sidecar-automerge.yml may merge it. Anything else Dependabot proposes
# for the directory is a separate PR that stays open for review.
#
#  - package-ecosystem: uv # or npm
#    directory: /sidecars/<name>
#    schedule: {interval: daily}
#    cooldown: {default-days: 1}
#    groups:
#      upstream: {patterns: ["<package>", "<lockstep>"]}
#
#  - package-ecosystem: docker # base image digests of this sidecar's Dockerfile (reviewed by hand)
#    directory: /sidecars/<name>
#    schedule: {interval: weekly, day: monday}
#    groups:
#      base-images: {patterns: ["*"]}

  - package-ecosystem: uv
    directory: /sidecars/garmin
    schedule: {interval: daily}
    cooldown: {default-days: 1}
    groups:
      upstream: {patterns: ["garminconnect"]}

  - package-ecosystem: docker
    directory: /sidecars/garmin
    schedule: {interval: weekly, day: monday}
    groups:
      base-images: {patterns: ["*"]}

  - package-ecosystem: npm
    directory: /sidecars/whoop
    schedule: {interval: daily}
    cooldown: {default-days: 1}
    groups:
      upstream: {patterns: ["@dofek/*"]}

  - package-ecosystem: docker
    directory: /sidecars/whoop
    schedule: {interval: weekly, day: monday}
    groups:
      base-images: {patterns: ["*"]}
