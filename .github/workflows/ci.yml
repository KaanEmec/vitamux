name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: TS API client is up to date
        run: npm run openapi && git diff --exit-code -- src/lib/api && test -z "$(git status --porcelain src/lib/api)"
      - run: npm run lint:api # Spectral (pinned in package.json)
      - run: npm run check
      - run: npm run lint
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: web/build
          retention-days: 1

  go:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: web/build
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
      - name: sqlc generation is up to date
        run: go tool sqlc generate && git diff --exit-code -- internal/db/dbq && test -z "$(git status --porcelain internal/db/dbq)"
      - name: OpenAPI Go generation is up to date
        run: go tool oapi-codegen -config internal/api/oapi/config.yaml api/openapi.yaml && git diff --exit-code -- internal/api/oapi && test -z "$(git status --porcelain internal/api/oapi)"
      - run: go test -race ./...
      - run: go test -run '^$' -fuzz=FuzzDecodeBatch -fuzztime=20s ./internal/ingest # batch parser fuzz smoke
      - run: go test -tags webui ./internal/api/ # CSP check against the real built page
      - run: CGO_ENABLED=0 go build -tags webui -trimpath -o bin/vitamux ./cmd/vitamux && ./bin/vitamux version

  integration:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        postgres: ["17", "18"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_USER: vitamux
          POSTGRES_PASSWORD: vitamux-ci
          POSTGRES_DB: vitamux
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vitamux -d vitamux"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      VITAMUX_ENV: development
      VITAMUX_DATABASE_URL: postgres://vitamux:vitamux-ci@127.0.0.1:5432/vitamux?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -tags integration ./...

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  secrets-and-licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Fixture privacy guard (synthetic marker, emails, phones, tokens)
        run: go run ./tools/fixtureguard
      - name: Go license report
        run: go run github.com/google/go-licenses/v2@v2.0.1 report ./cmd/vitamux
      - name: Web license summary
        working-directory: web
        run: npm ci && npx --yes license-checker-rseidelsohn@4 --summary
