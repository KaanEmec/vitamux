name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # Production dependencies (bundled into the SPA) fail the build on high or critical
      # advisories; dev-only findings (build and test tooling) are reported, not blocking.
      - run: npm audit --omit=dev --audit-level=high
      - name: npm audit, dev dependencies included (report only)
        run: npm audit --audit-level=high || echo "::warning::npm audit has dev-only findings (not blocking; docs/security.md#supply-chain)"
      - name: TS API client is up to date
        run: npm run openapi && git diff --exit-code -- src/lib/api && test -z "$(git status --porcelain src/lib/api)"
      - run: npm run lint:api # Spectral (pinned in package.json)
      - run: npm run check
      - run: npm run lint
      - run: npm run build
      - run: npm run budget # initial JS <= 300 KiB gzip on every route (web/scripts/bundle-budget.mjs)
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test # E2E and axe (serious/critical fail) against the built SPA with a stubbed API (web/e2e)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-build
          path: web/build
          retention-days: 1

  go:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-build
          path: web/build
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
      - name: sqlc generation is up to date
        run: go tool sqlc generate && git diff --exit-code -- internal/db/dbq && test -z "$(git status --porcelain internal/db/dbq)"
      - name: OpenAPI Go generation is up to date
        run: go tool oapi-codegen -config internal/api/oapi/config.yaml api/openapi.yaml && git diff --exit-code -- internal/api/oapi && test -z "$(git status --porcelain internal/api/oapi)"
      - run: go test -race ./...
      - name: govulncheck (pinned in go.mod; fails on vulnerabilities in reachable code)
        run: go tool govulncheck ./...
      - name: Fuzz smoke (10 s per target; target list in the Makefile)
        run: make fuzz FUZZTIME=10s
      - run: go test -tags webui ./internal/api/ # CSP check against the real built page
      - name: Compose policy (no DB port, loopback-only publish, read-only, cap_drop, no plaintext secrets)
        run: go test -count=1 ./deploy/compose/
      - run: CGO_ENABLED=0 go build -tags webui -trimpath -o bin/vitamux ./cmd/vitamux && ./bin/vitamux version

  # The iOS app and its kits (J22.22). macos-26 (arm64) carries Xcode 26.0.1-26.6 and the iOS 26.2,
  # 26.4 and 26.5 simulator runtimes (actions/runner-images, macos-26-arm64); macos-15 has no
  # iOS 26 runtime. Pinned: Xcode 26.6 and an iPhone 17 Pro on iOS 26.5, created per run.
  swift:
    runs-on: macos-26
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      SIM_DEVICE: iPhone 17 Pro
      SIM_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-26-5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: swift test --package-path apple/HealthBridgeKit
      # VitamuxKit's spec copy (apple/VitamuxKit/copy-openapi.sh, J22.4) matches api/openapi.yaml.
      - name: VitamuxKit spec copy is current
        run: apple/VitamuxKit/copy-openapi.sh && git diff --exit-code -- apple/VitamuxKit/Sources/VitamuxKit/API/openapi.yaml
      # ADR-0023: Apple's swift-openapi packages and what they resolve, nothing else.
      - name: VitamuxKit dependencies are the pinned list
        run: |
          diff <(jq -r '.pins[] | "\(.identity) \(.location)"' apple/VitamuxKit/Package.resolved | sort) - <<'EOF'
          openapikit https://github.com/mattpolzin/OpenAPIKit
          swift-algorithms https://github.com/apple/swift-algorithms
          swift-argument-parser https://github.com/apple/swift-argument-parser
          swift-collections https://github.com/apple/swift-collections
          swift-http-types https://github.com/apple/swift-http-types
          swift-numerics https://github.com/apple/swift-numerics.git
          swift-openapi-generator https://github.com/apple/swift-openapi-generator
          swift-openapi-runtime https://github.com/apple/swift-openapi-runtime
          swift-openapi-urlsession https://github.com/apple/swift-openapi-urlsession
          yams https://github.com/jpsim/Yams
          EOF
      - run: swift test --package-path apple/VitamuxKit


  # The app's simulator gates (apple/VitamuxApp/scripts/ui-gates.sh, as `make test-ios` runs them
  # in one go), sharded by UI test class so each hosted runner finishes well inside an hour: app and
  # widget build, package allowlist, privacy manifests, the shard's classes on the fake server with
  # their accessibility audits, and the unified-log privacy scan. The first shard also runs the
  # widget tests and the performance budgets (ui-gates.sh runs the performance class on its own
  # when it is named). ScreenshotUITests (docs) and StackSmokeUITests (the ios-stack job) stay out.
  ios-ui:
    runs-on: macos-26
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: a11y-widgets-perf
            classes: AccessibilityAuditUITests WidgetsUITests OfflineCacheUITests NotificationsUITests
            extra: -only-testing:VitamuxWidgetsTests -skip-testing:VitamuxUITests/PerformanceUITests
          - shard: settings-specialised-watch
            classes: SettingsUITests SpecialisedUITests WatchUITests DeepLinkUITests AppLockUITests SystemStatusUITests UpgradeFromBridgeUITests
            extra: ""
          - shard: signin-sources-lab-health
            classes: SignInUITests ConnectionDetailUITests LabUITests AppleHealthUITests AppleHealthSourcesUITests
            extra: ""
          - shard: shell-explore-dashboard-rules
            classes: ShellUITests SourcesUITests ExploreUITests OverrideUITests DayViewUITests DashboardUITests RulesUITests
            extra: ""
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      SIM_DEVICE: iPhone 17 Pro
      SIM_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-26-5
      # Hosted runners are two to three times slower than a developer Mac: the signpost budgets
      # here catch regressions, not frame times (those are J22.23's, on a device).
      DASHBOARD_BUDGET_MS: "2000"
      CHART_BUDGET_MS: "1000"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: brew install xcodegen
      - name: App gates, shard ${{ matrix.shard }}
        run: |
          args=()
          for c in ${{ matrix.classes }}; do args+=("-only-testing:VitamuxUITests/$c"); done
          for a in ${{ matrix.extra }}; do args+=("$a"); done
          apple/VitamuxApp/scripts/ui-gates.sh "${args[@]}"
        env:
          RESULT_BUNDLE: ${{ runner.temp }}/ios/ui-tests.xcresult
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ios-ui-tests-${{ matrix.shard }}
          path: ${{ runner.temp }}/ios
          retention-days: 7
          if-no-files-found: ignore

  # The app against a real `vitamux serve` on a throwaway database (scripts/ios-stack.sh, as
  # `make test-ios-stack`). PostgreSQL 18 from Homebrew: macOS runners have no service containers.
  ios-stack:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      SIM_DEVICE: iPhone 17 Pro
      SIM_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-26-5
      VITAMUX_DATABASE_URL: postgres://vitamux@127.0.0.1:5432/vitamux?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: PostgreSQL 18 (throwaway cluster, trust auth on loopback)
        run: |
          brew install postgresql@18 xcodegen
          pg=$(brew --prefix postgresql@18)/bin
          echo "$pg" >> "$GITHUB_PATH"
          "$pg/initdb" -D "$RUNNER_TEMP/pg" -U vitamux --auth=trust >/dev/null
          "$pg/pg_ctl" -D "$RUNNER_TEMP/pg" -l "$RUNNER_TEMP/pg.log" -o "-c listen_addresses=127.0.0.1" -w start
          "$pg/createdb" -h 127.0.0.1 -U vitamux vitamux
      - name: iOS stack smoke
        run: scripts/ios-stack.sh
        env:
          RESULT_BUNDLE: ${{ runner.temp }}/ios-stack-smoke.xcresult
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ios-stack-smoke.xcresult
          path: ${{ runner.temp }}/ios-stack-smoke.xcresult
          retention-days: 7
          if-no-files-found: ignore

  integration:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        postgres: ["17", "18"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_USER: vitamux
          POSTGRES_PASSWORD: vitamux-ci
          POSTGRES_DB: vitamux
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vitamux -d vitamux"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      VITAMUX_ENV: development
      VITAMUX_DATABASE_URL: postgres://vitamux:vitamux-ci@127.0.0.1:5432/vitamux?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # pg_dump/pg_restore of the server's major version for the restore drill (internal/backup).
      - name: PostgreSQL ${{ matrix.postgres }} client tools
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-client-${{ matrix.postgres }}
          echo "/usr/lib/postgresql/${{ matrix.postgres }}/bin" >> "$GITHUB_PATH"
      - run: go test -tags integration -timeout 20m ./...
      # Sentinel secrets and health values through a real `vitamux serve`; zero hits in logs,
      # metrics, audit_events, jobs, job_runs, the database (secrets) and an export (J13.6).
      - name: Redaction audit
        if: matrix.postgres == '18'
        run: scripts/redaction-audit.sh
      # One Playwright smoke against a real `vitamux serve` (embedded SPA, throwaway database, generated owner).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: matrix.postgres == '18'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Real-stack E2E smoke (web/e2e-stack)
        if: matrix.postgres == '18'
        run: |
          npm --prefix web ci
          npm --prefix web run build
          (cd web && npx playwright install --with-deps chromium)
          scripts/e2e-stack.sh

  # The conformance kit (J17.3) against the Python example sidecar: the conformant example passes
  # every check and each BREAK variant fails exactly its named check. ubuntu-latest ships Python 3.12.
  sidecar-kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Example sidecar unit tests
        run: python3 -m unittest
        working-directory: examples/sidecar-python
      - name: Kit passes the example and fails each broken variant at its named check
        run: VITAMUX_REQUIRE_PYTHON=1 go test -count=1 -v -run 'TestExampleSidecarPasses|TestBrokenVariantsFailOneCheck|TestScenarioSchema' ./internal/connectors/remote/
      - name: vitamux connector-test CLI (exit status and output)
        run: |
          go build -o "$RUNNER_TEMP/vitamux" ./cmd/vitamux
          od -An -tx1 -N16 /dev/urandom | tr -d ' \n' > "$RUNNER_TEMP/secret"
          args=(--url http://127.0.0.1:8080 --secret-file "$RUNNER_TEMP/secret" --scenario examples/sidecar-python/conformance.json)
          run_example() { # BREAK value, "" for the conformant example
            BREAK=$1 VITAMUX_SIDECAR_SECRET_FILE="$RUNNER_TEMP/secret" SIDECAR_ADDR=127.0.0.1:8080 python3 examples/sidecar-python/sidecar.py 2> /dev/null &
            pid=$!
            for _ in $(seq 1 30); do nc -z 127.0.0.1 8080 2> /dev/null && break; sleep 0.2; done
            set +e; "$RUNNER_TEMP/vitamux" connector-test "${args[@]}" | tee "$RUNNER_TEMP/out"; status=${PIPESTATUS[0]}; set -e
            kill "$pid"; wait "$pid" 2> /dev/null || true
          }
          run_example ""
          [ "$status" -eq 0 ] || { echo "::error::the conformant example fails the kit"; exit 1; }
          run_example bad_cursor
          [ "$status" -eq 1 ] && grep -q '^FAIL  fetch_paging ' "$RUNNER_TEMP/out" || { echo "::error::BREAK=bad_cursor must fail fetch_paging"; exit 1; }

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Release Compose file is valid
        run: docker compose --env-file deploy/compose/.env.example -f deploy/compose/compose.yaml config -q
      # Single-arch load of the same (cached) build, for scanning.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: vitamux:ci
          build-args: |
            COMMIT=${{ github.sha }}
          cache-from: type=gha
      # Fails only on CRITICAL findings that have a fix; unfixable base-image CVEs do not block.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: vitamux:ci
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      # SPDX SBOM of the scanned image (linux/amd64), kept as the vitamux-sbom artifact. The
      # release workflow (J14.4) attaches one per platform to the published images.
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: vitamux:ci
          format: spdx-json
          output-file: vitamux.spdx.json
          artifact-name: vitamux-sbom.spdx.json

  secrets-and-licenses:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # gitleaks-action lists the PR's commits
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Fixture privacy guard (synthetic marker, emails, phones, tokens)
        run: go run ./tools/fixtureguard
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies (license files)
        run: npm --prefix web ci --ignore-scripts
      - name: Third-party notices are current and every license is allowed
        run: go run ./tools/notices -check # fix: make notices

