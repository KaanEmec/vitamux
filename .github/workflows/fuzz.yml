name: fuzz
# Nightly fuzzing of every parser (docs/plan/E13-hardening/J13.2-fuzzing-limits.md). The target
# list lives in the Makefile (FUZZ_TARGETS); ci.yml runs the same targets for 10 s each.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      fuzztime:
        description: Time per target (Go duration)
        default: 5m
permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The engine keeps the inputs it found interesting in the build cache's fuzz directory;
      # restoring it lets each night start where the last one stopped.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build/fuzz
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - name: Fuzz every target
        run: make fuzz FUZZTIME=${{ inputs.fuzztime || '5m' }}
      - name: Failing inputs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crashers
          path: "**/testdata/fuzz/**"
          retention-days: 30
