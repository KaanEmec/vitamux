# Release (J14.4): a tag vX.Y.Z or vX.Y.Z-rc.N publishes multi-arch images to GHCR, one SPDX
# SBOM per platform, the Compose bundle, checksums.txt, optional keyless signatures and release
# notes. Release candidates also run the upgrade test. Process: docs/release-checklist.md.
# Actions are pinned by commit SHA (docs/security.md#supply-chain).
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  IMAGE: ghcr.io/kaanemec/vitamux
  TAG: ${{ github.ref_name }}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # tags, for the latest check
      - name: Image tags (vX.Y and latest only for final releases; latest only for the highest one)
        id: meta
        run: |
          [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]] || { echo "::error::tag $TAG is not vX.Y.Z or vX.Y.Z-rc.N"; exit 1; }
          tags="$IMAGE:$TAG"
          if [[ $TAG != *-* ]]; then
            tags+=",$IMAGE:${TAG%.*}"
            [ "$(git tag -l 'v*' | grep -v -- - | sort -V | tail -1)" = "$TAG" ] && tags+=",${IMAGE}:latest"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Scan before anything is pushed: single-arch load of the same (cached) build.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          load: true
          tags: vitamux:scan
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: vitamux:scan
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      # Cross-compiled multi-arch build (no QEMU, see Dockerfile) with an SPDX SBOM attestation per platform.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        id: push
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: One SPDX SBOM file per platform, from the attestations
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p sbom
          for p in linux/amd64 linux/arm64; do
            f="sbom/vitamux-$TAG-${p//\//-}.spdx.json"
            docker buildx imagetools inspect "$IMAGE@$DIGEST" --format "{{ json (index .SBOM \"$p\").SPDX }}" > "$f"
            jq -e '.spdxVersion and (.packages | length > 0)' "$f" > /dev/null || { echo "::error::empty SBOM for $p"; exit 1; }
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: sbom/
          retention-days: 7

  # Release candidates only: previous final release (or, before the first one, an image built
  # from the merge-base with main) -> this tag, with data, a backup and the documented upgrade.
  upgrade-test:
    if: contains(github.ref_name, '-')
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Previous version (image and source)
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v*' --exclude '*-*' HEAD^ 2>/dev/null || true)
          if [ -n "$prev" ]; then
            ref=$prev old_image=$IMAGE:$prev
          else
            ref=$(git merge-base HEAD origin/main) old_image=vitamux:main-base
          fi
          echo "upgrade from $ref ($old_image)"
          git worktree add --detach "$RUNNER_TEMP/old" "$ref"
          if [ -z "$prev" ]; then
            docker build -t "$old_image" --build-arg "VERSION=0.0.0-main" --build-arg "COMMIT=$ref" "$RUNNER_TEMP/old"
          fi
          echo "OLD_IMAGE=$old_image" >> "$GITHUB_ENV"
          echo "OLD_SRC=$RUNNER_TEMP/old" >> "$GITHUB_ENV"
      - name: Upgrade test (scripts/upgrade-test.sh)
        run: NEW_IMAGE="$IMAGE:$TAG" scripts/upgrade-test.sh

  release:
    needs: [image, upgrade-test]
    if: ${{ !cancelled() && needs.image.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.upgrade-test.result) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # the GitHub release
      packages: write # image signatures
      id-token: write # keyless signing (Sigstore, GitHub OIDC)
    env:
      DIGEST: ${{ needs.image.outputs.digest }}
      SIGN: ${{ vars.VITAMUX_SIGN_RELEASES != 'false' }} # set the repo variable to false to skip signing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # tags and history, for the release notes
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sbom
          path: dist
      - name: Final releases need their CHANGELOG.md section (scripts/release-notes.sh --changelog)
        if: ${{ !contains(github.ref_name, '-') }}
        run: grep -q "^## $TAG " CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## $TAG' section"; exit 1; }
      - name: Compose bundle
        run: |
          b=vitamux-compose-$TAG
          mkdir -p "stage/$b/deploy/compose/initdb" "stage/$b/deploy/sql" "stage/$b/docs"
          cp deploy/compose/compose.yaml deploy/compose/.env.example deploy/compose/init-secrets.sh "stage/$b/deploy/compose/"
          cp deploy/compose/initdb/*.sql "stage/$b/deploy/compose/initdb/"
          cp deploy/sql/roles.sql "stage/$b/deploy/sql/"
          [ ! -d deploy/coolify ] || cp -R deploy/coolify "stage/$b/deploy/" # Coolify variant (docs/install.md#coolify)
          cp docs/install.md "stage/$b/docs/"
          cp LICENSE NOTICE "stage/$b/"
          # The bundle pins its own release instead of :latest.
          sed -i "s|^# VITAMUX_IMAGE=${IMAGE}:latest\$|VITAMUX_IMAGE=${IMAGE}:${TAG}|" "stage/$b/deploy/compose/.env.example"
          grep -qx "VITAMUX_IMAGE=${IMAGE}:${TAG}" "stage/$b/deploy/compose/.env.example"
          docker compose --env-file "stage/$b/deploy/compose/.env.example" -f "stage/$b/deploy/compose/compose.yaml" config -q
          tar -C stage --sort=name --owner=0 --group=0 --numeric-owner -czf "dist/$b.tar.gz" "$b"
      - name: Checksums
        run: cd dist && sha256sum -- * > checksums.txt && cat checksums.txt
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: env.SIGN == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: env.SIGN == 'true'
      - name: Keyless signatures (image digest and checksums.txt)
        if: env.SIGN == 'true'
        run: |
          cosign sign --yes "$IMAGE@$DIGEST"
          cosign sign-blob --yes --bundle dist/checksums.txt.sigstore.json dist/checksums.txt
      - name: Release notes
        run: |
          scripts/release-notes.sh "$TAG" > notes.md
          cat >> notes.md <<EOF

          ## Install

          Image \`$IMAGE:$TAG\` (linux/amd64, linux/arm64), digest \`$DIGEST\`.
          Compose bundle \`vitamux-compose-$TAG.tar.gz\`: start with \`docs/install.md\`. Verify downloads with \`sha256sum -c checksums.txt\`.
          EOF
          if [ "$SIGN" = true ]; then
            echo "Images and checksums.txt are signed keylessly with Sigstore ([verify](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/docs/security.md#supply-chain))." >> notes.md
          fi
          cat notes.md
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=()
          [[ $TAG == *-* ]] && pre=(--prerelease)
          gh release create "$TAG" dist/* --verify-tag --title "Vitamux $TAG" --notes-file notes.md "${pre[@]}"
