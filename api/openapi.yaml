openapi: 3.1.0
info:
  title: Vitamux API
  version: 0.1.0
  license:
    name: MIT
    identifier: MIT
  description: >
    Contract-first API (ADR-0015, docs/architecture/api.md). /api/v1 is for the owner (session
    cookie + X-CSRF-Token, or an API key); /api/ingest/v1 is for clients and devices. Schemas
    marked as open objects get their properties when the endpoint is implemented; changes
    within v1 are additive only.
servers:
  - url: /
tags:
  - name: ingest
    description: Raw uploads from clients, devices and importers (docs/architecture/connectors.md#push-ingest-contract).
  - name: catalogue
    description: Metric catalogue (docs/architecture/metric-catalog.md).
  - name: source-data
    description: Normalized source records with provenance (docs/architecture/data-model.md).
  - name: resolved
    description: Values selected by resolution rules (docs/architecture/resolution.md).
  - name: rules
    description: Resolution rules and manual overrides.
  - name: system
    description: Coverage, health, jobs and build information.
  - name: connections
    description: Provider connections, syncs, backfills and streams (docs/architecture/connectors.md).
  - name: devices
    description: Paired devices such as the Apple Health bridge (docs/architecture/apple-health.md).
  - name: documents
    description: Blood-test documents, extractions and lab results (docs/architecture/lab-documents.md).
  - name: exports
    description: Portable data exports (docs/architecture/api.md#exports).
  - name: auth
    description: Sign-in, sessions, TOTP and API keys (docs/architecture/security.md).
  - name: settings
    description: Owner settings and timezone periods.

paths:
  # ---------------------------------------------------------------- ingest (/api/ingest/v1)
  /api/ingest/v1/batches:
    post:
      tags: [ingest]
      operationId: createIngestBatch
      summary: Upload a batch of raw items
      description: >
        Raw data is durable before 202; normalization runs as a job afterwards. Replaying the same
        Idempotency-Key and body returns the same response. Body may be gzip-encoded
        (at most 10 MiB compressed, 50 MiB decompressed).
      security:
        - clientToken: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ContentEncoding'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '../schemas/ingest-batch.v1.json'}
      responses:
        '202':
          description: Items stored; normalization queued.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BatchAccepted'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '413': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}

  /api/ingest/v1/batches/{batch_id}:
    get:
      tags: [ingest]
      operationId: getIngestBatch
      summary: Batch status, including normalization outcomes
      security:
        - clientToken: []
      parameters:
        - $ref: '#/components/parameters/BatchID'
      responses:
        '200':
          description: Batch status.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BatchStatus'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}

  /api/ingest/v1/batches/{batch_id}/blobs:
    post:
      tags: [ingest]
      operationId: uploadIngestBlob
      summary: Upload one binary file (FIT, GPX, export zip)
      description: >
        Items reference the file by blob_sha256 (lowercase hex SHA-256 of the uploaded bytes).
        Upload it to an existing batch of the same connection before the batch that references it.
      security:
        - clientToken: []
      parameters:
        - $ref: '#/components/parameters/BatchID'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ContentEncoding'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, contentMediaType: application/octet-stream}
      responses:
        '201':
          description: File stored.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BlobStored'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '413': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}

  /api/ingest/v1/heartbeat:
    post:
      tags: [ingest]
      operationId: postIngestHeartbeat
      summary: Report client checkpoint and health
      security:
        - clientToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '../schemas/heartbeat.v1.json'}
      responses:
        '204':
          description: Recorded.
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}

  # ---------------------------------------------------------------- catalogue
  /api/v1/metrics:
    get:
      tags: [catalogue]
      operationId: listMetrics
      summary: List catalogue metrics
      security: [{session: []}, {apiKey: ['read:health']}]
      responses:
        '200':
          description: All metrics.
          content:
            application/json:
              schema:
                type: object
                required: [metrics]
                properties:
                  metrics: {type: array, items: {$ref: '#/components/schemas/Metric'}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}

  /api/v1/metrics/{code}:
    get:
      tags: [catalogue]
      operationId: getMetric
      summary: Get one catalogue metric
      security: [{session: []}, {apiKey: ['read:health']}]
      parameters:
        - $ref: '#/components/parameters/MetricCodePath'
      responses:
        '200':
          description: The metric.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Metric'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}

  # ---------------------------------------------------------------- source data
  /api/v1/measurements:
    get:
      tags: [source-data]
      operationId: listMeasurements
      summary: List normalized measurements
      description: >
        Active rows by default, ordered by (start_at, id); include=superseded adds earlier
        versions and include=deleted adds rows deleted upstream. start/end filter start_at,
        start_date/end_date the local date. include=provenance adds the raw payload's fetch
        metadata.
      security: [{session: []}, {apiKey: ['read:health']}]
      parameters:
        - $ref: '#/components/parameters/Start'
        - $ref: '#/components/parameters/End'
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
        - $ref: '#/components/parameters/MetricFilter'
        - $ref: '#/components/parameters/ProviderFilter'
        - $ref: '#/components/parameters/ConnectionFilter'
        - $ref: '#/components/parameters/DeviceFilter'
        - $ref: '#/components/parameters/OriginFilter'
        - $ref: '#/components/parameters/KindFilter'
        - $ref: '#/components/parameters/Include'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of measurements.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MeasurementPage'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}

  /api/v1/measurements/manual:
    post:
      tags: [source-data]
      operationId: createManualMeasurement
      summary: Record a manual measurement (provider manual, audited)
      security: [{session: [], csrf: []}, {apiKey: ['write:config']}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ManualMeasurementInput'}
      responses:
        '201':
          description: Stored.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Measurement'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}

  /api/v1/groups:
    get:
      tags: [source-data]
      operationId: listGroups
      summary: List measurement groups (blood-pressure readings, weigh-ins)
      description: >
        Groups with their components, ordered by (measured_at, id). Filters and include work as
        on /measurements.
      security: [{session: []}, {apiKey: ['read:health']}]
      parameters:
        - name: kind
          in: query
          required: false
          schema: {type: string, enum: [bp_reading, body_composition]}
        - $ref: '#/components/parameters/Start'
        - $ref: '#/components/parameters/End'
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
        - $ref: '#/components/parameters/ProviderFilter'
        - $ref: '#/components/parameters/ConnectionFilter'
        - $ref: '#/components/parameters/DeviceFilter'
        - $ref: '#/components/parameters/OriginFilter'
        - $ref: '#/components/parameters/Include'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of groups.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GroupPage'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}

  /api/v1/blood-pressure:
    get:
      tags: [source-data]
      operationId: listBloodPressure
      summary: List blood-pressure readings
      description: >
        bp_reading groups with their components side by side, ordered by (measured_at, id).
        Filters and include work as on /measurements.
      security: [{session: []}, {apiKey: ['read:health']}]
      parameters:
        - $ref: '#/components/parameters/Start'
        - $ref: '#/components/parameters/End'
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
        - $ref: '#/components/parameters/ProviderFilter'
        - $ref: '#/components/parameters/ConnectionFilter'
        - $ref: '#/components/parameters/DeviceFilter'
        - $ref: '#/components/parameters/OriginFilter'
        - $ref: '#/components/parameters/Include'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of readings.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BloodPressurePage'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}

  /api/v1/sleep:
    get:
      tags: [source-data]
      operationId: listSleep
      summary: List sleep sessions
      description: >
        Ordered by (start_at, id). start_date/end_date filter sleep_date (the local wake date),
        start/end filter start_at. include=stages adds the stages; other filters and include
        work as on /measurements.
      security: [{session: []}, {apiKey: ['read:health']}]
      parameters:
        - $ref: '#/components/parameters/Start'
        - $ref: '#/components/parameters/End'
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
        - $ref: '#/components/parameters/ProviderFilter'
        - $ref: '#/components/parameters/ConnectionFilter'
        - $ref: '#/components/parameters/DeviceFilter'
        - $ref: '#/components/parameters/OriginFilter'
        - $ref: '#/components/parameters/Include'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of sleep sessions.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SleepPage'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}

  /api/v1/sleep/{id}:
    get:
      tags: [source-data]
      operationId: getSleep
      summary: Get one sleep session
      description: Any version, superseded or deleted included, always with its stages.
      security: [{session: []}, {apiKey: ['read:health']}]
      parameters:
        - $ref: '#/components/parameters/ID'
        - $ref: '#/components/parameters/Include'
      responses:
        '200':
          description: The sleep session.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SleepSession'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}

  /api/v1/workouts:
    get:
      tags: [source-data]
      operationId: listWorkouts
      summary: List workouts
      description: >
        Ordered by (start_at, id). include=segments adds the laps, sets or intervals; other
        filters and include work as on /measurements.
      security: [{session: []}, {apiKey: ['read:health']}]
      parameters:
        - $ref: '#/components/parameters/Start'
        - $ref: '#/components/parameters/End'
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
        - $ref: '#/components/parameters/ProviderFilter'
        - $ref: '#/components/parameters/ConnectionFilter'
        - $ref: '#/components/parameters/DeviceFilter'
        - $ref: '#/components/parameters/OriginFilter'
        - $ref: '#/components/parameters/Include'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of workouts.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkoutPage'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}

  /api/v1/workouts/{id}:
    get:
      tags: [source-data]
      operationId: getWorkout
      summary: Get one workout
      description: Any version, superseded or deleted included, always with its segments.
      security: [{session: []}, {apiKey: ['read:health']}]
      parameters:
        - $ref: '#/components/parameters/ID'
        - $ref: '#/components/parameters/Include'
      responses:
        '200':
          description: The workout.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Workout'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}

  /api/v1/provenance/{entity}/{id}:
    get:
      tags: [source-data]
      operationId: getProvenance
      summary: Trace a record back to its raw payload, batch and normalizer
      security: [{session: []}, {apiKey: ['read:health']}]
      parameters:
        - name: entity
          in: path
          required: true
          description: Record type.
          schema: {type: string, enum: [measurement, group, sleep, workout]}
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: The provenance trace.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Provenance'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}

  # ---------------------------------------------------------------- resolved
  /api/v1/resolved/daily:
    get:
      tags: [resolved]
      operationId: getResolvedDaily
      summary: Resolved values per local day
      description: Example in docs/architecture/api.md#example-resolved-day.
      security: [{session: []}, {apiKey: ['read:health']}]
      parameters:
        - $ref: '#/components/parameters/StartDateRequired'
        - $ref: '#/components/parameters/EndDateRequired'
        - name: metrics
          in: query
          required: false
          description: Comma-separated metric codes; all resolvable metrics when omitted.
          style: form
          explode: false
          schema: {type: array, items: {type: string}}
      responses:
        '200':
          description: One entry per local day.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ResolvedDaily'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}

  /api/v1/resolved/series:
    get:
      tags: [resolved]
      operationId: getResolvedSeries
      summary: Resolved series of one metric over a range
      security: [{session: []}, {apiKey: ['read:health']}]
      parameters:
        - name: metric
          in: query
          required: true
          schema: {type: string}
        - name: start
          in: query
          required: true
          schema: {type: string, format: date-time}
        - name: end
          in: query
          required: true
          schema: {type: string, format: date-time}
        - name: window
          in: query
          required: false
          description: Window kind or bucket size, e.g. hour, local_day, 5m.
          schema: {type: string}
      responses:
        '200':
          description: Points with a source per point.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ResolvedSeries'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}

  /api/v1/resolved/sleep:
    get:
      tags: [resolved]
      operationId: getResolvedSleep
      summary: Resolved sleep episodes per night
      security: [{session: []}, {apiKey: ['read:health']}]
      parameters:
        - $ref: '#/components/parameters/StartDateRequired'
        - $ref: '#/components/parameters/EndDateRequired'
      responses:
        '200':
          description: Selected episodes.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ResolvedEvents'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}

  /api/v1/resolved/workouts:
    get:
      tags: [resolved]
      operationId: getResolvedWorkouts
      summary: Resolved workouts
      security: [{session: []}, {apiKey: ['read:health']}]
      parameters:
        - $ref: '#/components/parameters/StartDateRequired'
        - $ref: '#/components/parameters/EndDateRequired'
      responses:
        '200':
          description: Selected workouts.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ResolvedEvents'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}

  /api/v1/resolved/{metric}/{window_key}/sources:
    get:
      tags: [resolved]
      operationId: getResolvedSources
      summary: All-sources drilldown for one metric and window
      description: Example in docs/architecture/api.md#example-all-sources-drilldown.
      security: [{session: []}, {apiKey: ['read:health']}]
      parameters:
        - $ref: '#/components/parameters/MetricPath'
        - name: window_key
          in: path
          required: true
          description: Window key, e.g. a local date (2026-09-14) or an hour start.
          schema: {type: string}
      responses:
        '200':
          description: Every source, including excluded ones.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SourcesDrilldown'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}

  /api/v1/resolution/preview:
    post:
      tags: [resolved]
      operationId: previewResolution
      summary: Resolve a draft rule over a range without writing anything
      security: [{session: [], csrf: []}, {apiKey: ['read:health']}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResolutionPreviewRequest'}
      responses:
        '200':
          description: Preview results.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ResolutionPreview'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}

  # ---------------------------------------------------------------- rules and overrides
  /api/v1/rules:
    get:
      tags: [rules]
      operationId: listRules
      summary: List active rules per metric
      security: [{session: []}, {apiKey: ['read:config']}]
      responses:
        '200':
          description: Active rules.
          content:
            application/json:
              schema:
                type: object
                required: [rules]
                properties:
                  rules: {type: array, items: {$ref: '#/components/schemas/Rule'}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}

  /api/v1/rules/{metric}/versions:
    get:
      tags: [rules]
      operationId: listRuleVersions
      summary: List the versions of a metric's rule
      security: [{session: []}, {apiKey: ['read:config']}]
      parameters:
        - $ref: '#/components/parameters/MetricPath'
      responses:
        '200':
          description: Versions, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [versions]
                properties:
                  versions: {type: array, items: {$ref: '#/components/schemas/RuleVersion'}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
    post:
      tags: [rules]
      operationId: createRuleVersion
      summary: Save a new rule version (not yet active)
      security: [{session: [], csrf: []}, {apiKey: ['write:config']}]
      parameters:
        - $ref: '#/components/parameters/MetricPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RuleVersionInput'}
      responses:
        '201':
          description: Saved.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RuleVersion'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}

  /api/v1/rules/{metric}/activate:
    post:
      tags: [rules]
      operationId: activateRule
      summary: Activate a rule version
      security: [{session: [], csrf: []}, {apiKey: ['write:config']}]
      parameters:
        - $ref: '#/components/parameters/MetricPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RuleActivation'}
      responses:
        '200':
          description: The now active version.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RuleVersion'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}

  /api/v1/overrides:
    get:
      tags: [rules]
      operationId: listOverrides
      summary: List manual overrides
      security: [{session: []}, {apiKey: ['read:config']}]
      parameters:
        - $ref: '#/components/parameters/MetricFilter'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of overrides.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OverridePage'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
    post:
      tags: [rules]
      operationId: createOverride
      summary: Create a manual override (audited, reversible)
      security: [{session: [], csrf: []}, {apiKey: ['write:config']}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OverrideInput'}
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Override'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}

  /api/v1/overrides/{id}/revoke:
    post:
      tags: [rules]
      operationId: revokeOverride
      summary: Revoke a manual override
      security: [{session: [], csrf: []}, {apiKey: ['write:config']}]
