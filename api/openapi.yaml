    LabResult:
      type: object
      description: >-
        A confirmed lab result at one revision. The printed label, value, unit, range and flag are always kept; the
        canonical value exists only when the analyte has a conversion for the printed unit. No interpretation.
      required: [id, revision, analyte, original_label, value_text, value_numeric, comparator, unit_text, reference_range_text, ref_low,
        ref_high, printed_flag, specimen_type, canonical_value, canonical_unit, conversion_factor, conversion_offset, catalog_version,
        collected_at, collected_date, page, evidence_text, created_at, updated_at, provenance]
      properties:
        id: {type: string, pattern: '^lab_[0-9a-f]{32}$'}
        revision: {type: integer, minimum: 1}
        analyte: {type: [string, 'null'], description: Analyte code; null for an unknown analyte.}
        original_label: {type: string}
        value_text: {type: string}
        value_numeric: {type: [number, 'null'], format: double}
        comparator: {type: [string, 'null']}
        unit_text: {type: [string, 'null'], description: Printed unit; null means confirmed as unitless.}
        reference_range_text: {type: [string, 'null']}
        ref_low: {type: [number, 'null'], format: double}
        ref_high: {type: [number, 'null'], format: double}
        printed_flag: {type: [string, 'null']}
        specimen_type: {type: [string, 'null']}
        canonical_value: {type: [number, 'null'], format: double}
        canonical_unit: {type: [string, 'null']}
        conversion_factor: {type: [number, 'null'], format: double, description: canonical = value * factor + offset.}
        conversion_offset: {type: [number, 'null'], format: double}
        catalog_version: {type: [integer, 'null']}
        collected_at: {type: [string, 'null'], format: date-time, description: Null when only a date was printed or no timezone is configured.}
        collected_date: {type: string, format: date, description: Collection date as printed (the owner's local date).}
        page: {type: [integer, 'null']}
        evidence_text: {type: [string, 'null']}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time, description: When this revision was written.}
        provenance:
          type: object
          required: [report_id, document_id, extraction_id, row_index, laboratory, reported_at, provider, model, schema_version,
            prompt_version, confirmed_by, confirmed_at]
          properties:
            report_id: {type: string, pattern: '^rpt_[0-9a-f]{32}$'}
            document_id: {type: string, pattern: '^doc_[0-9a-f]{32}$'}
            extraction_id: {type: [string, 'null'], pattern: '^ext_[0-9a-f]{32}$', description: Null once the original and its runs were deleted.}
            row_index: {type: [integer, 'null']}
            laboratory: {type: [string, 'null']}
            reported_at: {type: [string, 'null'], format: date-time}
            provider: {type: string}
            model: {type: [string, 'null']}
            schema_version: {type: string}
            prompt_version: {type: string}
            confirmed_by: {type: string}
            confirmed_at: {type: string, format: date-time}
    LabResultPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [lab_results]
          properties:
            lab_results: {type: array, items: {$ref: '#/components/schemas/LabResult'}}
    AnalyteAlias:
      type: object
      description: A printed label mapped to an analyte (docs/analytes.md). Owner aliases take precedence over seeded ones.
      required: [id, label, analyte, source, created_at]
      properties:
        id: {type: string, pattern: '^[0-9]+$'}
        label: {type: string}
        analyte: {type: string, pattern: '^[a-z][a-z0-9_]*$', description: Analyte code.}
        source: {type: string, enum: [seed, owner]}
        created_at: {type: string, format: date-time}
    AnalyteAliasInput:
      type: object
      required: [label, analyte]
      properties:
        label: {type: string, minLength: 1, maxLength: 200}
        analyte: {type: string, pattern: '^[a-z][a-z0-9_]*$', description: Analyte code from docs/analytes.md.}
    Settings:
      type: object
      description: Owner settings. PATCH changes only the keys it sends.
      additionalProperties: false
      properties:
        withings.notifications: {type: boolean, description: Withings notification subscriptions (polling runs either way); needs VITAMUX_PUBLIC_URL.}
        documents.external_ai.gemini.enabled: {type: boolean, description: Allow lab extraction with the configured Gemini model (each run still needs consent).}
        documents.external_ai.openai.enabled: {type: boolean, description: Allow lab extraction with the configured OpenAI model (each run still needs consent).}
        documents.external_ai.openai_compatible.enabled: {type: boolean, description: Allow lab extraction with the configured OpenAI-compatible server (each run still needs consent).}
        documents.retention_days:
          type: [integer, 'null']
          minimum: 1
          maximum: 36500
          description: Days to keep lab PDF originals after upload; null keeps them. Applies to every live document.
          x-go-type: json.RawMessage
          x-go-type-skip-optional-pointer: true
        documents.delete_original_after_confirmation: {type: boolean, description: Delete a lab PDF original once its extraction is confirmed (results are kept).}
        retention.raw_days:
          type: object
          additionalProperties: {type: integer, minimum: 0, maximum: 36500}
          description: Days to keep raw payloads, per provider code; a missing provider or 0 keeps them (default). PATCH merges per provider. Pruned raw cannot be reprocessed; the prune_raw job keeps raw that reprocessing still needs.
        retention.superseded_after_days: {type: integer, minimum: 0, maximum: 36500, description: Days to keep superseded canonical rows; 0 keeps them (default).}
        retention.idempotency_key_days: {type: integer, minimum: 7, maximum: 36500, description: Days to keep stored ingest responses for Idempotency-Key replays (default 30).}
        sources.priority:
          type: array
          items: {type: string}
          uniqueItems: true
          description: >
            The owner's source order: provider codes, first preferred. Metrics without a built-in
            resolve through the default rule, which tries these providers first
            (docs/resolution-defaults.md#default-rule). Empty by default.
    TimezonePeriod:
      type: object
      additionalProperties: false
      required: [id, tz, valid_from, valid_to]
      properties:
        id: {type: string, format: uuid}
        tz: {type: string, description: IANA timezone.}
        valid_from: {type: string, format: date-time}
        valid_to: {type: [string, 'null'], format: date-time, description: Start of the next period; null for the current one.}
    TimezonePeriodInput:
      type: object
      additionalProperties: false
      required: [tz, valid_from]
      properties:
        tz: {type: string, description: IANA timezone.}
        valid_from: {type: string, format: date-time}
