        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of runs.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunPage'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}

  /api/v1/connections/{id}/streams:
    get:
      tags: [connections]
      operationId: listConnectionStreams
      summary: List the streams of a connection with cursor and status
      security: [{session: []}, {appSession: []}, {apiKey: ['read:config']}]
      parameters:
        - $ref: '#/components/parameters/ConnectionIDPath'
      responses:
        '200':
          description: Streams.
          content:
            application/json:
              schema:
                type: object
                required: [streams]
                properties:
                  streams: {type: array, items: {$ref: '#/components/schemas/Stream'}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}

  /api/v1/connections/{id}/streams/{stream}/reset-cursor:
    post:
      tags: [connections]
      operationId: resetStreamCursor
      summary: Reset a stream's sync cursor
      security: [{session: [], csrf: []}, {appSession: []}, {apiKey: ['write:config']}]
      parameters:
        - $ref: '#/components/parameters/ConnectionIDPath'
        - name: stream
          in: path
          required: true
          schema: {type: string}
      description: >
        The next incremental sync starts over from the connector's initial window; stored data is
        kept and re-fetched records deduplicate. In-process connections only, and not while one
        of the connection's jobs runs (409).
      responses:
        '200':
          description: The stream after reset.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Stream'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}

  /api/v1/schedules:
    get:
      tags: [connections]
      operationId: listSchedules
      summary: List sync schedules
      security: [{session: []}, {appSession: []}, {apiKey: ['read:config']}]
      parameters:
        - name: connection
          in: query
          required: false
          description: Only this connection's schedules.
          schema: {$ref: '#/components/schemas/ConnectionID'}
      responses:
        '200':
          description: Schedules.
          content:
            application/json:
              schema:
                type: object
                required: [schedules]
                properties:
                  schedules: {type: array, items: {$ref: '#/components/schemas/Schedule'}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}

  /api/v1/schedules/{id}:
    patch:
      tags: [connections]
      operationId: updateSchedule
      summary: Change a schedule's interval, lookback or enabled flag
      security: [{session: [], csrf: []}, {appSession: []}, {apiKey: ['write:config']}]
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SchedulePatch'}
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Schedule'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}

  # ---------------------------------------------------------------- devices
  /api/v1/devices:
    get:
      tags: [devices]
      operationId: listDevices
      summary: List paired devices, newest first, including revoked ones
      security: [{session: []}, {appSession: []}, {apiKey: ['read:config']}]
      responses:
        '200':
          description: Devices.
          content:
            application/json:
              schema:
                type: object
                required: [devices]
                properties:
                  devices: {type: array, items: {$ref: '#/components/schemas/PairedDevice'}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}

  /api/v1/devices/pairing-codes:
    post:
      tags: [devices]
      operationId: createPairingCode
      summary: Create a single-use pairing code, valid for 10 minutes
      description: At most 5 codes per 10 minutes (429 with Retry-After). 503 without VITAMUX_PUBLIC_URL.
      security: [{session: [], csrf: []}, {appSession: []}, {apiKey: ['write:config']}]
      responses:
        '201':
          description: The code (shown once).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PairingCode'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}

  /api/v1/devices/{id}/request-anchor-reset:
    post:
      tags: [devices]
      operationId: requestDeviceAnchorReset
      summary: Ask the device to resync types from scratch on its next contact
      description: >
        The device reads the request from GET /api/ingest/v1/devices/self. Re-sent samples are
        deduplicated by UUID.
      security: [{session: [], csrf: []}, {appSession: []}, {apiKey: ['write:config']}]
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                types:
                  type: array
                  maxItems: 64
                  description: HealthKit type identifiers; omitted or empty resets every type.
                  items: {type: string, pattern: '^HK[A-Za-z0-9]{1,126}$'}
      responses:
        '204':
          description: Requested.
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}

  /api/v1/devices/{id}/revoke:
    post:
      tags: [devices]
      operationId: revokeDevice
      summary: Revoke a device's token; its next request is 401
      security: [{session: [], csrf: []}, {appSession: []}, {apiKey: ['write:config']}]
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '204':
          description: Revoked.
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}

  /api/v1/origins:
    get:
      tags: [devices]
      operationId: listOrigins
      summary: List the apps (origins) data was recorded by, with their native or relayed state
      description: >
        Every origin seen inside a transport provider such as apple_health, by provider and key.
        relay_targets are the vendors an origin can be classified as relaying.
      security: [{session: []}, {appSession: []}, {apiKey: ['read:config']}]
      responses:
        '200':
          description: Origins and the vendors they may relay.
          content:
            application/json:
              schema:
                type: object
                required: [origins, relay_targets]
                properties:
                  origins: {type: array, items: {$ref: '#/components/schemas/DataOrigin'}}
                  relay_targets: {type: array, items: {$ref: '#/components/schemas/RelayTarget'}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}

  /api/v1/origins/{id}:
    patch:
      tags: [devices]
      operationId: classifyOrigin
      summary: Set or clear the vendor an origin relays
      description: >
        The `relayed` rule selector and the all-sources view read the new state at once; resolved
        results are recomputed. The edit is audited and wins over the known relay defaults, which only seed
        new origins.
      security: [{session: [], csrf: []}, {appSession: []}, {apiKey: ['write:config']}]
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [relayed_provider]
              properties:
                relayed_provider:
                  type: [string, 'null']
                  description: A code from relay_targets, or null for an origin that records its own data.
      responses:
        '204':
          description: Classified.
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}

  /api/v1/source-devices:
    get:
      tags: [devices]
      operationId: listSourceDevices
      summary: List the devices measurements were recorded on (not the paired apps)
      description: >-
        The values the device_type, device_manufacturer and device_model rule selectors match (the rule builder's
        brand and device choices), the owner's names and merges, and the device types the owner can set. `include=records` adds each device's active records per connection.
      security: [{session: []}, {appSession: []}, {apiKey: ['read:config']}]
      parameters:
        - name: include
          in: query
          required: false
          description: Comma-separated expansions.
          style: form
          explode: false
          schema: {type: array, items: {type: string, enum: [records]}}
      responses:
        '200':
          description: Devices.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [devices, device_types]
                properties:
                  devices: {type: array, items: {$ref: '#/components/schemas/SourceDevice'}}
                  device_types:
                    type: array
                    items: {type: string}
                    description: The values PATCH accepts for device_type, which the built-in rules match.
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}

  /api/v1/source-devices/{id}:
    patch:
      tags: [devices]
      operationId: updateSourceDevice
      summary: Set a device's type or name (audited)
      description: >-
        Merge patch: a field present replaces the value, null clears it. A type set here wins over the one the
        normalizer reports (null hands it back); rules that select by device type are recomputed. 409 for a merged
        device: edit the device it was merged into.
      security: [{session: [], csrf: []}, {appSession: []}]
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SourceDevicePatch'}
      responses:
        '204':
          description: Updated.
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}

  /api/v1/source-devices/{id}/merge:
    post:
      tags: [devices]
      operationId: mergeSourceDevice
      summary: Merge a device into another device of the same provider (audited, irreversible)
      description: >-
        One transaction moves every record of the device (measurements, groups, sleep sessions, workouts, health
        events, superseded versions included) to the target, points the device and those already merged into it at
        the target, and marks the moved dates for recomputation. Later records of the device's fingerprint are written
        to the target. Dedupe keys keep the fingerprint, so reprocessing changes nothing. Rules that name the merged
        device by id stop matching it. 409 when either device is already merged; 422 for the device itself or a
        device of another provider.
      security: [{session: [], csrf: []}, {appSession: []}]
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [into]
              properties:
                into: {$ref: '#/components/schemas/DeviceID'}
      responses:
        '200':
          description: Merged; the rows moved per table.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [moved]
                properties:
                  moved: {$ref: '#/components/schemas/DeviceRecords'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}

  # ---------------------------------------------------------------- documents and labs
  /api/v1/documents:
    get:
      tags: [documents]
      operationId: listDocuments
      summary: List documents
      security: [{session: []}, {appSession: []}, {apiKey: ['read:health']}]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of documents.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DocumentPage'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
    post:
      tags: [documents]
      operationId: uploadDocument
      summary: Upload a blood-test PDF (at most 20 MiB and 50 pages)
      description: >-
        Send the PDF as the `file` part of a multipart form (its filename is stored encrypted) or as a raw
        `application/pdf` body. Encrypted, oversized, too-long and non-PDF files are refused: 413 `payload_too_large`,
        or 422 `validation_failed` whose `errors[0].detail` is the reason (`not_pdf`, `empty`, `encrypted`,
        `too_many_pages`, `malformed`). Content the owner already stored links to the existing document (200).
      security: [{session: [], csrf: []}, {appSession: []}, {apiKey: ['write:documents']}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, contentMediaType: application/pdf}
          application/pdf:
            schema: {type: string, contentMediaType: application/pdf}
      responses:
        '200':
          description: Already stored; the existing document.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Document'}
        '201':
          description: Stored.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Document'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '413': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}

  /api/v1/documents/{id}:
    get:
      tags: [documents]
      operationId: getDocument
      summary: Get one document
      security: [{session: []}, {appSession: []}, {apiKey: ['read:health']}]
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: The document.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Document'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
    delete:
      tags: [documents]
      operationId: deleteDocument
      summary: Delete a document, keeping or deleting derived lab results
      security: [{session: [], csrf: []}, {appSession: []}, {apiKey: ['write:documents']}]
      parameters:
        - $ref: '#/components/parameters/ID'
        - name: derived
          in: query
          required: true
          schema: {type: string, enum: [keep, delete]}
      responses:
        '204':
          description: Deleted.
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}

  /api/v1/documents/{id}/file:
    get:
      tags: [documents]
      operationId: getDocumentFile
      summary: Download the original PDF
      security: [{session: []}, {appSession: []}, {apiKey: ['read:health']}]
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: The PDF.
          content:
            application/pdf:
              schema: {type: string, contentMediaType: application/pdf}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}

  /api/v1/documents/{id}/extractions:
    get:
      tags: [documents]
      operationId: listExtractions
      summary: List a document's extraction runs, newest first (never the raw provider response)
      security: [{session: []}, {appSession: []}, {apiKey: ['read:health']}]
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: The runs.
          content:
            application/json:
              schema:
                type: object
                required: [extractions]
                properties:
                  extractions: {type: array, items: {$ref: '#/components/schemas/Extraction'}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
    post:
      tags: [documents]
      operationId: createExtraction
      summary: Start an extraction run (may send the PDF to the configured external extractor)
      description: >-
        Queues an `extract_document` job (ADR-0013). An external provider must be configured and enabled
        (`documents.external_ai.<provider>.enabled`), else 403 `forbidden`; the body must carry `consent` naming the
        same provider and its configured model, else 409 `consent_required`. `fake` needs neither. A run already
        queued or running answers 409 `conflict`. Idempotency-Key is accepted.
      security: [{session: [], csrf: []}, {appSession: []}, {apiKey: ['write:documents']}]
      parameters:
        - $ref: '#/components/parameters/ID'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExtractionInput'}
      responses:
        '202':
          description: Queued.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Extraction'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}

  /api/v1/extractors:
    get:
      tags: [documents]
      operationId: listExtractors
      summary: Extraction providers this server has configured, with the model consent must name
      description: >-
        `fake` is always listed. An external provider is listed once the admin configured it; `enabled` is the owner's
        setting `documents.external_ai.<provider>.enabled` (always true for `fake`). The consent dialog names `model`.
      security: [{session: []}, {appSession: []}, {apiKey: ['read:config']}]
      responses:
        '200':
          description: The providers, in a fixed order.
          content:
            application/json:
              schema:
                type: object
                required: [extractors]
                properties:
                  extractors: {type: array, items: {$ref: '#/components/schemas/Extractor'}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}

  /api/v1/extractions/{id}:
    get:
      tags: [documents]
      operationId: getExtraction
      summary: Get an extraction run with its rows, suggestions and validation warnings
      description: >-
        Rows carry the extractor's warnings, deterministic validation warnings (lab-documents.md#validation), the alias
        suggestion and their review trail. Warnings only point at what to compare with the PDF; nothing is interpreted.
      security: [{session: []}, {appSession: []}, {apiKey: ['read:health']}]
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: The extraction.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Extraction'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}

  /api/v1/extractions/{id}/rows/{row}:
    patch:
      tags: [documents]
      operationId: updateExtractionRow
      summary: Edit, accept or reject an extracted row during review (audited)
      description: >-
        Merge patch: fields present replace the row's values (null clears one; `analyte: null` marks it unknown) and are
        appended to the row's edit trail with their previous values. `review` accepts or rejects the row; any change
        marks it edited. Rows of a confirmed run may still be edited; confirm again to revise the results. 409 when the
        run has no rows to review (not succeeded).
      security: [{session: [], csrf: []}, {appSession: []}, {apiKey: ['write:documents']}]
      parameters:
        - $ref: '#/components/parameters/ID'
        - name: row
          in: path
          required: true
          description: Row index (0-based).
          schema: {type: string, pattern: '^[0-9]{1,4}$'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExtractionRowPatch'}
      responses:
        '200':
          description: The edited row.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExtractionRow'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}

  /api/v1/extractions/{id}/confirm:
    post:
      tags: [documents]
      operationId: confirmExtraction
      summary: Confirm reviewed rows as lab results
      description: >-
        One transaction creates the lab report and a result per kept row (printed label, value, unit, range and flag;
        a canonical value only when the analyte has a conversion for the printed unit). 422 lists rows not yet reviewed
        and kept rows missing a value or collection date; an accepted row without a unit is confirmed as unitless. 409
        when the run is not succeeded or another run of the document is confirmed. Confirming again applies later edits:
        changed results get a new revision (see /lab-results/{id}/history).
      security: [{session: [], csrf: []}, {appSession: []}, {apiKey: ['write:documents']}]
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: The confirmed extraction with its rows.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Extraction'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}

  /api/v1/extractions/{id}/unconfirm:
    post:
      tags: [documents]
      operationId: unconfirmExtraction
      summary: Delete the lab results confirmed from a run and return it to review (audited)
      description: 409 when the run is not the document's confirmed one.
      security: [{session: [], csrf: []}, {appSession: []}, {apiKey: ['write:documents']}]
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: The extraction, back in review.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Extraction'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}

  /api/v1/lab-results:
    get:
      tags: [documents]
      operationId: listLabResults
      summary: List confirmed lab results by collection date
      security: [{session: []}, {appSession: []}, {apiKey: ['read:health']}]
      parameters:
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of lab results.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LabResultPage'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}

  /api/v1/lab-results/{id}/history:
    get:
      tags: [documents]
      operationId: getLabResultHistory
      summary: Revisions of one lab result
      security: [{session: []}, {appSession: []}, {apiKey: ['read:health']}]
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Revisions, newest (the current one) first.
          content:
            application/json:
              schema:
                type: object
                required: [revisions]
                properties:
                  revisions: {type: array, items: {$ref: '#/components/schemas/LabResult'}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}

  /api/v1/analytes/aliases:
    get:
      tags: [documents]
      operationId: listAnalyteAliases
      summary: List analyte aliases
      security: [{session: []}, {appSession: []}, {apiKey: ['read:config']}]
      responses:
        '200':
          description: Aliases.
          content:
            application/json:
              schema:
                type: object
                required: [aliases]
                properties:
                  aliases: {type: array, items: {$ref: '#/components/schemas/AnalyteAlias'}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      tags: [documents]
      operationId: createAnalyteAlias
      summary: Map a printed label to an analyte
      security: [{session: [], csrf: []}, {appSession: []}, {apiKey: ['write:config']}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AnalyteAliasInput'}
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AnalyteAlias'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}

  /api/v1/analytes/aliases/{id}:
    delete:
      tags: [documents]
      operationId: deleteAnalyteAlias
      summary: Remove an owner alias (seeded aliases cannot be removed)
      security: [{session: [], csrf: []}, {appSession: []}, {apiKey: ['write:config']}]
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '204':
          description: Removed.
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}

  # ---------------------------------------------------------------- exports
  /api/v1/exports:
    post:
      tags: [exports]
      operationId: createExport
      summary: Start an export job
      description: >
        Needs the admin scope: an export holds every health row, raw payload, rule and audit
        event at once. 409 while another export is queued or running.
      security: [{session: [], csrf: []}, {appSession: []}, {apiKey: [admin]}]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExportRequest'}
      responses:
        '202':
          description: Queued.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Export'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}

  /api/v1/exports/{id}:
    get:
      tags: [exports]
      operationId: getExport
      summary: Export status; carries a one-time download URL when done
      security: [{session: []}, {appSession: []}, {apiKey: [admin]}]
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: The export.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Export'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}

  /api/v1/exports/{id}/download:
    get:
      tags: [exports]
      operationId: downloadExport
      summary: Download the export zip with its one-time, short-lived token
      description: The token comes from getExport, works once and expires after 10 minutes (403 otherwise).
      security: [{session: []}, {appSession: []}, {apiKey: [admin]}]
      parameters:
        - $ref: '#/components/parameters/ID'
        - name: token
          in: query
          required: true
          schema: {type: string}
      responses:
        '200':
          description: The zip (one file per table plus manifest.json).
          content:
            application/zip:
              schema: {type: string, contentMediaType: application/zip}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}

  # ---------------------------------------------------------------- auth (hand-written handlers in internal/api/auth.go)
  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Sign in; sets the session cookie, or returns an app session token
      description: >
        Answers 429 with Retry-After while the username or address is locked out. With
        `client: app` it sets no cookie and answers an app session: a bearer token
        `vmx_ses_<id>_<secret>`, shown in this response only, listed under `device_name`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200':
          description: 'Signed in: a browser session, or an app session with `client: app`.'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Session'
                  - $ref: '#/components/schemas/AppSession'
        '401': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}

  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Sign out (ends the calling browser or app session)
      security: [{session: [], csrf: []}, {appSession: []}]
      responses:
        '204':
          description: Signed out.
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}

  /api/v1/auth/session:
    get:
      tags: [auth]
      operationId: getSession
      summary: Current user and CSRF token (empty for an app session)
      security: [{session: []}, {appSession: []}]
      responses:
        '200':
          description: The session.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}

  /api/v1/auth/totp/enroll:
    post:
      tags: [auth]
      operationId: enrollTOTP
      summary: Start TOTP enrolment
      security: [{session: [], csrf: []}, {appSession: []}]
      responses:
        '200':
          description: Secret and otpauth URI (shown once).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TOTPEnrollment'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}

  /api/v1/auth/totp/confirm:
    post:
      tags: [auth]
      operationId: confirmTOTP
      summary: Confirm TOTP enrolment with a code
      security: [{session: [], csrf: []}, {appSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: {type: string}
      responses:
        '200':
          description: Recovery codes (shown once).
          content:
            application/json:
              schema:
                type: object
                required: [recovery_codes]
                properties:
                  recovery_codes: {type: array, items: {type: string}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}

  /api/v1/auth/totp/disable:
    post:
      tags: [auth]
      operationId: disableTOTP
      summary: Disable TOTP (password plus a code or recovery code)
      security: [{session: [], csrf: []}, {appSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: {type: string}
                totp_code: {type: string}
                recovery_code: {type: string}
      responses:
        '204':
          description: Disabled.
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}

  /api/v1/auth/password:
    post:
      tags: [auth]
      operationId: changePassword
      summary: Change the password; ends every other session
      description: >
        Re-checks the current password (a wrong one is 422 on /current_password; repeated
        failures answer 429 with Retry-After). The new password needs at least 12 characters.
        The calling session stays signed in. Audited.
      security: [{session: [], csrf: []}, {appSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: {type: string}
                new_password: {type: string, minLength: 12, maxLength: 1024}
      responses:
        '204':
          description: Changed.
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}

  /api/v1/auth/sessions:
    get:
      tags: [auth]
      operationId: listSessions
      summary: List the owner's live sessions
      security: [{session: []}, {appSession: []}]
      responses:
        '200':
          description: Live sessions, most recently used first.
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions: {type: array, items: {$ref: '#/components/schemas/ActiveSession'}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}

  /api/v1/auth/sessions/{id}:
    delete:
      tags: [auth]
      operationId: revokeSession
      summary: End one browser or app session (ending the current one also clears its cookie)
      security: [{session: [], csrf: []}, {appSession: []}]
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '204':
          description: Ended.
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}

  /api/v1/api-keys:
    get:
      tags: [auth]
      operationId: listAPIKeys
      summary: List API keys
      security: [{session: []}, {appSession: []}, {apiKey: [admin]}]
      responses:
        '200':
          description: API keys (never the secret).
          content:
            application/json:
              schema:
                type: object
                required: [api_keys]
                properties:
                  api_keys: {type: array, items: {$ref: '#/components/schemas/APIKey'}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      tags: [auth]
      operationId: createAPIKey
      summary: Create an API key; the token is returned once
      security: [{session: [], csrf: []}, {appSession: []}, {apiKey: [admin]}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scopes]
              properties:
                name: {type: string, minLength: 1, maxLength: 100}
                scopes: {type: array, minItems: 1, items: {$ref: '#/components/schemas/Scope'}}
                expires_at: {type: string, format: date-time}
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CreatedAPIKey'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}

  /api/v1/api-keys/{id}:
    delete:
      tags: [auth]
      operationId: revokeAPIKey
      summary: Revoke an API key
      security: [{session: [], csrf: []}, {appSession: []}, {apiKey: [admin]}]
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '204':
          description: Revoked.
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}

  # ---------------------------------------------------------------- settings
  /api/v1/settings:
    get:
      tags: [settings]
      operationId: getSettings
      summary: Owner settings
      security: [{session: []}, {appSession: []}, {apiKey: ['read:config']}]
      responses:
        '200':
          description: Settings.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Settings'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
    patch:
      tags: [settings]
      operationId: updateSettings
      summary: Change settings (merge patch)
      security: [{session: [], csrf: []}, {appSession: []}, {apiKey: ['write:config']}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Settings'}
      responses:
        '200':
          description: Updated settings.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Settings'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}

  /api/v1/settings/dashboard:
    get:
      tags: [settings]
      operationId: getDashboardLayout
      summary: Dashboard layout
      description: >
        The stored layout, or the curated default (is_default) while none is stored. Cards whose
        metric is no longer a catalogue code or rule family are dropped.
      security: [{session: []}, {appSession: []}, {apiKey: ['read:config']}]
      responses:
        '200':
          description: The layout.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DashboardLayout'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
    put:
      tags: [settings]
      operationId: putDashboardLayout
      summary: Replace the dashboard layout
      description: Card order is array order. Audited.
      security: [{session: [], csrf: []}, {appSession: []}, {apiKey: ['write:config']}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DashboardLayoutInput'}
      responses:
        '200':
          description: The stored layout.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DashboardLayout'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}

  /api/v1/timezone-periods:
    get:
      tags: [settings]
      operationId: listTimezonePeriods
      summary: List timezone periods
      security: [{session: []}, {appSession: []}, {apiKey: ['read:config']}]
      responses:
        '200':
          description: Periods, oldest first.
          content:
            application/json:
              schema:
                type: object
                required: [timezone_periods]
                properties:
                  timezone_periods: {type: array, items: {$ref: '#/components/schemas/TimezonePeriod'}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      tags: [settings]
      operationId: createTimezonePeriod
      summary: Add a timezone period (local dates are recomputed)
      security: [{session: [], csrf: []}, {appSession: []}, {apiKey: ['write:config']}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TimezonePeriodInput'}
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TimezonePeriod'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}

  /api/v1/timezone-periods/{id}:
    patch:
      tags: [settings]
      operationId: updateTimezonePeriod
      summary: Change a timezone period's zone or start (local dates are recomputed)
      security: [{session: [], csrf: []}, {appSession: []}, {apiKey: ['write:config']}]
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TimezonePeriodInput'}
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TimezonePeriod'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
    delete:
      tags: [settings]
      operationId: deleteTimezonePeriod
      summary: Remove a timezone period (the previous one extends; local dates are recomputed)
      security: [{session: [], csrf: []}, {appSession: []}, {apiKey: ['write:config']}]
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '204':
          description: Removed.
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}

  # ---------------------------------------------------------------- provider callbacks (not under /api)
  /oauth/{provider}/callback:
    get:
      tags: [connections]
      operationId: oauthCallback
      summary: OAuth redirect target; completes the authorization and redirects to the UI
      description: >
        Authorized by the signed, single-use `state` and the browser-binding cookie, not by the
        session. Always answers 303 to /connections?connected=<provider> or
        /connections?auth_error=invalid_state|denied|account_mismatch|exchange_failed|unavailable&provider=<provider>.
        HEAD answers 200 without side effects. A provider without a connector is 404.
      security: []
      parameters:
        - {name: provider, in: path, required: true, schema: {type: string}}
        - {name: state, in: query, schema: {type: string}}
        - {name: code, in: query, schema: {type: string}}
      responses:
        '200':
          description: HEAD probe.
        '303':
          description: Back to the UI with the outcome.
        '404': {$ref: '#/components/responses/Problem'}

  /webhooks/withings/{hook_token}:
    parameters:
      - {name: hook_token, in: path, required: true, schema: {type: string}, description: Per-connection notification token (only its SHA-256 is stored).}
    get:
      tags: [connections]
      operationId: withingsNotifyProbe
      summary: Withings callback validation; HEAD and GET answer 200 without side effects
      security: []
      responses:
        '200':
          description: Probe answered.
        '413': {$ref: '#/components/responses/Problem'}
    post:
      tags: [connections]
      operationId: withingsNotify
      summary: Withings notification; enqueues one deduplicated window sync
      description: >
        Authorized by the unguessable token; the payload is only a hint to fetch. A measures
        notification (appli 1, 2 or 4) of the connection's Withings user enqueues one correction
        sync of [startdate, enddate], deduplicated while queued or running. Other notifications
        are acknowledged and ignored. An unknown token is 404 and enqueues nothing.
      security: []
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                userid: {type: string}
                appli: {type: integer}
                startdate: {type: integer}
                enddate: {type: integer}
      responses:
        '200':
          description: Accepted (or ignored).
        '404': {$ref: '#/components/responses/Problem'}
        '413': {$ref: '#/components/responses/Problem'}

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: vitamux_session
      description: Owner session cookie set by POST /api/v1/auth/login (HttpOnly, Secure, SameSite=Strict).
    csrf:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Required with the session cookie on mutating requests; the value comes from login or GET /api/v1/auth/session.
    appSession:
      type: http
      scheme: bearer
      description: 'App session token `vmx_ses_<id>_<secret>` from POST /api/v1/auth/login with `client: app`. Admitted wherever the session is, without CSRF.'
    apiKey:
      type: http
      scheme: bearer
      description: 'API key `vmx_pat_<id>_<secret>`. The listed role is the scope it needs; `admin` implies every scope.'
    clientToken:
      type: http
      scheme: bearer
      description: 'Client token `vmx_cli_<id>_<secret>` with scope `ingest:<connection_id>`.'

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 1, maxLength: 255}
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      description: Replays the stored response for the same request; a different request with the same key is 409.
      schema: {type: string, minLength: 1, maxLength: 255}
    ContentEncoding:
      name: Content-Encoding
      in: header
      required: false
      schema: {type: string, enum: [gzip]}
    BatchID:
      name: batch_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/BatchID'}
    ID:
      name: id
      in: path
      required: true
      schema: {type: string, minLength: 1}
    ConnectionIDPath:
      name: id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/ConnectionID'}
    BackfillIDPath:
      name: backfill_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    MetricPath:
      name: metric
      in: path
      required: true
      schema: {type: string}
    MetricCodePath:
      name: code
      in: path
      required: true
      schema: {type: string}
    Limit:
      name: limit
      in: query
      required: false
      description: Page size. Endpoints may cap it lower than 10,000.
      schema: {type: integer, minimum: 1, maximum: 10000, default: 500}
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque next_cursor from the previous page of the same query.
      schema: {type: string}
    Start:
      name: start
      in: query
      required: false
      description: Inclusive start instant (RFC 3339 with offset).
      schema: {type: string, format: date-time}
    End:
      name: end
      in: query
      required: false
      description: Exclusive end instant (RFC 3339 with offset).
      schema: {type: string, format: date-time}
    StartDate:
      name: start_date
      in: query
      required: false
      description: First local date, inclusive.
      schema: {type: string, format: date}
    EndDate:
      name: end_date
      in: query
      required: false
      description: Last local date, inclusive.
      schema: {type: string, format: date}
    StartDateRequired:
      name: start_date
      in: query
      required: true
      description: First local date, inclusive.
      schema: {type: string, format: date}
    EndDateRequired:
      name: end_date
      in: query
      required: true
      description: Last local date, inclusive.
      schema: {type: string, format: date}
    MetricFilter:
      name: metric
      in: query
      required: false
      description: Metric code; repeatable.
      schema: {type: array, items: {type: string}}
    ProviderFilter:
      name: provider
      in: query
      required: false
      description: Provider code; repeatable.
      schema: {type: array, items: {type: string}}
    ConnectionFilter:
      name: connection
      in: query
      required: false
      description: Connection id; repeatable.
      schema: {type: array, items: {$ref: '#/components/schemas/ConnectionID'}}
    DeviceFilter:
      name: device
      in: query
      required: false
      description: Device id (dev_…); repeatable.
      schema: {type: array, items: {$ref: '#/components/schemas/DeviceID'}}
    OriginFilter:
      name: origin
      in: query
      required: false
      description: Origin key (e.g. a HealthKit bundle id); repeatable.
      schema: {type: array, items: {type: string}}
    KindFilter:
      name: kind
      in: query
      required: false
      description: Measurement kind; repeatable.
      schema: {type: array, items: {type: string, enum: [sample, interval, cumulative, daily_value]}}
    Include:
      name: include
      in: query
      required: false
      description: Comma-separated expansions.
      style: form
      explode: false
      schema: {type: array, items: {type: string, enum: [provenance, stages, segments, superseded, deleted]}}

  responses:
    Problem:
      description: Error (RFC 9457 problem+json; codes in internal/api/problem.go).
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}

  schemas:
    # ------------------------------------------------ shared
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        code: {type: string}
        request_id: {type: string}
        errors:
          type: array
          items:
            type: object
            required: [pointer, detail]
            properties:
              pointer: {type: string}
              detail: {type: string}
    PageInfo:
      type: object
      required: [has_more]
      properties:
        has_more: {type: boolean}
        next_cursor: {type: string, description: Present when has_more is true.}
    ConnectionID:
      type: string
      pattern: '^conn_[0-9a-f]{32}$'
    DeviceID:
      type: string
      pattern: '^dev_[0-9a-f]{32}$'
    Scope:
      type: string
      enum: ['read:health', 'read:config', 'write:config', 'write:documents', admin]

    # ------------------------------------------------ ingest
    BatchID:
      type: string
      pattern: '^bat_[0-9a-f]{32}$'
    ItemOutcome:
      type: object
      additionalProperties: false
      required: [external_key, status, raw_payload_id]
      properties:
        external_key: {type: string}
        status: {type: string, enum: [stored, duplicate, new_version]}
        raw_payload_id: {type: string, pattern: '^[0-9]+$'}
    BatchAccepted:
      type: object
      additionalProperties: false
      required: [batch_id, items, normalization]
      properties:
        batch_id: {$ref: '#/components/schemas/BatchID'}
        items:
          type: array
          items: {$ref: '#/components/schemas/ItemOutcome'}
        normalization: {type: string, enum: [queued]}
    BatchStatus:
      type: object
      required: [batch_id, received_at, normalization, items]
      properties:
        batch_id: {$ref: '#/components/schemas/BatchID'}
        received_at: {type: string, format: date-time}
        normalization: {type: string, enum: [queued, running, done, failed]}
        items:
          type: array
          items:
            type: object
            required: [external_key, raw_payload_id, status]
            properties:
              external_key: {type: string}
              raw_payload_id: {type: string, pattern: '^[0-9]+$'}
              status: {type: string, enum: [stored, normalized, normalize_failed, quarantined]}
    BlobStored:
      type: object
      additionalProperties: false
      required: [blob_sha256, size_bytes]
      properties:
        blob_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        size_bytes: {type: integer, minimum: 0}

    # ------------------------------------------------ resolved (docs/architecture/resolution.md#result-shape)
    ResolvedDaily:
      type: object
      required: [timezone, days]
      properties:
        timezone: {type: string, description: IANA timezone of the requested period; empty (and every value no_data) while no timezone period is configured.}
        days: {type: array, items: {$ref: '#/components/schemas/ResolvedDay'}}
    ResolvedDay:
      type: object
      required: [local_date, metrics]
      properties:
        local_date: {type: string, format: date}
        metrics:
          type: object
          additionalProperties: {$ref: '#/components/schemas/ResolvedValue'}
    ResolvedValue:
      type: object
      required: [status, explanation]
      properties:
        status: {type: string, enum: [direct, fallback, calculated, overridden, no_data]}
        value:
          description: >
            A number in unit, or for a rule family an object of catalogue codes to numbers
            (bp_systolic, bp_diastolic, bp_pulse; the sleep_* codes). Absent without a value.
        unit: {type: string, description: Canonical unit; absent for a family.}
        partial: {type: boolean, description: The window ends after the request time.}
        window: {$ref: '#/components/schemas/Window'}
        rule: {$ref: '#/components/schemas/RuleRef'}
        selected: {type: string, description: The group the value came from, for selecting strategies.}
        coverage: {type: number, format: double, minimum: 0, maximum: 1, description: Coverage of the groups behind the value.}
        missing:
          type: object
          description: Family codes without a value and why, e.g. sleep_deep no_stage_data.
          additionalProperties: {type: string}
        inputs:
          type: array
          description: Every rule group in ladder order, then each excluded or unmatched source.
          items: {$ref: '#/components/schemas/ResolvedInput'}
        warnings: {type: array, items: {$ref: '#/components/schemas/ResolvedWarning'}}
        context: {type: string, description: The E1 context of the window (workout or sleep).}
        follow: {$ref: '#/components/schemas/ResolvedFollow'}
        hours:
          type: array
          description: The hourly picks of a composed day (E9).
          items: {$ref: '#/components/schemas/HourPick'}
        overrides: {$ref: '#/components/schemas/ResolvedOverrides'}
        explanation: {type: string}
        computed_at: {type: string, format: date-time}
        links: {$ref: '#/components/schemas/ResolvedLinks'}
    ResolvedWarning:
      type: object
      required: [code]
      properties:
        code: {type: string}
        group: {type: string}
    ResolvedFollow:
      type: object
      description: The E5 leader metric and the group it selected.
      required: [metric]
      properties:
        metric: {type: string}
        group: {type: string}
    HourPick:
      type: object
      required: [start, status]
      properties:
        start: {type: string, format: date-time}
        status: {type: string}
        group: {type: string}
        value: {type: number, format: double}
    ResolvedOverrides:
      type: object
      description: Manual overrides of the window; computed is what the rule alone gave.
      required: [applied, ignored]
      properties:
        applied: {type: array, items: {type: string, format: uuid}}
        ignored: {type: array, items: {type: string, format: uuid}}
        computed: {$ref: '#/components/schemas/ComputedValue'}
    ComputedValue:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [direct, fallback, calculated, overridden, no_data]}
        value: {description: Same shape as ResolvedValue.value.}
        selected: {type: string}
    ResolvedLinks:
      type: object
      properties:
        sources: {type: string, description: The all-sources drilldown of the window.}
    Window:
      type: object
      required: [kind]
      properties:
        kind: {type: string, description: 'bucket, hour, local_day, local_night, sleep_episode, latest or reading.'}
        start: {type: string, format: date-time}
        end: {type: string, format: date-time}
        local_date: {type: string, format: date}
        key: {type: string, description: 'The window key of drilldowns and overrides: a date, a UTC start, an as-of instant, or g:/m: for a reading.'}
    RuleRef:
      type: object
      required: [ref, version]
      properties:
        ref: {type: string, description: 'builtin:<metric>:<n>, default:<metric>:<hash>, rule:<metric>:<n>, or draft:<metric> in a preview.'}
        version: {type: integer, description: 0 for a draft.}
        strategy: {type: string}
    ResolvedInput:
      type: object
      required: [group, status]
      properties:
        group: {type: [string, 'null'], description: Rule group; null for an excluded or unmatched source.}
        status: {type: string, description: 'used, fallback_unused, no_data, below_quality, stale, not_aligned, no_stage_data, excluded or not_in_rule.'}
        selected: {type: boolean, description: The group's value is (part of) the window value.}
        value: {description: Same shape as ResolvedValue.value.}
        basis: {type: string, description: 'e.g. daily_value, intervals, samples, reading.'}
        coverage: {type: number, format: double, minimum: 0, maximum: 1}
        count: {type: integer, description: Contributing rows (sessions for sleep).}
        readings: {type: integer}
        prorated: {type: boolean}
        at: {type: string, format: date-time, description: Latest contributing instant.}
        span: {$ref: '#/components/schemas/Span'}
        wear_exempt: {type: boolean}
        worn_buckets: {type: integer}
        reason: {type: string}
        sources: {type: array, items: {$ref: '#/components/schemas/ResolvedSource'}}
        record_refs: {type: array, items: {type: string}, description: measurements ids.}
        session_refs: {type: array, items: {type: string, format: uuid}, description: sleep_sessions ids.}
    Span:
      type: object
      description: The span an E2 min or min_rolling_mean statistic picked.
      required: [start, end]
      properties:
        start: {type: string, format: date-time}
        end: {type: string, format: date-time}
    ResolvedSource:
      type: object
      required: [provider]
      properties:
        provider: {type: string}
        connection_id: {type: string}
        device: {$ref: '#/components/schemas/DeviceRef'}
        origin: {$ref: '#/components/schemas/OriginRef'}
        manual: {type: boolean}
    DeviceRef:
      type: object
      properties:
        id: {type: string, description: dev_ id, the device filter value.}
        type: {type: string}
        model: {type: string}
    OriginRef:
      type: object
      properties:
        key: {type: string}
        name: {type: string}
        relayed: {type: boolean}
        relayed_provider: {type: string}
    SourcesDrilldown:
      type: object
      required: [metric, window, rule, sources]
      properties:
        metric: {type: string}
        window: {$ref: '#/components/schemas/Window'}
        rule: {$ref: '#/components/schemas/RuleRef'}
        sources: {type: array, items: {$ref: '#/components/schemas/DrilldownSource'}}
    DrilldownSource:
      type: object
      required: [group, rule_status, provider]
      properties:
        group: {type: [string, 'null'], description: Rule group; null when the source is outside the rule.}
        rule_status: {type: string, enum: [used, excluded, not_in_rule]}
        reason: {type: string}
        provider: {type: string}
        connection_id: {type: string}
        device: {$ref: '#/components/schemas/DeviceRef'}
        origin: {$ref: '#/components/schemas/OriginRef'}
        values:
          type: object
          description: >
            The source's own values by basis: daily_value, interval_sum, intervals (additive);
            samples, bucket_means (intensive); latest, readings or component codes (latest);
            sessions, sleep_in_bed, sleep_total (sleep).
          additionalProperties: {type: number, format: double}
        count: {type: integer}
        records: {$ref: '#/components/schemas/RecordsLink'}
        provenance: {$ref: '#/components/schemas/DrilldownProvenance'}
        session_refs: {type: array, items: {type: string, format: uuid}}
    RecordsLink:
      type: object
      required: [href]
      properties:
        href: {type: string, description: The source's rows in the window on GET /measurements.}
    DrilldownProvenance:
      type: object
      required: [raw_payload_ids, normalizer]
      properties:
        raw_payload_ids: {type: array, items: {type: string}}
        normalizer: {type: string, description: 'name@version of the normalizers behind the rows, comma-separated.'}
        fetched_at: {type: string, format: date-time, description: The latest fetch of those raw payloads.}
    ResolvedSeries:
      type: object
      required: [metric, window, rule, timezone, points, sources_used, has_more]
      properties:
        metric: {type: string}
        unit: {type: string}
        window: {$ref: '#/components/schemas/SeriesWindow'}
        rule: {$ref: '#/components/schemas/RuleRef'}
        timezone: {type: string}
        points: {type: array, items: {$ref: '#/components/schemas/ResolvedPoint'}}
        sources_used: {type: array, items: {type: string}, description: The groups this page's values came from, in first-use order.}
        has_more: {type: boolean}
        next_cursor: {type: string}
    SeriesWindow:
      type: object
      required: [kind]
      properties:
        kind: {type: string}
        size: {type: string, description: Bucket size of bucket windows.}
    ResolvedPoint:
      type: object
      required: [key, end, status, sources]
      properties:
        key: {type: string}
        start: {type: string, format: date-time, description: Absent for latest windows.}
        end: {type: string, format: date-time}
        local_date: {type: string, format: date}
        status: {type: string, enum: [direct, fallback, calculated, overridden, no_data]}
        value: {description: Same shape as ResolvedValue.value.}
        partial: {type: boolean}
        coverage: {type: number, format: double, minimum: 0, maximum: 1}
        min: {type: number, format: double, description: 'Intensive metrics: the lowest sample behind the value.'}
        max: {type: number, format: double, description: 'Intensive metrics: the highest sample behind the value.'}
        n: {type: integer, minimum: 0, description: The rows behind the value (0 for an additive zero without rows); absent without a source.}
        sources: {type: array, items: {type: string}, description: The groups the value came from (one for selecting strategies).}
        providers:
          type: array
          items: {type: string}
          description: The providers of the records behind the value (those of the chosen groups' sources), distinct, in input order; absent without a value.
        warnings: {type: array, items: {type: string}}
        links: {$ref: '#/components/schemas/ResolvedLinks'}
    ResolvedSleep:
      type: object
      required: [timezone, nights]
      properties:
        timezone: {type: string}
        nights: {type: array, items: {$ref: '#/components/schemas/ResolvedNight'}}
    ResolvedNight:
      type: object
      description: >
        episode is the bed (start) and wake (end) time of the night's main episode, the union span
        of its sessions in the owner's timezone; absent when the night has no episode. Time per
        stage is result.value.sleep_awake, sleep_light, sleep_deep and sleep_rem, in seconds.
      required: [local_date, result, members]
      properties:
        local_date: {type: string, format: date}
        result: {$ref: '#/components/schemas/ResolvedValue'}
        episode: {$ref: '#/components/schemas/Span'}
        members:
          type: array
          description: Every source with a session in the main episode, inside the rule or not.
          items: {$ref: '#/components/schemas/SleepMember'}
    SleepMember:
      type: object
      required: [group, rule_status, selected, provider, session_refs]
      properties:
        group: {type: [string, 'null']}
        rule_status: {type: string, enum: [used, excluded, not_in_rule]}
        reason: {type: string}
        selected: {type: boolean, description: The episode's values come from this source.}
        provider: {type: string}
        connection_id: {type: string}
        device: {$ref: '#/components/schemas/DeviceRef'}
        origin: {$ref: '#/components/schemas/OriginRef'}
        values:
          type: object
          description: sessions, sleep_in_bed and sleep_total (seconds).
          additionalProperties: {type: number, format: double}
        session_refs: {type: array, items: {type: string, format: uuid}}
    ResolvedWorkouts:
      type: object
      required: [timezone, rule, workouts]
      properties:
        timezone: {type: string}
        rule: {$ref: '#/components/schemas/RuleRef'}
        workouts: {type: array, items: {$ref: '#/components/schemas/ResolvedWorkout'}}
    ResolvedWorkout:
      type: object
      required: [local_date, start, end, sport, selected, members, explanation]
      properties:
        local_date: {type: string, format: date}
        start: {type: string, format: date-time}
        end: {type: string, format: date-time}
        sport: {type: string, description: The cluster's specific sport, else other.}
        selected: {type: [string, 'null'], format: uuid, description: The picked workout; null when no member is in a rule group.}
        group: {type: string, description: The rule group of the picked workout.}
        explanation: {type: string}
        members: {type: array, items: {$ref: '#/components/schemas/WorkoutMember'}}
    WorkoutMember:
      type: object
      required: [id, group, rule_status, selected, start_at, end_at, sport, provider]
      properties:
        id: {type: string, format: uuid}
        group: {type: [string, 'null']}
        rule_status: {type: string, enum: [used, excluded, not_in_rule]}
        reason: {type: string}
        selected: {type: boolean}
        start_at: {type: string, format: date-time}
        end_at: {type: string, format: date-time}
        sport: {type: string}
        distance_m: {type: number, format: double}
        energy_kcal: {type: number, format: double}
        avg_hr_bpm: {type: number, format: double}
        max_hr_bpm: {type: number, format: double}
        provider: {type: string}
        connection_id: {type: string}
        device: {$ref: '#/components/schemas/DeviceRef'}
        origin: {$ref: '#/components/schemas/OriginRef'}
    ResolutionPreviewRequest:
      type: object
      additionalProperties: false
      required: [spec, start_date, end_date]
      properties:
        spec:
          type: object
          description: A draft rule (docs/architecture/resolution.md#rule-specification); validated, never stored.
          x-go-type: json.RawMessage
        start_date: {type: string, format: date}
        end_date: {type: string, format: date}
    ResolutionPreview:
      type: object
      required: [metric, timezone, window, draft_rule, active_rule, days]
      properties:
        metric: {type: string}
        timezone: {type: string}
        window: {type: string, description: The window kind both rules resolve.}
        draft_rule: {$ref: '#/components/schemas/RuleRef'}
        active_rule:
          description: The rule in effect (a default rule at least); never null since J24.1, kept nullable for clients.
          oneOf: [{$ref: '#/components/schemas/RuleRef'}, {type: 'null'}]
        days: {type: array, items: {$ref: '#/components/schemas/PreviewDay'}}
    PreviewDay:
      type: object
      required: [local_date, draft, active]
      properties:
        local_date: {type: string, format: date}
        draft: {$ref: '#/components/schemas/ResolvedValue'}
        active: {$ref: '#/components/schemas/ResolvedValue'}

    # ------------------------------------------------ display rollups of resolved values (E21)
    Rollup:
      type: object
      description: >
        Plain statistics of the resolved daily values of the local dates start_date through
        end_date, for display; not a resolution strategy. Values of windows still open are left out.
      additionalProperties: false
      required: [start_date, end_date, days, n, coverage]
      properties:
        start_date: {type: string, format: date}
        end_date: {type: string, format: date}
        days: {type: integer, minimum: 0, description: Local dates in the period.}
        n: {type: integer, minimum: 0, description: Dates with a resolved value.}
        coverage: {type: number, format: double, minimum: 0, maximum: 1, description: n / days.}
        mean: {type: number, format: double}
        min: {type: number, format: double}
        max: {type: number, format: double}
        sum: {type: number, format: double, description: Additive metrics only.}
        components:
          type: object
          description: For a rule family, the statistics of each catalogue code instead.
          additionalProperties: {$ref: '#/components/schemas/RollupValues'}
    RollupValues:
      type: object
      additionalProperties: false
      required: [n]
      properties:
        n: {type: integer, minimum: 0}
        mean: {type: number, format: double}
        min: {type: number, format: double}
        max: {type: number, format: double}
    ResolvedSummary:
      type: object
      additionalProperties: false
      required: [date, timezone, metrics]
      properties:
        date: {type: string, format: date}
        timezone: {type: string, description: IANA timezone in effect on date; empty while no timezone period is configured.}
        metrics:
          type: object
          additionalProperties: {$ref: '#/components/schemas/MetricSummary'}
    MetricSummary:
      type: object
      additionalProperties: false
      required: [metric, value, sparkline, stats]
      properties:
        metric: {type: string}
        unit: {type: string, description: Canonical unit; absent for a family.}
        rule: {$ref: '#/components/schemas/RuleRef'}
        value: {$ref: '#/components/schemas/ResolvedValue'}
        sparkline:
          type: array
          description: The 30 local dates ending at date, oldest first.
          items: {$ref: '#/components/schemas/SummaryPoint'}
        stats:
          type: array
          description: Rollups of the 7, 30 and 90 local dates ending at date, in that order.
          items: {$ref: '#/components/schemas/Rollup'}
        comparisons:
          type: array
          description: 'With compare=true, the 7, 30, 90 and 365 day periods, in that order.'
          items: {$ref: '#/components/schemas/PeriodComparison'}
    PeriodComparison:
      type: object
      description: >
        A period and the one before it, for a neutral delta. Both are plain rollups; compare
        mean, or for a family each component's mean.
      additionalProperties: false
      required: [days, current, previous]
      properties:
        days: {type: integer, enum: [7, 30, 90, 365]}
        current: {$ref: '#/components/schemas/Rollup'}
        previous: {$ref: '#/components/schemas/Rollup'}
    SummaryPoint:
      type: object
      additionalProperties: false
      required: [local_date, status]
      properties:
        local_date: {type: string, format: date}
        status: {type: string, enum: [direct, fallback, calculated, overridden, no_data]}
        value: {description: Same shape as ResolvedValue.value.}
        partial: {type: boolean}
    ResolvedTrend:
      type: object
      additionalProperties: false
      required: [metric, grain, timezone, start_date, end_date, buckets]
      properties:
        metric: {type: string}
        unit: {type: string, description: Canonical unit; absent for a family.}
        rule: {$ref: '#/components/schemas/RuleRef'}
        grain: {type: string, enum: [week, month]}
        timezone: {type: string}
        start_date: {type: string, format: date}
        end_date: {type: string, format: date}
        buckets: {type: array, items: {$ref: '#/components/schemas/Rollup'}}

    # ------------------------------------------------ inventory, events and source series (E21)
    Inventory:
      type: object
      additionalProperties: false
      required: [items, aggregates_pending]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/InventoryItem'}}
        aggregates_pending: {type: boolean, description: 'Days wait for the rebuild job, so metric counts, days and sources may lag.'}
    InventoryItem:
      type: object
      additionalProperties: false
      required: [kind, code, count, days, first_date, last_date, providers, devices, origins]
      properties:
        kind: {type: string, enum: [metric, group, event, sleep, workouts, analyte]}
        code: {type: string, description: 'Metric code, group kind (bp_reading, body_composition), event code, sleep, workouts or analyte code.'}
        count:
          type: integer
          format: int64
          description: Active records; for metrics the daily values plus the rows in the hourly aggregates, where an interval counts once per hour it touches.
        days: {type: integer, description: Local dates with data.}
        first_date: {type: string, format: date}
        last_date: {type: string, format: date}
        first_at: {type: string, format: date-time, description: Absent for lab results without a collection time.}
        last_at: {type: string, format: date-time}
        latest: {$ref: '#/components/schemas/InventoryLatest'}
        providers: {type: array, items: {type: string}}
        devices: {type: array, items: {$ref: '#/components/schemas/DeviceRef'}}
        origins: {type: array, items: {$ref: '#/components/schemas/OriginRef'}}
        metric: {$ref: '#/components/schemas/Metric'}
        components: {type: array, items: {type: string}, description: The metric codes of a group kind.}
        event: {$ref: '#/components/schemas/EventType'}
        analyte: {$ref: '#/components/schemas/AnalyteRef'}
    InventoryLatest:
      type: object
      description: >
        The newest record: a metric's row, a group's components, an event's value or level, the
        newest sleep session's asleep seconds, a workout's sport, or a lab result's canonical value
        (else its printed number) with its printed text.
      additionalProperties: false
      required: [local_date]
      properties:
        at: {type: string, format: date-time}
        local_date: {type: string, format: date}
        value: {type: number, format: double}
        unit: {type: string}
        components: {type: object, additionalProperties: {type: number, format: double}}
        level: {type: string}
        text: {type: string}
    EventType:
      type: object
      additionalProperties: false
      required: [code, levels]
      properties:
        code: {type: string}
        levels: {type: array, items: {type: string}, description: Level words the event may carry; empty when it has none.}
    AnalyteRef:
      type: object
      additionalProperties: false
      required: [code, name]
      properties:
        code: {type: string}
        name: {type: string}
        canonical_unit: {type: string}
    HealthEvent:
      type: object
      description: A typed event (docs/architecture/metric-catalog.md#events).
      additionalProperties: false
      required: [id, code, start_at, end_at, tz_offset_min, local_date, value, level, context, quality_flags, source, provenance]
      properties:
        id: {type: string, format: uuid}
        code: {type: string}
        start_at: {type: string, format: date-time}
        end_at: {type: [string, 'null'], format: date-time}
        tz_offset_min: {type: [integer, 'null']}
        local_date: {type: string, format: date}
        value: {type: [number, 'null'], format: double}
        level: {type: [string, 'null']}
        context: {type: object, description: Source metadata as given., x-go-type: json.RawMessage}
        quality_flags: {type: integer, minimum: 0}
        source: {$ref: '#/components/schemas/SourceRef'}
        provenance: {$ref: '#/components/schemas/RecordProvenance'}
    HealthEventPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [events]
          properties:
            events: {type: array, items: {$ref: '#/components/schemas/HealthEvent'}}
    SourceSeries:
      type: object
      additionalProperties: false
      required: [metric, unit, aggregation, grain, timezone, behind, sources]
      properties:
        metric: {type: string}
        unit: {type: string}
        aggregation: {type: string, enum: [intensive, additive, latest, daily_summary]}
        grain: {type: string, enum: [30s, 1m, 5m, 15m, 30m, raw, hour, day]}
        timezone: {type: string}
        rule: {$ref: '#/components/schemas/RuleRef'}
        behind: {type: boolean, description: Days of the metric in the range wait for the rebuild job (hour and day grains).}
        sources: {type: array, items: {$ref: '#/components/schemas/SourceSeriesSource'}}
        has_more: {type: boolean, description: 'raw: more rows follow next_cursor.'}
        next_cursor: {type: string}
    SourceSeriesSource:
      type: object
      additionalProperties: false
      required: [provider, connection_id, group, rule_status, points]
      properties:
        provider: {type: string}
        connection_id: {$ref: '#/components/schemas/ConnectionID'}
        device: {$ref: '#/components/schemas/DeviceRef'}
        origin: {$ref: '#/components/schemas/OriginRef'}
        group: {type: [string, 'null'], description: The rule group the source belongs to; null when excluded or outside the rule.}
        rule_status: {type: string, enum: [used, excluded, not_in_rule]}
        spacing_s: {type: number, format: double, description: 'Intraday and raw grains: the median gap in seconds between the starts of the source''s consecutive rows in the span; absent with fewer than two.'}
        points: {type: array, items: {$ref: '#/components/schemas/SourcePoint'}}
    SourcePoint:
      type: object
      description: >
        One source's values in a bucket, local hour or day: additive metrics the intervals
        pro-rated to it (sum), the others the mean of its bucket means (5 minutes, or the bucket
        when shorter) with min and max. A raw point is one row with its value (n 1).
      additionalProperties: false
      required: [local_date, n]
      properties:
        start: {type: string, format: date-time, description: The bucket's, hour's or row's start (all grains but day).}
        end: {type: string, format: date-time, description: 'raw: the end of an interval row.'}
        value: {type: number, format: double, description: 'raw: the row''s value.'}
        local_date: {type: string, format: date}
        n: {type: integer, minimum: 0, description: 'Samples, plus intervals once per hour they touch.'}
        mean: {type: number, format: double}
        min: {type: number, format: double}
        max: {type: number, format: double}
        sum: {type: number, format: double}
        daily_value: {type: number, format: double, description: The value the source reported for the whole day (day grain).}

    # ------------------------------------------------ dashboard (E21)
    DashboardCard:
      type: object
      additionalProperties: false
      required: [metric, size, hidden]
      properties:
        metric: {type: string, description: 'Catalogue code or rule family (sleep, blood_pressure).'}
        size: {type: string, enum: [S, M, L]}
        hidden: {type: boolean}
    DashboardLayoutInput:
      type: object
      additionalProperties: false
      required: [version, cards]
      properties:
        version: {type: integer, enum: [1], description: Layout schema version.}
        cards: {type: array, maxItems: 50, items: {$ref: '#/components/schemas/DashboardCard'}, description: In display order; a metric at most once.}
        hero:
          type: array
          maxItems: 4
          items: {type: string}
          description: Hero stat-tile metrics in order, a metric at most once, each a catalogue code or rule family. Omit to keep the default; an empty list shows none.
        dismissed:
          type: array
          maxItems: 100
          uniqueItems: true
          items: {type: string, minLength: 1, maxLength: 200}
          description: Keys of the dashboard alerts the owner dismissed (opaque to the server; the panel builds them from an alert's kind, subject and start). Omit for none; the panel drops keys whose alert is gone when it next saves.
    DashboardLayout:
      type: object
      additionalProperties: false
      required: [version, cards, hero, dismissed, is_default]
      properties:
        version: {type: integer, enum: [1]}
        cards: {type: array, items: {$ref: '#/components/schemas/DashboardCard'}}
        hero:
          type: array
          maxItems: 4
          items: {type: string}
          description: >
            The metrics of the hero stat tiles, in order (catalogue codes or rule families). The
            curated default (steps, resting_heart_rate, hrv_rmssd_nightly, weight) while the stored
            layout has none; an empty list when the owner chose none. Codes no longer in the catalogue are dropped.
        dismissed:
          type: array
          maxItems: 100
          items: {type: string}
          description: Keys of the dismissed dashboard alerts; empty until one is dismissed.
        is_default: {type: boolean, description: No layout is stored; this is the curated default.}

    # ------------------------------------------------ system
    SystemVersion:
      type: object
      additionalProperties: false
      required: [version, commit]
      properties:
        version: {type: string}
        commit: {type: string}
    SystemStatus:
      type: object
      description: Instance diagnostics (docs/architecture/reliability.md#health-logs-metrics). Lists are bounded.
      additionalProperties: false
      required: [versions, database_size_bytes, blob_size_bytes, last_backup_at, degraded_connections, failing_jobs]
      properties:
        versions: {$ref: '#/components/schemas/StatusVersions'}
        database_size_bytes: {type: integer, format: int64}
        blob_size_bytes: {type: integer, format: int64, description: Stored (compressed and sealed) size of the live blobs.}
        last_backup_at: {type: [string, 'null'], format: date-time, description: Creation time of the newest complete backup in VITAMUX_BACKUP_DIR; null without one.}
        degraded_connections:
          type: array
          description: Connections whose health is neither ok, paused nor disabled.
          items: {$ref: '#/components/schemas/StatusConnection'}
        failing_jobs:
          type: array
          description: Jobs that ran out of attempts in the last 7 days, newest first (at most 50).
          items: {$ref: '#/components/schemas/StatusJob'}
    StatusVersions:
      type: object
      additionalProperties: false
      required: [app, commit, schema, postgres]
      properties:
        app: {type: string}
        commit: {type: string}
        schema: {type: string, description: Newest applied migration number.}
        postgres: {type: string}
    StatusConnection:
      type: object
      additionalProperties: false
      required: [id, provider, health, health_reason, stream, last_success_at]
      properties:
        id: {$ref: '#/components/schemas/ConnectionID'}
        provider: {type: string}
        health: {$ref: '#/components/schemas/Health'}
        health_reason: {type: [string, 'null']}
        stream: {type: [string, 'null'], description: The stream behind the health when the connection itself is ok.}
        last_success_at: {type: [string, 'null'], format: date-time}
    StatusJob:
      type: object
      additionalProperties: false
      required: [id, kind, connection_id, attempts, finished_at, error_class]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string}
        connection_id: {oneOf: [{$ref: '#/components/schemas/ConnectionID'}, {type: 'null'}]}
        attempts: {type: integer, minimum: 0}
        finished_at: {type: [string, 'null'], format: date-time}
        error_class: {type: [string, 'null'], description: Error class of the last run; never a message.}
    Coverage:
      type: object
      description: >-
        Share of local hours with data per source and local day, from the hourly aggregates. A source
        is a provider; its row of a metric has one entry per day from start_date. With origin, only
        the hours those apps contributed count.
      additionalProperties: false
      required: [start_date, end_date, rows]
      properties:
        start_date: {type: string, format: date}
        end_date: {type: string, format: date}
        rows:
          type: array
          items: {$ref: '#/components/schemas/CoverageRow'}
    CoverageRow:
      type: object
      additionalProperties: false
      required: [metric, source, days]
      properties:
        metric: {type: string}
        source: {type: string, description: Provider code.}
        days:
          type: array
          description: Coverage 0..1 of start_date + index; 0 without data.
          items: {type: number, format: double, minimum: 0, maximum: 1}
    Job:
      type: object
      description: A background job (docs/architecture/reliability.md#job-queue).
      additionalProperties: false
      required: [id, kind, status, connection_id, priority, attempts, max_attempts, payload, run_at, created_at, started_at, finished_at]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string}
        status: {type: string, enum: [queued, running, succeeded, failed, dead, cancelled]}
        connection_id: {oneOf: [{$ref: '#/components/schemas/ConnectionID'}, {type: 'null'}]}
        priority: {type: integer, description: Lower runs first.}
        attempts: {type: integer, minimum: 0}
        max_attempts: {type: integer, minimum: 1}
        payload: {type: object, description: Job parameters; never secrets or health values., x-go-type: json.RawMessage}
        run_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
        started_at: {type: [string, 'null'], format: date-time}
        finished_at: {type: [string, 'null'], format: date-time}
    SyncQueued:
      type: object
      additionalProperties: false
      required: [jobs]
      properties:
        jobs: {type: array, items: {$ref: '#/components/schemas/Job'}, description: One sync job per stream; a pending one is reused.}
    JobPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [jobs]
          properties:
            jobs: {type: array, items: {$ref: '#/components/schemas/Job'}}

    # ------------------------------------------------ exports (docs/architecture/api.md#exports)
    ExportRequest:
      type: object
      required: [format]
      properties:
        scope: {type: object, description: Reserved for partial exports; only an empty object (everything) is accepted.}
        format: {type: string, enum: [ndjson, csv], description: 'ndjson: one NDJSON file per table; csv: the same plus measurements.csv.'}
        include_raw: {type: boolean, default: false}
    Export:
      type: object
      required: [id, status, created_at]
      properties:
        id: {type: string}
        status: {type: string, enum: [queued, running, done, failed]}
        format: {type: string, enum: [ndjson, csv]}
        include_raw: {type: boolean}
        created_at: {type: string, format: date-time}
        finished_at: {type: string, format: date-time}
        size_bytes: {type: integer, minimum: 0}
        download_url: {type: string, description: One-time, short-lived; present when status is done.}

    # ------------------------------------------------ auth (matches internal/api/auth.go)
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: {type: string}
        password: {type: string}
        totp_code: {type: string}
        recovery_code: {type: string}
        client: {type: string, enum: [browser, app], description: 'Omitted means `browser`; `app` answers a bearer app session instead of a cookie.'}
        device_name: {type: string, minLength: 1, maxLength: 100, description: 'Required with `client: app`, not allowed otherwise; Settings › Security lists the session under it.'}
    User:
      type: object
      required: [id, username, totp_enabled]
      properties:
        id: {type: string, format: uuid}
        username: {type: string}
        totp_enabled: {type: boolean}
    Session:
      type: object
      required: [user, csrf_token]
      properties:
        user: {$ref: '#/components/schemas/User'}
        csrf_token: {type: string, description: Empty for an app session, which needs none.}
    AppSession:
      type: object
      required: [user, token, expires_at]
      properties:
        user: {$ref: '#/components/schemas/User'}
        token: {type: string, description: 'Bearer token `vmx_ses_<id>_<secret>`; shown in this response only.'}
        expires_at: {type: string, format: date-time, description: Absolute end; the session also ends after VITAMUX_APP_SESSION_IDLE without use.}
    ActiveSession:
      type: object
      required: [id, kind, name, created_at, last_seen_at, expires_at, current]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [browser, app]}
        name: {type: [string, 'null'], description: The device name of an app session; null for a browser session.}
        created_at: {type: string, format: date-time}
        last_seen_at: {type: string, format: date-time, description: Updated at most once a minute.}
        expires_at: {type: string, format: date-time, description: 'Absolute end; the session also ends without use after 12 h (browser) or VITAMUX_APP_SESSION_IDLE (app).'}
        current: {type: boolean, description: This request's session.}
    TOTPEnrollment:
      type: object
      required: [secret, otpauth_uri]
      properties:
        secret: {type: string}
        otpauth_uri: {type: string}
    APIKey:
      type: object
      required: [id, name, scopes, created_at, last_used_at, expires_at, revoked_at]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        scopes: {type: array, items: {$ref: '#/components/schemas/Scope'}}
        created_at: {type: string, format: date-time}
        last_used_at: {type: [string, 'null'], format: date-time}
        expires_at: {type: [string, 'null'], format: date-time}
        revoked_at: {type: [string, 'null'], format: date-time}
    CreatedAPIKey:
      allOf:
        - $ref: '#/components/schemas/APIKey'
        - type: object
          required: [token]
          properties:
            token: {type: string, description: Shown in this response only.}

    # ------------------------------------------------ open objects: properties are added with each endpoint
    Metric:
      type: object
      description: Catalogue metric (docs/architecture/metric-catalog.md) with what a rule for it may use.
      additionalProperties: false
      required: [code, section, unit, kinds, aggregation, windows, strategies, plausible_range, provider_scoped, selection_only]
      properties:
        code: {type: string}
        section: {type: string}
        unit: {type: string, description: Canonical unit code.}
        kinds:
          type: array
          description: Kinds a source may store; empty for derived and sleep codes.
          items: {type: string, enum: [sample, interval, cumulative, daily_value]}
        aggregation: {type: string, enum: [intensive, additive, latest, daily_summary, sleep_derived]}
        windows:
          type: array
          description: Window kinds a rule for this metric may use.
          items: {type: string, enum: [bucket, hour, local_day, local_night, sleep_episode, latest, reading]}
        strategies:
          type: array
          description: Rule strategy ops (strategy.op) allowed for this metric; sum_across_sources also needs the duplicate-risk acknowledgement.
          items: {type: string, enum: [single_source, first_available, mean_across_sources, minimum_across_sources, maximum_across_sources, sum_across_sources, latest, earliest, event_priority]}
        plausible_range: {type: array, items: {type: number, format: double}, minItems: 2, maxItems: 2}
        group: {type: string, description: The measurement group the code belongs to (bp_reading, body_composition).}
        family: {type: string, description: The rule family the code resolves under (sleep, blood_pressure).}
        provider_scoped: {type: boolean, description: A provider-namespaced score; never pooled.}
        selection_only: {type: boolean, description: Providers define it differently; rules select one source and never pool it.}
        derived_from: {type: string, description: The source metric of a derived code (rule extension E2).}
        intraday: {$ref: '#/components/schemas/Intraday'}
    Intraday:
      type: object
      description: A metric's day-view bucket ladder (resolution.md#windows); absent for metrics measured once a day or night.
      additionalProperties: false
      required: [default, finest]
      properties:
        default: {type: string, enum: [1m, 5m, 30m], description: Bucket for a 24-hour span.}
        finest: {type: string, enum: [1m, raw], description: The finest step; raw means the stored rows.}
    Measurement:
      type: object
      description: Normalized measurement (docs/architecture/data-model.md#measurements).
      additionalProperties: false
      required: [id, metric, kind, start_at, end_at, tz_offset_min, local_date, value, unit, source_value, source_unit, quality_flags, group_id, source, provenance]
      properties:
        id: {type: string}
        metric: {type: string, description: Metric code.}
        kind: {type: string, enum: [sample, interval, cumulative, daily_value]}
        start_at: {type: string, format: date-time}
        end_at: {type: [string, 'null'], format: date-time, description: Exclusive; null for samples.}
        tz_offset_min: {type: [integer, 'null']}
        local_date: {type: string, format: date}
        value: {type: number, format: double, description: In the metric's canonical unit.}
        unit: {type: string, description: Canonical unit code.}
        source_value: {type: [number, 'null'], format: double, description: Original value, only when unit conversion changed it.}
        source_unit: {type: [string, 'null']}
        quality_flags: {type: integer, minimum: 0, description: 'Bitset: 1 manual_entry, 2 motion_context, 4 implausible, 8 relayed, 16 migrated_without_raw, 32 prorated_source, 64 calibrating.'}
        group_id: {type: [string, 'null'], description: Measurement group (blood-pressure reading, weigh-in) this row is a component of.}
        source: {$ref: '#/components/schemas/SourceRef'}
        provenance: {$ref: '#/components/schemas/RecordProvenance'}
    SourceRef:
      type: object
      description: Where a canonical row came from. device and origin are the values the device and origin filters take.
      additionalProperties: false
      required: [provider, connection_id, device, device_type, origin, external_id, dedupe_key]
      properties:
        provider: {type: string, description: Provider code.}
        connection_id: {$ref: '#/components/schemas/ConnectionID'}
        device: {oneOf: [{$ref: '#/components/schemas/DeviceID'}, {type: 'null'}]}
        device_type: {type: [string, 'null']}
        origin: {type: [string, 'null'], description: Origin key, e.g. a HealthKit bundle id.}
        external_id: {type: [string, 'null']}
        dedupe_key: {type: string, pattern: '^[0-9a-f]{32}$'}
    RecordProvenance:
      type: object
      description: Version and provenance columns of a canonical row; GET /provenance/{entity}/{id} has the full trace.
      additionalProperties: false
      required: [raw_payload_id, normalizer, ingested_at, normalized_at, superseded_at, superseded_by, deleted_at, deleted_by_raw_id]
      properties:
        raw_payload_id: {type: [string, 'null'], description: Null only for rows migrated without raw.}
        normalizer: {type: string, description: 'name@version'}
        ingested_at: {type: string, format: date-time}
        normalized_at: {type: string, format: date-time}
        superseded_at: {type: [string, 'null'], format: date-time}
        superseded_by: {type: [string, 'null'], description: Id of the version that replaced this one.}
        deleted_at: {type: [string, 'null'], format: date-time}
        deleted_by_raw_id: {type: [string, 'null']}
        raw: {$ref: '#/components/schemas/RawRef'}
    RawRef:
      type: object
      description: The row's raw payload; with include=provenance, when the row has one.
      additionalProperties: false
      required: [stream, external_key, version, fetched_at, batch_id, source_kind]
      properties:
        stream: {type: string}
        external_key: {type: string}
        version: {type: integer}
        fetched_at: {type: string, format: date-time}
        batch_id: {type: string, format: uuid}
        source_kind: {type: string}
    MeasurementPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [measurements]
          properties:
            measurements: {type: array, items: {$ref: '#/components/schemas/Measurement'}}
    ManualMeasurementInput:
      type: object
      description: >
        A value the owner entered. It is stored as a raw payload of the owner's manual connection
        and normalized like any source (provider manual, quality flag manual_entry). A sample
        without end_at, an interval with it. Grouped metrics (blood-pressure components) are not
        accepted here.
      additionalProperties: false
      required: [metric, value, unit, start_at]
      properties:
        metric: {type: string, description: Metric code.}
        value: {type: number, format: double}
        unit: {type: string, description: Unit code of value; converted to the canonical unit.}
        start_at: {type: string, format: date-time, description: Its offset sets the local date.}
        end_at: {type: string, format: date-time, description: Exclusive end of an interval.}
    Group:
      type: object
      description: Measurement group (bp_reading, body_composition) with its components.
      additionalProperties: false
      required: [id, kind, measured_at, tz_offset_min, local_date, context, components, source, provenance]
      properties:
        id: {type: string}
        kind: {type: string, enum: [bp_reading, body_composition]}
        measured_at: {type: string, format: date-time}
        tz_offset_min: {type: [integer, 'null']}
        local_date: {type: string, format: date}
        context: {type: object, description: Provider detail such as arm or position., x-go-type: json.RawMessage}
        components: {type: array, items: {$ref: '#/components/schemas/GroupComponent'}}
        source: {$ref: '#/components/schemas/SourceRef'}
        provenance: {$ref: '#/components/schemas/RecordProvenance'}
    GroupComponent:
      type: object
      description: A measurement belonging to the group, in the version that belongs to this group version.
      additionalProperties: false
      required: [id, metric, value, unit, source_value, source_unit, quality_flags]
      properties:
        id: {type: string, description: Measurement id.}
        metric: {type: string}
        value: {type: number, format: double}
        unit: {type: string}
        source_value: {type: [number, 'null'], format: double}
        source_unit: {type: [string, 'null']}
        quality_flags: {type: integer, minimum: 0}
    GroupPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [groups]
          properties:
            groups: {type: array, items: {$ref: '#/components/schemas/Group'}}
    BloodPressureReading:
      type: object
      description: A bp_reading group with its components side by side; systolic and diastolic in mmHg, pulse in bpm.
      additionalProperties: false
      required: [id, measured_at, tz_offset_min, local_date, systolic, diastolic, pulse, context, source, provenance]
      properties:
        id: {type: string, description: Group id.}
        measured_at: {type: string, format: date-time}
        tz_offset_min: {type: [integer, 'null']}
        local_date: {type: string, format: date}
        systolic: {type: [number, 'null'], format: double}
        diastolic: {type: [number, 'null'], format: double}
        pulse: {type: [number, 'null'], format: double}
        context: {type: object, x-go-type: json.RawMessage}
        source: {$ref: '#/components/schemas/SourceRef'}
        provenance: {$ref: '#/components/schemas/RecordProvenance'}
    BloodPressurePage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [readings]
          properties:
            readings: {type: array, items: {$ref: '#/components/schemas/BloodPressureReading'}}
    SleepSession:
      type: object
      description: One sleep session as the source reported it.
      additionalProperties: false
      required: [id, start_at, end_at, tz_offset_min, sleep_date, is_nap, has_stages, totals_basis, asleep_s, deep_s, light_s, rem_s, awake_s, latency_s, source, provenance]
      properties:
        id: {type: string, format: uuid}
        start_at: {type: string, format: date-time}
        end_at: {type: string, format: date-time}
        tz_offset_min: {type: [integer, 'null']}
        sleep_date: {type: string, format: date, description: Local date of waking up.}
        is_nap: {type: boolean}
        has_stages: {type: boolean}
        totals_basis: {type: string, enum: [provider, stages], description: Whether the *_s totals are provider-reported or summed from stages.}
        asleep_s: {type: [integer, 'null']}
        deep_s: {type: [integer, 'null']}
        light_s: {type: [integer, 'null']}
        rem_s: {type: [integer, 'null']}
        awake_s: {type: [integer, 'null']}
        latency_s: {type: [integer, 'null']}
        stages:
          type: array
          description: With include=stages, and always on GET /sleep/{id}.
          items: {$ref: '#/components/schemas/SleepStage'}
        source: {$ref: '#/components/schemas/SourceRef'}
        provenance: {$ref: '#/components/schemas/RecordProvenance'}
    SleepStage:
      type: object
      additionalProperties: false
      required: [stage, start_at, end_at]
      properties:
        stage: {type: string, enum: [awake, light, deep, rem, asleep_unspecified, in_bed, unknown, restless, out_of_bed]}
        start_at: {type: string, format: date-time}
        end_at: {type: string, format: date-time}
    SleepPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [sleep]
          properties:
            sleep: {type: array, items: {$ref: '#/components/schemas/SleepSession'}}
    Workout:
      type: object
      description: One workout as the source reported it.
      additionalProperties: false
      required: [id, start_at, end_at, tz_offset_min, local_date, sport, provider_sport, distance_m, energy_kcal, avg_hr_bpm, max_hr_bpm, file_sha256, source, provenance]
      properties:
        id: {type: string, format: uuid}
        start_at: {type: string, format: date-time}
        end_at: {type: string, format: date-time}
        tz_offset_min: {type: [integer, 'null']}
        local_date: {type: string, format: date}
        sport: {type: string, description: Canonical sport.}
        provider_sport: {type: [string, 'null']}
        distance_m: {type: [number, 'null'], format: double}
        energy_kcal: {type: [number, 'null'], format: double}
        avg_hr_bpm: {type: [number, 'null'], format: double}
        max_hr_bpm: {type: [number, 'null'], format: double}
        file_sha256: {type: [string, 'null'], description: Original activity file (FIT, GPX) in the blob store, if any.}
        segments:
          type: array
          description: With include=segments, and always on GET /workouts/{id}.
          items: {$ref: '#/components/schemas/WorkoutSegment'}
        source: {$ref: '#/components/schemas/SourceRef'}
        provenance: {$ref: '#/components/schemas/RecordProvenance'}
    WorkoutSegment:
      type: object
      additionalProperties: false
      required: [seq, kind, start_at, end_at, data]
      properties:
        seq: {type: integer}
        kind: {type: string, enum: [lap, set, interval]}
        start_at: {type: string, format: date-time}
        end_at: {type: [string, 'null'], format: date-time}
        data: {type: object, x-go-type: json.RawMessage}
    WorkoutPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [workouts]
          properties:
            workouts: {type: array, items: {$ref: '#/components/schemas/Workout'}}
    Provenance:
      type: object
      description: >
        Provenance trace of one canonical row (internal/provenance): the row and every earlier
        and later version linked through superseded_by, oldest first. Raw bodies are never
        returned.
      additionalProperties: false
      required: [entity, row, earlier, later]
      properties:
        entity: {type: string, enum: [measurement, group, sleep, workout]}
        row: {$ref: '#/components/schemas/ProvenanceVersion'}
        earlier: {type: array, items: {$ref: '#/components/schemas/ProvenanceVersion'}}
        later: {type: array, items: {$ref: '#/components/schemas/ProvenanceVersion'}}
    ProvenanceVersion:
      type: object
      additionalProperties: false
      required: [id, superseded_by, record, provider, connection_id, connection_mode, client, batch, raw, normalizer, fetched_at, ingested_at, normalized_at, corrected_at, superseded_at, deleted_at, deleted_by]
      properties:
        id: {type: string}
        superseded_by: {type: [string, 'null']}
        record: {type: object, description: 'The stored row''s columns, plus metric, unit, device and origin codes and its stages, segments or components.', x-go-type: json.RawMessage}
        provider: {type: string}
        connection_id: {$ref: '#/components/schemas/ConnectionID'}
        connection_mode: {type: string}
        client:
          description: Pushing client; null for in-process syncs.
          oneOf: [{$ref: '#/components/schemas/ProvenanceClient'}, {type: 'null'}]
        batch:
          description: Null for rows migrated without raw.
          oneOf: [{$ref: '#/components/schemas/ProvenanceBatch'}, {type: 'null'}]
        raw:
          description: Raw payload metadata; null for rows migrated without raw.
          oneOf: [{$ref: '#/components/schemas/ProvenanceRaw'}, {type: 'null'}]
        normalizer: {$ref: '#/components/schemas/ProvenanceNormalizer'}
        fetched_at: {type: [string, 'null'], format: date-time}
        ingested_at: {type: string, format: date-time}
        normalized_at: {type: string, format: date-time}
        corrected_at: {type: [string, 'null'], format: date-time, description: When this version replaced its predecessor.}
        superseded_at: {type: [string, 'null'], format: date-time}
        deleted_at: {type: [string, 'null'], format: date-time}
        deleted_by:
          description: The raw payload that carried the upstream deletion.
          oneOf: [{$ref: '#/components/schemas/ProvenanceDeletion'}, {type: 'null'}]
    ProvenanceClient:
      type: object
      additionalProperties: false
      required: [id, kind, name]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string}
        name: {type: string}
    ProvenanceBatch:
      type: object
      additionalProperties: false
      required: [id, source_kind, migration_source, received_at]
      properties:
        id: {type: string, format: uuid}
        source_kind: {type: string}
        migration_source: {type: [string, 'null']}
        received_at: {type: string, format: date-time}
    ProvenanceRaw:
      type: object
      additionalProperties: false
      required: [id, stream, external_key, version, content_sha256, content_type, size_bytes, fetched_at, stored_at, request_meta, shape_fingerprint, status]
      properties:
        id: {type: string}
        stream: {type: string}
        external_key: {type: string}
        version: {type: integer}
        content_sha256: {type: string}
        content_type: {type: string}
        size_bytes: {type: integer, format: int64}
        fetched_at: {type: string, format: date-time}
        stored_at: {type: string, format: date-time}
        request_meta: {description: Sanitized request., x-go-type: json.RawMessage}
        shape_fingerprint: {type: string}
        status: {type: string}
    ProvenanceNormalizer:
      type: object
      additionalProperties: false
      required: [name, version, git_sha]
      properties:
        name: {type: string}
        version: {type: integer}
        git_sha: {type: string}
    ProvenanceDeletion:
      type: object
      additionalProperties: false
      required: [raw_id, fetched_at]
      properties:
        raw_id: {type: string}
        fetched_at: {type: [string, 'null'], format: date-time}
    Rule:
      $ref: '#/components/schemas/RuleVersion'
    RuleVersion:
      type: object
      description: A rule version, the owner's or a built-in (docs/architecture/resolution.md#rule-specification).
      additionalProperties: false
      required: [ref, metric, version, builtin, default, active, spec, based_on, note, created_by, created_at]
      properties:
        ref: {type: string, description: 'rule:<metric>:<n> for the owner''s versions, builtin:<metric>:<n> for built-ins, default:<metric>:<hash> for the default rule.'}
        metric: {type: string, description: "Catalogue code or rule family (sleep, blood_pressure)."}
        version: {type: integer, minimum: 1}
        builtin: {type: boolean, description: Shipped with Vitamux rather than stored by the owner; true for the default rule too.}
        default:
          type: boolean
          description: >
            The default rule of a metric without a built-in: the owner's source order (setting
            sources.priority), then a generic device ladder (docs/resolution-defaults.md#default-rule).
        active: {type: boolean, description: The rule in effect for the metric.}
        spec: {type: object, description: The typed rule (schemas/resolution-rule.v1.json)., x-go-type: json.RawMessage}
        based_on: {type: [string, 'null'], description: The built-in or default rule this version copied.}
        note: {type: [string, 'null']}
        created_by: {type: [string, 'null'], description: Audit actor; null for built-ins.}
        created_at: {type: [string, 'null'], format: date-time, description: Null for built-ins.}
        reason: {type: string, description: 'Built-ins only: why the ladder is ordered this way, or why the metric uses the default rule (docs/resolution-defaults.md).'}
    RuleVersionInput:
      type: object
      additionalProperties: false
      required: [spec]
      properties:
        spec:
          type: object
          description: >
            The typed rule (docs/architecture/resolution.md#rule-specification); its metric must be
            the path's. A sum across sources needs acknowledged_warnings in the spec, else 409
            rule_warning_unacknowledged.
          x-go-type: json.RawMessage
        note: {type: string, maxLength: 500}
        activate: {type: boolean, default: false, description: Also make it the active version.}
    RuleActivation:
      type: object
      required: [version]
      properties:
        version: {type: integer, minimum: 1}
        acknowledge_warnings: {type: array, items: {type: string}, description: Ignored; acknowledgements are part of the rule spec (acknowledged_warnings).}
    Override:
      type: object
      description: A manual override (docs/architecture/resolution.md#manual-overrides). Only the fields of its action are set.
      additionalProperties: false
      required: [id, metric, window, action, input_id, group, value, unit, note, active, created_by, created_at, revoked_by, revoked_at]
      properties:
        id: {type: string, format: uuid}
        metric: {type: string, description: Rule metric (catalogue code or family).}
        window: {$ref: '#/components/schemas/OverrideWindow'}
        action: {type: string, enum: [exclude_input, force_source, set_value]}
        input_id: {type: [string, 'null'], description: 'exclude_input: the measurement id.'}
        group: {type: [string, 'null'], description: 'force_source: the rule group id.'}
        value: {type: [number, 'null'], format: double, description: 'set_value: the value in the canonical unit.'}
        unit: {type: [string, 'null']}
        note: {type: [string, 'null']}
        active: {type: boolean, description: False once revoked.}
        created_by: {type: string}
        created_at: {type: string, format: date-time}
        revoked_by: {type: [string, 'null']}
        revoked_at: {type: [string, 'null'], format: date-time}
    OverrideWindow:
      type: object
      additionalProperties: false
      required: [kind, key, local_date]
      properties:
        kind: {type: string, enum: [bucket, hour, local_day, local_night, sleep_episode, latest, reading]}
        key: {type: string, minLength: 1, description: The window key of a resolved result.}
        local_date: {type: string, format: date, description: The local date the window belongs to.}
    OverrideInput:
      type: object
      description: 'exclude_input needs input_id, force_source group, set_value value, unit and note.'
      additionalProperties: false
      required: [metric, window, action]
      properties:
        metric: {type: string}
        window: {$ref: '#/components/schemas/OverrideWindow'}
        action: {type: string, enum: [exclude_input, force_source, set_value]}
        input_id: {type: string, pattern: '^[0-9]+$'}
        group: {type: string}
        value: {type: number, format: double}
        unit: {type: string}
        note: {type: string, maxLength: 1000}
    OverridePage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [overrides]
          properties:
            overrides: {type: array, items: {$ref: '#/components/schemas/Override'}}
    Connection:
      type: object
      description: A connection with its derived health; never credentials.
      additionalProperties: false
      required: [id, provider, mode, status, official, upstream, health, health_reason, last_success_at, last_error_class, consecutive_failures, created_at, updated_at]
      properties:
        id: {$ref: '#/components/schemas/ConnectionID'}
        provider: {type: string, description: Provider code.}
        mode: {type: string, enum: [in_process, push, remote]}
        status: {type: string, enum: [active, degraded, needs_reauth, paused, error, disabled]}
        official: {type: [boolean, 'null'], description: False for an unofficial API; null when no connector is registered (push sources).}
        upstream: {oneOf: [{$ref: '#/components/schemas/Upstream'}, {type: 'null'}], description: The third-party package a sidecar connector wraps; null for in-process and push connections.}
        health: {$ref: '#/components/schemas/Health'}
        health_reason: {type: [string, 'null']}
        last_success_at: {type: [string, 'null'], format: date-time}
        last_error_class: {type: [string, 'null']}
        consecutive_failures: {type: integer, minimum: 0}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    Health:
      type: string
      description: Derived health (internal/connectors/health.go).
      enum: [ok, degraded, failing, needs_reauth, paused, disabled, stale]
    ConnectionInput:
      type: object
      description: A push connection (clients upload to it). Providers with a server-side connector connect through POST /providers/{provider}/auth/begin.
      additionalProperties: false
      required: [provider]
      properties:
        provider: {type: string, pattern: '^[a-z][a-z0-9_]*$'}
    ConnectionPatch:
      type: object
      additionalProperties: false
      properties:
        status: {type: string, enum: [active, paused], description: Pause or resume; only between active/degraded and paused.}
    Provider:
      type: object
      description: A provider served by a registered connector.
      additionalProperties: false
      required: [code, name, official, auth_kind, remote, available, setup_state, callback_url, problems, app_credentials, sidecar, connections]
      properties:
        code: {type: string}
        name: {type: string}
        official: {type: boolean, description: False for an unofficial API; its new connections start paused.}
        auth_kind: {type: [string, 'null'], enum: [none, oauth2, interactive_mfa, device_pairing, null], description: Null while a sidecar has not described itself.}
        remote: {type: boolean, description: Served by a sidecar.}
        available: {type: boolean, description: False while a sidecar is unreachable or has not described itself.}
        upstream: {$ref: '#/components/schemas/Upstream'}
        setup_state:
          type: string
          enum: [needs_sidecar, connected, needs_public_url, needs_app_credentials, ready]
          description: >
            The first that applies: needs_sidecar (the sidecar does not answer; see sidecar.enable
            and problems), connected (a connection that is not disconnected exists),
            needs_public_url (production only: the provider would refuse the callback; see
            problems), needs_app_credentials (set them with putProviderAppCredentials), ready.
        callback_url: {type: [string, 'null'], description: 'The OAuth callback to register at the provider, ${VITAMUX_PUBLIC_URL}/oauth/<provider>/callback; null for providers without a redirect.'}
        problems:
          type: array
          description: What stands in the way of setup; in development the public URL problems are warnings.
          items: {$ref: '#/components/schemas/SetupProblem'}
        app_credentials:
          description: Null for a provider that does not run on the owner's own application.
          oneOf:
            - {$ref: '#/components/schemas/AppCredentialsStatus'}
            - {type: 'null'}
        sidecar:
          description: Null for an in-process connector.
          oneOf:
            - {$ref: '#/components/schemas/ProviderSidecar'}
            - {type: 'null'}
        connections: {type: integer, minimum: 0, description: The caller's connections of this provider that are not disconnected.}
    SetupProblem:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum: [public_url_not_https, public_url_ip_host, public_url_port, public_url_too_long, sidecar_unreachable, sidecar_secret_missing, sidecar_failed]
        message: {type: string, description: What to do, in plain language.}
    AppCredentialsStatus:
      type: object
      description: The owner's application at the provider; the secret is write-only and never shown.
      additionalProperties: false
      required: [set, managed_by_environment, client_id, updated_at]
      properties:
        set: {type: boolean}
        managed_by_environment: {type: boolean, description: Set by VITAMUX_<PROVIDER>_CLIENT_ID and _SECRET(_FILE), which win over the panel; read-only here.}
        client_id: {type: [string, 'null']}
        updated_at: {type: [string, 'null'], format: date-time, description: Last change in the panel; null when unset or set by the environment.}
    AppCredentialsInput:
      type: object
      additionalProperties: false
      required: [client_id, client_secret]
      properties:
        client_id: {type: string, minLength: 1, maxLength: 512}
        client_secret: {type: string, minLength: 1, maxLength: 1024, description: Write-only; never returned.}
    AppCredentialsVerification:
      type: object
      additionalProperties: false
      required: [result, message]
      properties:
        result: {type: string, enum: [valid, invalid, unverifiable]}
        message: {type: string}
    ProviderSidecar:
      type: object
      description: How a sidecar provider is registered and, for a bundled one, how to turn it on.
      additionalProperties: false
      required: [source, bundled, enable]
      properties:
        source: {type: string, enum: [environment, panel], description: environment (VITAMUX_SIDECARS) is read-only; panel ones can be removed.}
        bundled: {type: boolean, description: Shipped with the release Compose files (garmin, whoop), off until enabled.}
        enable:
          type: array
          description: For a bundled sidecar, the line to add and what to run, for this install (VITAMUX_INSTALL) or for each when unknown; empty otherwise.
          items: {$ref: '#/components/schemas/SidecarEnable'}
    SidecarEnable:
      type: object
      additionalProperties: false
      required: [install, line, apply]
      properties:
        install: {type: string, enum: [compose, coolify]}
        line: {type: string, description: 'Compose: the .env line, e.g. COMPOSE_PROFILES=garmin (comma-separate several profiles). Coolify: the environment variable, e.g. GARMIN_SIDECAR=1.'}
        apply: {type: string, description: What to run afterwards.}
    Sidecar:
      type: object
      additionalProperties: false
      required: [name, url, source, bundled, available, created_at]
      properties:
        name: {type: string}
        url: {type: string}
        source: {type: string, enum: [environment, panel]}
        bundled: {type: boolean}
        available: {type: boolean, description: The sidecar answered its last describe.}
        created_at: {type: [string, 'null'], format: date-time, description: Panel sidecars only.}
    CreatedSidecar:
      type: object
      additionalProperties: false
      required: [sidecar, secret]
      properties:
        sidecar: {$ref: '#/components/schemas/Sidecar'}
        secret: {type: string, description: 'The shared bearer secret (64 hex characters), shown only here: give it to the sidecar as its VITAMUX_SIDECAR_SECRET_FILE.'}
    Upstream:
      type: object
      description: The third-party package a sidecar connector wraps.
      additionalProperties: false
      required: [package, version, source_url]
      properties:
        package: {type: string}
        version: {type: string}
        source_url: {type: string}
    AuthStep:
      description: Next interactive auth step.
      oneOf:
        - {$ref: '#/components/schemas/AuthRedirect'}
        - {$ref: '#/components/schemas/AuthPromptStep'}
    AuthRedirect:
      type: object
      description: Send the browser to the provider; its callback continues the flow.
      additionalProperties: false
      required: [redirect_url]
      properties:
        redirect_url: {type: string}
    AuthPromptStep:
      type: object
      description: Ask the owner for the prompt's fields and send them with the state to continueProviderAuth.
      additionalProperties: false
      required: [state, prompt]
      properties:
        state: {type: string}
        prompt:
          type: object
          additionalProperties: false
          required: [message, fields]
          properties:
            message: {type: string}
            fields:
              type: array
              minItems: 1
              items:
                type: object
                additionalProperties: false
                required: [name, label, kind]
                properties:
                  name: {type: string}
                  label: {type: string}
                  kind: {type: string, enum: [text, password, code]}
    AuthDone:
      type: object
      description: Authorized; the connection was created or updated.
      additionalProperties: false
      required: [connection_id]
      properties:
        connection_id: {$ref: '#/components/schemas/ConnectionID'}
    AuthContinueInput:
      type: object
      additionalProperties: false
      required: [state, values]
      properties:
        state: {type: string, maxLength: 512}
        values:
          type: object
          description: The prompt's field values by name; never stored or logged.
          maxProperties: 16
          additionalProperties: {type: string, maxLength: 4096}
    BackfillInput:
      type: object
      additionalProperties: false
      required: [stream, start]
      properties:
        stream: {type: string}
        start: {type: string, format: date-time}
        end: {type: string, format: date-time, description: Exclusive; now when omitted.}
        daily_limit: {type: integer, minimum: 1, description: 'A paced backfill: at most this many units start a UTC day, the rest wait for the next day (a slow mode for provider-limited work such as the Garmin reload).'}
    Backfill:
      type: object
      additionalProperties: false
      required: [id, connection_id, stream, start, end, status, created_at, finished_at, unit_counts]
      properties:
        id: {type: string, format: uuid}
        connection_id: {$ref: '#/components/schemas/ConnectionID'}
        stream: {type: string}
        start: {type: string, format: date-time}
        end: {type: string, format: date-time}
        status: {type: string, enum: [running, done, failed, cancelled]}
        created_at: {type: string, format: date-time}
        finished_at: {type: [string, 'null'], format: date-time}
        daily_limit: {type: [integer, 'null'], description: Units a UTC day for a paced backfill; null when unpaced.}
        unit_counts:
          type: object
          additionalProperties: false
          required: [pending, running, done, failed]
          properties:
            pending: {type: integer, minimum: 0}
            running: {type: integer, minimum: 0}
            done: {type: integer, minimum: 0}
            failed: {type: integer, minimum: 0}
        units: {type: array, items: {$ref: '#/components/schemas/BackfillUnit'}, description: Only on GET of one backfill.}
    BackfillUnit:
      type: object
      additionalProperties: false
      required: [start, end, status, attempts, error_class, updated_at]
      properties:
        start: {type: string, format: date-time}
        end: {type: string, format: date-time}
        status: {type: string, enum: [pending, running, done, failed]}
        attempts: {type: integer, minimum: 0}
        error_class: {type: [string, 'null']}
        updated_at: {type: string, format: date-time}
    BackfillRetryInput:
      type: object
      additionalProperties: false
      properties:
        unit_start: {type: string, format: date-time, description: Retry only the unit starting here; all failed units when omitted.}
    Run:
      type: object
      description: One job execution.
      additionalProperties: false
      required: [id, job_id, kind, attempt, started_at, finished_at, outcome, error_class, error_message, stats]
      properties:
        id: {type: string}
        job_id: {type: string, format: uuid}
        kind: {type: string}
        attempt: {type: integer, minimum: 1}
        started_at: {type: string, format: date-time}
        finished_at: {type: [string, 'null'], format: date-time}
        outcome: {type: [string, 'null'], description: Null while running.}
        error_class: {type: [string, 'null']}
        error_message: {type: [string, 'null'], description: Sanitized.}
        stats: {type: object, x-go-type: json.RawMessage}
    RunPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [runs]
          properties:
            runs: {type: array, items: {$ref: '#/components/schemas/Run'}}
    Stream:
      type: object
      description: A connection's stream with its sync state. The cursor itself is not shown.
      additionalProperties: false
      required: [name, health, health_reason, status, status_reason, has_cursor, high_watermark, updated_at, schedules]
      properties:
        name: {type: string}
        health: {$ref: '#/components/schemas/Health'}
        health_reason: {type: [string, 'null']}
        status: {type: string, enum: [ok, degraded]}
        status_reason: {type: [string, 'null']}
        has_cursor: {type: boolean}
        high_watermark: {type: [string, 'null'], format: date-time, description: Newest source time seen.}
        updated_at: {type: [string, 'null'], format: date-time}
        schedules: {type: array, items: {$ref: '#/components/schemas/Schedule'}}
    Schedule:
      type: object
      additionalProperties: false
      required: [id, connection_id, stream, mode, interval_seconds, lookback_seconds, enabled, next_run_at]
      properties:
        id: {type: string, format: uuid}
        connection_id: {$ref: '#/components/schemas/ConnectionID'}
        stream: {type: string}
        mode: {type: string, enum: [incremental, correction]}
        interval_seconds: {type: integer, minimum: 60}
        lookback_seconds: {type: integer, minimum: 0}
        enabled: {type: boolean}
        next_run_at: {type: string, format: date-time}
    SchedulePatch:
      type: object
      description: Merge patch; omitted fields keep their value.
      additionalProperties: false
      properties:
        interval_seconds: {type: integer, minimum: 60}
        lookback_seconds: {type: integer, minimum: 0}
        enabled: {type: boolean}
    PairedDevice:
      type: object
      description: A device paired with a pairing code (an ingest client of kind device).
      additionalProperties: false
      required: [id, name, connection_id, created_at, last_seen_at, last_sync_at, revoked_at, types, possibly_denied, anchor_resets]
      properties:
        id: {type: string, format: uuid, description: The device_id returned by pairing.}
        name: {type: string}
        connection_id: {type: string, pattern: '^conn_[0-9a-f]{32}$'}
        created_at: {type: string, format: date-time}
        last_seen_at: {type: [string, 'null'], format: date-time, description: Last authenticated request (to the minute).}
        last_sync_at: {type: [string, 'null'], format: date-time, description: When its newest batch arrived.}
        revoked_at: {type: [string, 'null'], format: date-time}
        types:
          type: array
          items: {type: string}
          description: HealthKit types in the connection's last healthkit.samples.v1 heartbeat checkpoint; empty until the device sends one.
        possibly_denied:
          type: array
          items: {type: string}
          description: >
            Requested types the connection stored nothing for in the last 7 days, while the device
            was paired for longer and seen within them. HealthKit does not reveal read denial, so
            this is a hint: a type can also be silent because there is nothing new to record. Types
            are tracked per connection, which paired devices share. Empty for a revoked device.
        anchor_resets: {type: array, items: {$ref: '#/components/schemas/AnchorReset'}}
    DataOrigin:
      type: object
      description: An app that recorded data inside a transport provider, e.g. a HealthKit bundle id.
      additionalProperties: false
      required: [id, provider, origin_key, name, is_native, relayed_provider, created_at]
      properties:
        id: {type: string, format: uuid}
        provider: {type: string, description: The transport provider code, e.g. apple_health.}
        origin_key: {type: string, description: 'The `origin_key` rule selector value.'}
        name: {type: [string, 'null']}
        is_native: {type: boolean, description: Recorded by the platform itself, such as Apple's own apps.}
        relayed_provider: {type: [string, 'null'], description: The vendor whose data the app relays; null when it records its own.}
        created_at: {type: string, format: date-time, description: When the origin was first seen.}
    RelayTarget:
      type: object
      additionalProperties: false
      required: [code, name]
      properties:
        code: {type: string}
        name: {type: string}
    SourceDevice:
      type: object
      additionalProperties: false
      required: [id, provider, fingerprint, name, device_type, manufacturer, model, merged_into]
      properties:
        id: {$ref: '#/components/schemas/DeviceID'}
        provider: {type: string}
        fingerprint: {type: string, description: "The device's identity at the provider, as the normalizer reports it."}
        name: {type: [string, 'null'], description: The owner's label.}
        device_type: {type: [string, 'null'], description: 'The `device_type` rule selector value, e.g. watch.'}
        manufacturer: {type: [string, 'null'], description: 'The `device_manufacturer` rule selector value (the brand; matched case-insensitively).'}
        model: {type: [string, 'null'], description: 'The `device_model` rule selector value.'}
        merged_into:
          oneOf: [{$ref: '#/components/schemas/DeviceID'}, {type: 'null'}]
          description: The device this one was merged into; its records live there.
        connections:
          type: array
          description: 'With include=records: the connections with active records of the device, and how many.'
          items: {$ref: '#/components/schemas/DeviceConnectionRecords'}
    SourceDevicePatch:
      type: object
      description: Merge patch of a device; null clears a field.
      additionalProperties: false
      properties:
        device_type: {type: [string, 'null'], description: One of device_types from GET /source-devices.}
        name: {type: [string, 'null'], minLength: 1, maxLength: 100}
      x-go-type: json.RawMessage
    DeviceConnectionRecords:
      type: object
      additionalProperties: false
      required: [connection_id, records]
      properties:
        connection_id: {type: string, pattern: '^conn_[0-9a-f]{32}$'}
        records: {$ref: '#/components/schemas/DeviceRecords'}
    DeviceRecords:
      type: object
      additionalProperties: false
      description: >-
        Rows per table. Measurements count hourly aggregate rows plus daily values in a listing (an interval once per
        hour it touches, behind while aggregates rebuild), and rows in a merge.
      required: [measurements, groups, sleep_sessions, workouts, events]
      properties:
        measurements: {type: integer, format: int64}
        groups: {type: integer, format: int64}
        sleep_sessions: {type: integer, format: int64}
        workouts: {type: integer, format: int64}
        events: {type: integer, format: int64}
    AnchorReset:
      type: object
      additionalProperties: false
      required: [type, requested_at]
      properties:
        type: {type: string, description: 'A HealthKit type identifier, or * for every type.'}
        requested_at: {type: string, format: date-time, description: The latest request for this type.}
    PairingCode:
      type: object
      additionalProperties: false
      required: [code, expires_at, url, qr_payload]
      properties:
        code: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{4}-[0-9A-HJKMNP-TV-Z]{4}$', description: Crockford base32; single use.}
        expires_at: {type: string, format: date-time}
        url: {type: string, format: uri, description: The public base URL (VITAMUX_PUBLIC_URL) the app pairs against.}
        qr_payload: {type: string, description: 'Text for the QR code: the JSON object {"url", "code"} and nothing else.'}
    DevicePairing:
      type: object
      additionalProperties: false
      required: [device_id, connection_id, token]
      properties:
        device_id: {type: string, format: uuid}
        connection_id: {type: string, pattern: '^conn_[0-9a-f]{32}$'}
        token: {type: string, pattern: '^vmx_cli_[0-9a-f]{32}_[A-Za-z0-9_-]{43}$', description: 'Client token with scope ingest:<connection_id>; store it in the Keychain.'}
    DeviceSelf:
      type: object
      additionalProperties: false
      required: [device_id, connection_id, name, anchor_resets]
      properties:
        device_id: {type: string, format: uuid}
        connection_id: {type: string, pattern: '^conn_[0-9a-f]{32}$'}
        name: {type: string}
        anchor_resets:
          type: array
          items: {$ref: '#/components/schemas/AnchorReset'}
          description: >
            Every reset the owner requested, kept by the server. Apply those whose requested_at is
            after the last reset applied for that type (* covers every type).
    Document:
      type: object
      description: A stored lab PDF. A deleted document keeps only its id, status, sizes and times.
      required: [id, status, sha256, filename, size_bytes, page_count, uploaded_at, retention_until, deleted_at]
      properties:
        id: {type: string, pattern: '^doc_[0-9a-f]{32}$'}
        status: {type: string, enum: [uploaded, extracting, needs_review, confirmed, deleted]}
        sha256: {type: [string, 'null'], pattern: '^[0-9a-f]{64}$', description: SHA-256 of the PDF; null once deleted.}
        filename: {type: [string, 'null'], description: Original filename; null when none was given or once deleted.}
        size_bytes: {type: integer, minimum: 1}
        page_count: {type: integer, minimum: 1}
        uploaded_at: {type: string, format: date-time}
        retention_until: {type: [string, 'null'], format: date-time, description: When the retention policy deletes the original; null keeps it.}
        deleted_at: {type: [string, 'null'], format: date-time}
    DocumentPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [documents]
          properties:
            documents: {type: array, items: {$ref: '#/components/schemas/Document'}}
    ExtractionInput:
      type: object
      description: Extractor choice and the owner's consent to send the PDF to it (ADR-0013).
      additionalProperties: false
      required: [provider]
      properties:
        provider: {type: string, enum: [fake, gemini, openai, openai_compatible]}
        consent:
          oneOf:
            - {$ref: '#/components/schemas/ExtractionConsent'}
            - {type: 'null'}
    ExtractionConsent:
      type: object
      description: Required for external providers; provider and model must match the configured ones, which the UI shows before asking.
      additionalProperties: false
      required: [provider, model, acknowledged_at]
      properties:
        provider: {type: string}
        model: {type: string}
        acknowledged_at: {type: string, format: date-time}
    Extractor:
      type: object
      description: A configured extraction provider (lab-documents.md#privacy-controls).
      additionalProperties: false
      required: [id, external, model, enabled]
      properties:
        id: {type: string, enum: [fake, gemini, openai, openai_compatible]}
        external: {type: boolean, description: True when extraction sends the PDF off the host (needs enablement and consent).}
        model: {type: [string, 'null'], description: The configured model that consent must name; null for fake.}
        enabled: {type: boolean, description: Whether the owner enabled it; always true for fake.}
    Extraction:
      type: object
      description: One extraction run. The raw provider response is stored encrypted and never returned.
      required: [id, document_id, status, provider, model, external, consent, schema_version, prompt_version, provider_request_id,
        document, usage, warnings, error_class, row_count, created_by, created_at, started_at, finished_at]
      properties:
        id: {type: string, pattern: '^ext_[0-9a-f]{32}$'}
        document_id: {type: string, pattern: '^doc_[0-9a-f]{32}$'}
        status: {type: string, enum: [queued, running, succeeded, failed, confirmed], description: 'queued with an error_class: the last attempt failed and will be retried.'}
        provider: {type: string}
        model: {type: [string, 'null'], description: Model the provider reported (or the configured one).}
        external: {type: boolean, description: True when the PDF was sent off the host.}
        consent:
          oneOf:
            - {$ref: '#/components/schemas/ExtractionConsent'}
            - {type: 'null'}
        schema_version: {type: string}
        prompt_version: {type: string}
        provider_request_id: {type: [string, 'null']}
        document: {type: object, description: 'Document-level fields as extracted (laboratory, specimen_type, dates, page_count); empty until succeeded.', x-go-type: json.RawMessage}
        usage: {type: object, description: Token counts the provider reported., x-go-type: json.RawMessage}
        warnings: {type: array, items: {type: string}, description: Document-level extractor warnings.}
        error_class: {type: [string, 'null'], description: 'Why the run failed (or the last attempt): provider_disabled, consent_mismatch, auth, rejected, rate_limited, transient, too_large, refused, invalid_output, unknown_document, provider_unavailable, abandoned.'}
        row_count: {type: integer, minimum: 0}
        created_by: {type: string}
        created_at: {type: string, format: date-time}
        started_at: {type: [string, 'null'], format: date-time}
        finished_at: {type: [string, 'null'], format: date-time}
        rows: {type: array, items: {$ref: '#/components/schemas/ExtractionRow'}, description: 'The rows, on GET /extractions/{id} and after review actions.'}
    ExtractionRow:
      type: object
      description: >-
        An extracted row under review: values as printed (or as the owner edited them), the analyte confirming would
        record, and warnings that only point at what to compare with the PDF.
      required: [index, page, analyte_label, value_text, value_numeric, comparator, unit_text, reference_range_text, ref_low, ref_high,
        printed_flag, specimen_type, collected_at, reported_at, laboratory, evidence_text, bbox, confidence, review_status, reviewed_at,
        analyte, suggested_analyte, warnings, validation, edits, lab_result_id]
      properties:
        index: {type: integer, minimum: 0}
        page: {type: [integer, 'null'], minimum: 1}
        analyte_label: {type: string, description: The label as printed.}
        value_text: {type: [string, 'null']}
        value_numeric: {type: [number, 'null'], format: double}
        comparator: {type: [string, 'null'], description: '<, >, <= or >=.'}
        unit_text: {type: [string, 'null'], description: The unit as printed.}
        reference_range_text: {type: [string, 'null']}
        ref_low: {type: [number, 'null'], format: double}
        ref_high: {type: [number, 'null'], format: double}
        printed_flag: {type: [string, 'null'], description: The flag as printed; never computed.}
        specimen_type: {type: [string, 'null']}
        collected_at: {type: [string, 'null'], description: ISO 8601 local date or date-time without offset.}
        reported_at: {type: [string, 'null'], description: ISO 8601 local date or date-time without offset.}
        laboratory: {type: [string, 'null']}
        evidence_text: {type: string, description: The printed text the row was read from.}
        bbox:
          oneOf:
            - type: object
              description: Row area as fractions of the page, origin top left.
              required: [x0, y0, x1, y1]
              properties:
                x0: {type: number, format: double}
                y0: {type: number, format: double}
                x1: {type: number, format: double}
                y1: {type: number, format: double}
            - {type: 'null'}
          x-go-type: json.RawMessage
        confidence: {type: number, format: double, minimum: 0, maximum: 1, description: Extractor hint only; never a reason to skip review.}
        review_status: {type: string, enum: [pending, accepted, edited, rejected]}
        reviewed_at: {type: [string, 'null'], format: date-time}
        analyte: {type: [string, 'null'], description: 'Analyte code confirming records: the alias suggestion while pending, then the reviewed one. Null is unknown, which stays confirmable.'}
        suggested_analyte: {type: [string, 'null'], description: The current alias suggestion (analyte_aliases).}
        warnings: {type: array, items: {type: string}, description: The extractor's warnings.}
        validation:
          type: array
          items: {type: string}
          description: >-
            Deterministic checks (lab-documents.md#validation): value_mismatch, comparator_mismatch, range_mismatch,
            evidence_unverified, value_not_in_evidence, unknown_unit, unit_not_convertible, unit_missing, date_missing,
            date_in_future, date_ambiguous, reported_before_collected, duplicate_in_run, already_confirmed, unknown_analyte.
        edits: {type: array, items: {$ref: '#/components/schemas/ExtractionRowEdit'}, description: The review trail, oldest first.}
        lab_result_id: {type: [string, 'null'], pattern: '^lab_[0-9a-f]{32}$', description: The confirmed result.}
    ExtractionRowEdit:
      type: object
      required: [action, changes, actor, created_at]
      properties:
        action: {type: string, enum: [edit, accept, reject]}
        changes: {type: object, description: '{"field": {"from": old, "to": new}} for edits.', x-go-type: json.RawMessage}
        actor: {type: string}
        created_at: {type: string, format: date-time}
    ExtractionRowPatch:
      type: object
      description: Merge patch of an extracted row; every field is optional and null clears it.
      additionalProperties: false
      properties:
