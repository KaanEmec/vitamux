        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}

  /api/v1/system/status:
    get:
      tags: [system]
      operationId: getSystemStatus
      summary: Instance diagnostics
      description: Versions, database and blob sizes, last backup, degraded connections, failing jobs.
      security: [{session: []}, {appSession: []}, {apiKey: ['read:config']}]
      responses:
        '200':
          description: Status.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SystemStatus'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}

  /api/v1/system/version:
    get:
      tags: [system]
      operationId: getSystemVersion
      summary: Build version of the running server
      security: [{session: []}, {appSession: []}, {apiKey: ['read:config']}]
      responses:
        '200':
          description: Version.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SystemVersion'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}

  /api/v1/jobs:
    get:
      tags: [system]
      operationId: listJobs
      summary: List background jobs
      security: [{session: []}, {appSession: []}, {apiKey: ['read:config']}]
      parameters:
        - name: status
          in: query
          required: false
          schema: {type: string}
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of jobs.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JobPage'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}

  # ---------------------------------------------------------------- connections
  /api/v1/connections:
    get:
      tags: [connections]
      operationId: listConnections
      summary: List connections with health
      security: [{session: []}, {appSession: []}, {apiKey: ['read:config']}]
      responses:
        '200':
          description: All connections.
          content:
            application/json:
              schema:
                type: object
                required: [connections]
                properties:
                  connections: {type: array, items: {$ref: '#/components/schemas/Connection'}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      tags: [connections]
      operationId: createConnection
      summary: Create a connection
      security: [{session: [], csrf: []}, {appSession: []}, {apiKey: ['write:config']}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConnectionInput'}
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Connection'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}

  /api/v1/connections/{id}:
    get:
      tags: [connections]
      operationId: getConnection
      summary: Get one connection
      security: [{session: []}, {appSession: []}, {apiKey: ['read:config']}]
      parameters:
        - $ref: '#/components/parameters/ConnectionIDPath'
      responses:
        '200':
          description: The connection.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Connection'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
    patch:
      tags: [connections]
      operationId: updateConnection
      summary: Update a connection
      security: [{session: [], csrf: []}, {appSession: []}, {apiKey: ['write:config']}]
      parameters:
        - $ref: '#/components/parameters/ConnectionIDPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConnectionPatch'}
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Connection'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
    delete:
      tags: [connections]
      operationId: deleteConnection
      summary: Delete a connection, keeping or deleting its data
      security: [{session: [], csrf: []}, {appSession: []}, {apiKey: ['write:config']}]
      parameters:
        - $ref: '#/components/parameters/ConnectionIDPath'
        - name: data
          in: query
          required: true
          description: >
            keep deletes the credentials and disables the connection; its data stays.
            delete also removes its raw payloads, canonical rows, cursors, schedules and jobs
            (refused with 409 while one of its jobs runs).
          schema: {type: string, enum: [keep, delete]}
      responses:
        '204':
          description: Deleted.
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}

  /api/v1/connections/{id}/auth/begin:
    post:
      tags: [connections]
      operationId: beginConnectionAuth
      summary: Reauthorize a connection (OAuth redirect or credential prompt)
      description: >
        Answers the first step: {"redirect_url"} to send the browser to the provider, or
        {"state", "prompt"} to ask the owner for values and send them to continueProviderAuth.
        Sets the short-lived browser-binding cookie that the callback and continue need
        (docs/architecture/connectors.md#oauth-connection-flow). Owner session only, since the
        state is bound to it.
      security: [{session: [], csrf: []}, {appSession: []}]
      parameters:
        - $ref: '#/components/parameters/ConnectionIDPath'
      responses:
        '200':
          description: Next step.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthStep'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}

  /api/v1/providers/{provider}/auth/begin:
    post:
      tags: [connections]
      operationId: beginProviderAuth
      summary: Connect an account of a provider (OAuth redirect or credential prompt)
      description: >
        Like beginConnectionAuth, for an account not connected yet. The last step creates the
        connection, or reuses the existing one when the same provider account connects again.
        A new connection of an unofficial connector starts paused.
      security: [{session: [], csrf: []}, {appSession: []}]
      parameters:
        - name: provider
          in: path
          required: true
          schema: {type: string, pattern: '^[a-z][a-z0-9_]*$'}
      responses:
        '200':
          description: Next step.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthStep'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}

  /api/v1/providers/{provider}/app-credentials:
    put:
      tags: [connections]
      operationId: putProviderAppCredentials
      summary: Set the owner's own app credentials of a provider (write-only)
      description: >
        Stores the client id and secret of the owner's application at the provider (e.g. the
        Withings developer app), sealed; the next authorization, exchange and refresh use them,
        without a restart (docs/adr/0021-source-setup.md). The secret is never returned. 409
        while the environment sets them (managed_by_environment). Audited as provider_app.set.
        Owner session only.
      security: [{session: [], csrf: []}, {appSession: []}]
      parameters:
        - name: provider
          in: path
          required: true
          schema: {type: string, pattern: '^[a-z][a-z0-9_]*$'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AppCredentialsInput'}
      responses:
        '200':
          description: The provider with its new setup state.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Provider'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
    delete:
      tags: [connections]
      operationId: deleteProviderAppCredentials
      summary: Remove the stored app credentials of a provider
      description: >
        409 while connections hold tokens that refresh with these credentials, unless
        confirm=true (those connections then need new credentials before their next refresh),
        and while the environment sets them. Audited as provider_app.delete. Owner session only.
      security: [{session: [], csrf: []}, {appSession: []}]
      parameters:
        - name: provider
          in: path
          required: true
          schema: {type: string, pattern: '^[a-z][a-z0-9_]*$'}
        - name: confirm
          in: query
          required: false
          description: true removes them even while connections use them.
          schema: {type: boolean, default: false}
      responses:
        '204':
          description: Removed.
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}

  /api/v1/providers/{provider}/app-credentials/verify:
    post:
      tags: [connections]
      operationId: verifyProviderAppCredentials
      summary: Check the current app credentials with the provider, without a user grant
      description: >
        valid or invalid where the provider can check them (Withings: a signed nonce request);
        unverifiable where it needs a user grant, and the first connect checks them. 404 when
        none are set; 429 or 503 when the provider is rate limiting or unreachable. Audited as
        provider_app.verify. Owner session only.
      security: [{session: [], csrf: []}, {appSession: []}]
      parameters:
        - name: provider
          in: path
          required: true
          schema: {type: string, pattern: '^[a-z][a-z0-9_]*$'}
      responses:
        '200':
          description: The outcome.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AppCredentialsVerification'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}

  /api/v1/providers/{provider}/probe:
    post:
      tags: [connections]
      operationId: probeProvider
      summary: Check a sidecar provider again now ("Check again")
      description: >
        Describes the provider's sidecar at once instead of waiting for the once-a-minute
        re-check, and answers the provider with its new setup state. Other providers are
        answered as they are.
      security: [{session: [], csrf: []}, {appSession: []}, {apiKey: ['write:config']}]
      parameters:
        - name: provider
          in: path
          required: true
          schema: {type: string, pattern: '^[a-z][a-z0-9_]*$'}
      responses:
        '200':
          description: The provider.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Provider'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}

  /api/v1/sidecars:
    get:
      tags: [connections]
      operationId: listSidecars
      summary: List the sidecar connectors, from the environment and added in the panel
      security: [{session: []}, {appSession: []}, {apiKey: ['read:config']}]
      responses:
        '200':
          description: Every registered sidecar, by name. Environment ones are read-only.
          content:
            application/json:
              schema:
                type: object
                required: [sidecars]
                properties:
                  sidecars: {type: array, items: {$ref: '#/components/schemas/Sidecar'}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
    post:
      tags: [connections]
      operationId: createSidecar
      summary: Add a sidecar connector; its shared secret is returned once
      description: >
        Registers a sidecar at a private-network URL under a provider code. Vitamux generates the
        shared bearer secret, stores it sealed and returns it once, to configure the sidecar with;
        the provider is needs_sidecar until the sidecar answers describe (probeProvider checks
        again). Audited as sidecar.add. Owner session only.
      security: [{session: [], csrf: []}, {appSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, url]
              properties:
                name: {type: string, pattern: '^[a-z][a-z0-9_]*$', maxLength: 63, description: Provider code the sidecar describes.}
                url: {type: string, maxLength: 2048, description: 'Base URL, e.g. http://my-sidecar:8080; it must resolve to a loopback, private or link-local address.'}
      responses:
        '201':
          description: Added.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CreatedSidecar'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}

  /api/v1/sidecars/{name}:
    delete:
      tags: [connections]
      operationId: deleteSidecar
      summary: Remove a sidecar added in the panel
      description: >
        409 for a sidecar of the environment, and while connections of its provider exist unless
        confirm=true (they stop syncing). Audited as sidecar.remove. Owner session only.
      security: [{session: [], csrf: []}, {appSession: []}]
      parameters:
        - name: name
          in: path
          required: true
          schema: {type: string, pattern: '^[a-z][a-z0-9_]*$'}
        - name: confirm
          in: query
          required: false
          description: true removes it even while connections of its provider exist.
          schema: {type: boolean, default: false}
      responses:
        '204':
          description: Removed.
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}

  /api/v1/providers:
    get:
      tags: [connections]
      operationId: listProviders
      summary: List the providers a connector serves (in-process and sidecars), with their setup state
      description: >
        Each provider carries what the panel needs to set it up (docs/adr/0021-source-setup.md):
        setup_state, readiness problems, the OAuth callback URL to register, its app credentials
        (never the secret) and, for a sidecar, how to turn it on. A sidecar is re-checked on this
        call at most once a minute; probeProvider checks at once.
      security: [{session: []}, {appSession: []}, {apiKey: ['read:config']}]
      responses:
        '200':
          description: Every registered connector, by provider code.
          content:
            application/json:
              schema:
                type: object
                required: [providers]
                properties:
                  providers: {type: array, items: {$ref: '#/components/schemas/Provider'}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}

  /api/v1/providers/{provider}/auth/continue:
    post:
      tags: [connections]
      operationId: continueProviderAuth
      summary: Answer an authorization prompt (credentials, an MFA code)
      description: >
        Sends the owner's values for the prompt the state names. The state is single use: the
        answer is the next step with a new state, or the connection once authorized. Any error
        ends the flow; begin again: 422 when the provider refused the values (a wrong password
        or code), 429 with Retry-After while it limits sign-ins, 503 when the provider or its
        sidecar is unavailable. Owner session only, with the binding cookie of begin.
      security: [{session: [], csrf: []}, {appSession: []}]
      parameters:
        - name: provider
          in: path
          required: true
          schema: {type: string, pattern: '^[a-z][a-z0-9_]*$'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AuthContinueInput'}
      responses:
        '200':
          description: Next step, or done.
          content:
            application/json:
              schema:
                oneOf:
                  - {$ref: '#/components/schemas/AuthRedirect'}
                  - {$ref: '#/components/schemas/AuthPromptStep'}
                  - {$ref: '#/components/schemas/AuthDone'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}

  /api/v1/connections/{id}/sync:
    post:
      tags: [connections]
      operationId: syncConnection
      summary: Queue a manual sync (coalesced with a pending one)
      description: One sync job per stream of the connector. A request while one is queued or running answers that job, so repeated clicks queue nothing new.
      security: [{session: [], csrf: []}, {appSession: []}, {apiKey: ['write:config']}]
      parameters:
        - $ref: '#/components/parameters/ConnectionIDPath'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      responses:
        '202':
          description: Queued.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SyncQueued'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}

  /api/v1/connections/{id}/backfills:
    get:
      tags: [connections]
      operationId: listBackfills
      summary: List a connection's backfills, newest first
      security: [{session: []}, {appSession: []}, {apiKey: ['read:config']}]
      parameters:
        - $ref: '#/components/parameters/ConnectionIDPath'
      responses:
        '200':
          description: Backfills.
          content:
            application/json:
              schema:
                type: object
                required: [backfills]
                properties:
                  backfills: {type: array, items: {$ref: '#/components/schemas/Backfill'}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
    post:
      tags: [connections]
      operationId: createBackfill
      summary: Start a bounded, resumable backfill
      security: [{session: [], csrf: []}, {appSession: []}, {apiKey: ['write:config']}]
      parameters:
        - $ref: '#/components/parameters/ConnectionIDPath'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BackfillInput'}
      responses:
        '202':
          description: Queued; one job per unit.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Backfill'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}

  /api/v1/connections/{id}/backfills/{backfill_id}:
    get:
      tags: [connections]
      operationId: getBackfill
      summary: Get a backfill with its units
      security: [{session: []}, {appSession: []}, {apiKey: ['read:config']}]
      parameters:
        - $ref: '#/components/parameters/ConnectionIDPath'
        - $ref: '#/components/parameters/BackfillIDPath'
      responses:
        '200':
          description: The backfill.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Backfill'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}

  /api/v1/connections/{id}/backfills/{backfill_id}/retry:
    post:
      tags: [connections]
      operationId: retryBackfill
      summary: Requeue a backfill's failed (or unfinished) units
      security: [{session: [], csrf: []}, {appSession: []}, {apiKey: ['write:config']}]
      parameters:
        - $ref: '#/components/parameters/ConnectionIDPath'
        - $ref: '#/components/parameters/BackfillIDPath'
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BackfillRetryInput'}
      responses:
        '200':
          description: The backfill after the retry.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Backfill'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}

  /api/v1/connections/{id}/backfills/{backfill_id}/cancel:
    post:
      tags: [connections]
      operationId: cancelBackfill
      summary: Cancel a running or failed backfill (fetched data stays)
      security: [{session: [], csrf: []}, {appSession: []}, {apiKey: ['write:config']}]
      parameters:
        - $ref: '#/components/parameters/ConnectionIDPath'
        - $ref: '#/components/parameters/BackfillIDPath'
      responses:
        '200':
          description: The cancelled backfill.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Backfill'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}

  /api/v1/connections/{id}/runs:
    get:
      tags: [connections]
      operationId: listConnectionRuns
