openapi: 3.1.0
info:
  title: Vitamux API
  version: 0.1.0
  license:
    name: MIT
    identifier: MIT
  description: >
    Contract-first API (ADR-0015, docs/architecture/api.md). /api/v1 is for the owner (session
    cookie + X-CSRF-Token, or an API key); /api/ingest/v1 is for clients and devices. Schemas
    marked as open objects get their properties when the endpoint is implemented; changes
    within v1 are additive only.
servers:
  - url: /
tags:
  - name: ingest
    description: Raw uploads from clients, devices and importers (docs/architecture/connectors.md#push-ingest-contract).
  - name: catalogue
    description: Metric catalogue (docs/architecture/metric-catalog.md).
  - name: source-data
    description: Normalized source records with provenance (docs/architecture/data-model.md).
  - name: resolved
    description: Values selected by resolution rules (docs/architecture/resolution.md).
  - name: rules
    description: Resolution rules and manual overrides.
  - name: system
    description: Coverage, health, jobs and build information.
  - name: connections
    description: Provider connections, syncs, backfills and streams (docs/architecture/connectors.md).
  - name: devices
    description: Paired devices such as the Apple Health bridge (docs/architecture/apple-health.md).
  - name: documents
    description: Blood-test documents, extractions and lab results (docs/architecture/lab-documents.md).
  - name: exports
    description: Portable data exports (docs/architecture/api.md#exports).
  - name: auth
    description: Sign-in, sessions, TOTP and API keys (docs/architecture/security.md).
  - name: settings
    description: Owner settings and timezone periods.

paths:
  # ---------------------------------------------------------------- ingest (/api/ingest/v1)
  /api/ingest/v1/batches:
    post:
      tags: [ingest]
      operationId: createIngestBatch
      summary: Upload a batch of raw items
      description: >
        Raw data is durable before 202; normalization runs as a job afterwards. Replaying the same
        Idempotency-Key and body returns the same response. Body may be gzip-encoded
        (at most 10 MiB compressed, 50 MiB decompressed).
      security:
        - clientToken: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ContentEncoding'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '../schemas/ingest-batch.v1.json'}
      responses:
        '202':
          description: Items stored; normalization queued.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BatchAccepted'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '413': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}

  /api/ingest/v1/batches/{batch_id}:
    get:
      tags: [ingest]
      operationId: getIngestBatch
      summary: Batch status, including normalization outcomes
      security:
        - clientToken: []
      parameters:
        - $ref: '#/components/parameters/BatchID'
      responses:
        '200':
          description: Batch status.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BatchStatus'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}

  /api/ingest/v1/batches/{batch_id}/blobs:
    post:
      tags: [ingest]
      operationId: uploadIngestBlob
      summary: Upload one binary file (FIT, GPX, export zip)
      description: >
        Items reference the file by blob_sha256 (lowercase hex SHA-256 of the uploaded bytes).
        Upload it to an existing batch of the same connection before the batch that references it.
      security:
        - clientToken: []
      parameters:
        - $ref: '#/components/parameters/BatchID'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ContentEncoding'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, contentMediaType: application/octet-stream}
      responses:
        '201':
          description: File stored.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BlobStored'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '413': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}

  /api/ingest/v1/heartbeat:
    post:
      tags: [ingest]
      operationId: postIngestHeartbeat
      summary: Report client checkpoint and health
      security:
        - clientToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '../schemas/heartbeat.v1.json'}
      responses:
        '204':
          description: Recorded.
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}

  /api/ingest/v1/devices/pair:
    post:
      tags: [ingest]
      operationId: pairDevice
      summary: Exchange a pairing code for a device token
      description: >
        Unauthenticated: the single-use code (POST /api/v1/devices/pairing-codes, valid for 10
        minutes) is the credential. Creates a device client on the owner's apple_health push
        connection, creating that connection the first time. Wrong codes are throttled per address
        (429 with Retry-After).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code, name]
              properties:
                code: {type: string, minLength: 1, maxLength: 32, description: 'Case, spaces and dashes are ignored.'}
                name: {type: string, minLength: 1, maxLength: 100, description: Device name shown to the owner.}
      responses:
        '201':
          description: Paired. The token is shown only here.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DevicePairing'}
        '422': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}

  /api/ingest/v1/devices/self:
    get:
      tags: [ingest]
      operationId: getDeviceSelf
      summary: The calling device's configuration, including pending anchor resets
      security:
        - clientToken: []
      responses:
        '200':
          description: Device configuration.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeviceSelf'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}

  /api/ingest/v1/devices/self/rotate-token:
    post:
      tags: [ingest]
      operationId: rotateDeviceToken
      summary: Replace the calling device's token; the old one stops working at once
      security:
        - clientToken: []
      responses:
        '200':
          description: The new token, shown only here.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [token]
                properties:
                  token: {type: string, pattern: '^vmx_cli_[0-9a-f]{32}_[A-Za-z0-9_-]{43}$'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}

  # ---------------------------------------------------------------- catalogue
  /api/v1/metrics:
    get:
      tags: [catalogue]
      operationId: listMetrics
      summary: List catalogue metrics
      security: [{session: []}, {appSession: []}, {apiKey: ['read:health']}]
      responses:
        '200':
          description: All metrics.
          content:
            application/json:
              schema:
                type: object
                required: [metrics]
                properties:
                  metrics: {type: array, items: {$ref: '#/components/schemas/Metric'}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}

  /api/v1/metrics/{code}:
    get:
      tags: [catalogue]
      operationId: getMetric
      summary: Get one catalogue metric
      security: [{session: []}, {appSession: []}, {apiKey: ['read:health']}]
      parameters:
        - $ref: '#/components/parameters/MetricCodePath'
      responses:
        '200':
          description: The metric.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Metric'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}

  /api/v1/event-types:
    get:
      tags: [catalogue]
      operationId: listEventTypes
      summary: List health event types
      description: The event codes health_events may hold (docs/architecture/metric-catalog.md#events), with their level words.
      security: [{session: []}, {appSession: []}, {apiKey: ['read:health']}]
      responses:
        '200':
          description: All event types.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [event_types]
                properties:
                  event_types: {type: array, items: {$ref: '#/components/schemas/EventType'}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}

  # ---------------------------------------------------------------- source data
  /api/v1/inventory:
    get:
      tags: [source-data]
      operationId: getInventory
      summary: Everything stored, per metric, group kind, event code, sleep, workouts and lab analyte
      description: >
        One item per kind and code that has active data, with its catalogue metadata. For metrics,
        first and last seen and the latest value come from the rows; count, days, providers,
        devices and origins come from the hourly aggregates plus the daily values, so they lag
        while aggregates_pending is true.
      security: [{session: []}, {appSession: []}, {apiKey: ['read:health']}]
      responses:
        '200':
          description: The inventory.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Inventory'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}

  /api/v1/events:
    get:
      tags: [source-data]
      operationId: listEvents
      summary: List health events
      description: >
        Rows of health_events (alerts and other typed events), ordered by (start_at, id). code
        filters the event code; the other filters and include work as on /measurements.
      security: [{session: []}, {appSession: []}, {apiKey: ['read:health']}]
      parameters:
        - $ref: '#/components/parameters/Start'
        - $ref: '#/components/parameters/End'
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
        - name: code
          in: query
          required: false
          description: Event code; repeatable.
          schema: {type: array, items: {type: string}}
        - $ref: '#/components/parameters/ProviderFilter'
        - $ref: '#/components/parameters/ConnectionFilter'
        - $ref: '#/components/parameters/DeviceFilter'
        - $ref: '#/components/parameters/OriginFilter'
        - $ref: '#/components/parameters/Include'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of events.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HealthEventPage'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}

  /api/v1/sources/series:
    get:
      tags: [source-data]
      operationId: getSourceSeries
      summary: Per-source series of one metric
      description: >
        Every source's own values over [start, end); nothing is resolved. Each source carries its
        place in the rule in effect. hour and day read the hourly aggregates (active sample and
        interval rows) plus, per day, the source's reported daily values; behind is true while
        days of the metric in the range wait for the rebuild job. At most 93 days per hour series
        and 3,660 per day series. The intraday grains (30s, 1m, 5m, 15m, 30m) and raw read the
        active sample and interval rows for spans of at most a day (25 hours across a DST change),
        and each source reports its native spacing; raw lists the rows in time order, at most
        2,000 per page. Sleep and derived codes have no source series (422).
      security: [{session: []}, {appSession: []}, {apiKey: ['read:health']}]
      parameters:
        - name: metric
          in: query
          required: true
          description: Catalogue code.
          schema: {type: string}
        - name: start
          in: query
          required: true
          schema: {type: string, format: date-time}
        - name: end
          in: query
          required: true
          schema: {type: string, format: date-time}
        - name: grain
          in: query
          required: false
          schema: {type: string, enum: [30s, 1m, 5m, 15m, 30m, raw, hour, day], default: day}
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One series per source.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SourceSeries'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}

  /api/v1/measurements:
    get:
      tags: [source-data]
      operationId: listMeasurements
      summary: List normalized measurements
      description: >
        Active rows by default, ordered by (start_at, id); include=superseded adds earlier
        versions and include=deleted adds rows deleted upstream. start/end filter start_at,
        start_date/end_date the local date. include=provenance adds the raw payload's fetch
        metadata.
      security: [{session: []}, {appSession: []}, {apiKey: ['read:health']}]
      parameters:
        - $ref: '#/components/parameters/Start'
        - $ref: '#/components/parameters/End'
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
        - $ref: '#/components/parameters/MetricFilter'
        - $ref: '#/components/parameters/ProviderFilter'
        - $ref: '#/components/parameters/ConnectionFilter'
        - $ref: '#/components/parameters/DeviceFilter'
        - $ref: '#/components/parameters/OriginFilter'
        - $ref: '#/components/parameters/KindFilter'
        - $ref: '#/components/parameters/Include'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of measurements.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MeasurementPage'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}

  /api/v1/measurements/manual:
    post:
      tags: [source-data]
      operationId: createManualMeasurement
      summary: Record a manual measurement (provider manual, audited)
      security: [{session: [], csrf: []}, {appSession: []}, {apiKey: ['write:config']}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ManualMeasurementInput'}
      responses:
        '201':
          description: Stored.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Measurement'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}

  /api/v1/groups:
    get:
      tags: [source-data]
      operationId: listGroups
      summary: List measurement groups (blood-pressure readings, weigh-ins)
      description: >
        Groups with their components, ordered by (measured_at, id). Filters and include work as
        on /measurements.
      security: [{session: []}, {appSession: []}, {apiKey: ['read:health']}]
      parameters:
        - name: kind
          in: query
          required: false
          schema: {type: string, enum: [bp_reading, body_composition]}
        - $ref: '#/components/parameters/Start'
        - $ref: '#/components/parameters/End'
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
        - $ref: '#/components/parameters/ProviderFilter'
        - $ref: '#/components/parameters/ConnectionFilter'
        - $ref: '#/components/parameters/DeviceFilter'
        - $ref: '#/components/parameters/OriginFilter'
        - $ref: '#/components/parameters/Include'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of groups.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GroupPage'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}

  /api/v1/blood-pressure:
    get:
      tags: [source-data]
      operationId: listBloodPressure
      summary: List blood-pressure readings
      description: >
        bp_reading groups with their components side by side, ordered by (measured_at, id).
        Filters and include work as on /measurements.
      security: [{session: []}, {appSession: []}, {apiKey: ['read:health']}]
      parameters:
        - $ref: '#/components/parameters/Start'
        - $ref: '#/components/parameters/End'
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
        - $ref: '#/components/parameters/ProviderFilter'
        - $ref: '#/components/parameters/ConnectionFilter'
        - $ref: '#/components/parameters/DeviceFilter'
        - $ref: '#/components/parameters/OriginFilter'
        - $ref: '#/components/parameters/Include'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of readings.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BloodPressurePage'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}

  /api/v1/sleep:
    get:
      tags: [source-data]
      operationId: listSleep
      summary: List sleep sessions
      description: >
        Ordered by (start_at, id). start_date/end_date filter sleep_date (the local wake date),
        start/end filter start_at. include=stages adds the stages; other filters and include
        work as on /measurements.
      security: [{session: []}, {appSession: []}, {apiKey: ['read:health']}]
      parameters:
        - $ref: '#/components/parameters/Start'
        - $ref: '#/components/parameters/End'
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
        - $ref: '#/components/parameters/ProviderFilter'
        - $ref: '#/components/parameters/ConnectionFilter'
        - $ref: '#/components/parameters/DeviceFilter'
        - $ref: '#/components/parameters/OriginFilter'
        - $ref: '#/components/parameters/Include'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of sleep sessions.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SleepPage'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}

  /api/v1/sleep/{id}:
    get:
      tags: [source-data]
      operationId: getSleep
      summary: Get one sleep session
      description: Any version, superseded or deleted included, always with its stages.
      security: [{session: []}, {appSession: []}, {apiKey: ['read:health']}]
      parameters:
        - $ref: '#/components/parameters/ID'
        - $ref: '#/components/parameters/Include'
      responses:
        '200':
          description: The sleep session.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SleepSession'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}

  /api/v1/workouts:
    get:
      tags: [source-data]
      operationId: listWorkouts
      summary: List workouts
      description: >
        Ordered by (start_at, id). include=segments adds the laps, sets or intervals; other
        filters and include work as on /measurements.
      security: [{session: []}, {appSession: []}, {apiKey: ['read:health']}]
      parameters:
        - $ref: '#/components/parameters/Start'
        - $ref: '#/components/parameters/End'
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
        - $ref: '#/components/parameters/ProviderFilter'
        - $ref: '#/components/parameters/ConnectionFilter'
        - $ref: '#/components/parameters/DeviceFilter'
        - $ref: '#/components/parameters/OriginFilter'
        - $ref: '#/components/parameters/Include'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of workouts.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkoutPage'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}

  /api/v1/workouts/{id}:
    get:
      tags: [source-data]
      operationId: getWorkout
      summary: Get one workout
      description: Any version, superseded or deleted included, always with its segments.
      security: [{session: []}, {appSession: []}, {apiKey: ['read:health']}]
      parameters:
        - $ref: '#/components/parameters/ID'
        - $ref: '#/components/parameters/Include'
      responses:
        '200':
          description: The workout.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Workout'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}

  /api/v1/provenance/{entity}/{id}:
    get:
      tags: [source-data]
      operationId: getProvenance
      summary: Trace a record back to its raw payload, batch and normalizer
      security: [{session: []}, {appSession: []}, {apiKey: ['read:health']}]
      parameters:
        - name: entity
          in: path
          required: true
          description: Record type.
          schema: {type: string, enum: [measurement, group, sleep, workout]}
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: The provenance trace.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Provenance'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}

  # ---------------------------------------------------------------- resolved
  /api/v1/resolved/daily:
    get:
      tags: [resolved]
      operationId: getResolvedDaily
      summary: Resolved values per local day
      description: Example in docs/architecture/api.md#example-resolved-day.
      security: [{session: []}, {appSession: []}, {apiKey: ['read:health']}]
      parameters:
        - $ref: '#/components/parameters/StartDateRequired'
        - $ref: '#/components/parameters/EndDateRequired'
        - name: metrics
          in: query
          required: false
          description: >
            Comma-separated metric codes or rule families (repeating the parameter also works); every
            metric with a rule in effect when omitted. Night metrics (sleep, local_night rules)
            resolve the night of each date, the others its local_day. At most 366 dates.
          style: form
          explode: false
          schema: {type: array, items: {type: string}}
      responses:
        '200':
          description: One entry per local day.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ResolvedDaily'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}

  /api/v1/resolved/series:
    get:
      tags: [resolved]
      operationId: getResolvedSeries
      summary: Resolved series of one metric over a range
      description: >
        One point per window whose start lies in [start, end) (latest windows: whose as-of instant
        does), in start order, paged. The range spans at most 366 local dates.
      security: [{session: []}, {appSession: []}, {apiKey: ['read:health']}]
      parameters:
        - name: metric
          in: query
          required: true
          description: Catalogue code or rule family (sleep, blood_pressure).
          schema: {type: string}
        - name: start
          in: query
          required: true
          schema: {type: string, format: date-time}
        - name: end
          in: query
          required: true
          schema: {type: string, format: date-time}
        - name: window
          in: query
          required: false
          description: >
            Window kind (bucket, hour, local_day, local_night, sleep_episode, latest, reading) or a
            bucket size (30s, 1m, 5m, 15m, 30m); the rule's window when omitted. A window the metric
            does not allow is 422 unsupported_window. Bucket series of 30s or 1m span at most a day,
            those of 5m or more at most 7 days (plus an hour for a DST change).
          schema: {type: string}
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Points with a source per point.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ResolvedSeries'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}

  /api/v1/resolved/sleep:
    get:
      tags: [resolved]
      operationId: getResolvedSleep
      summary: Resolved sleep episodes per night
      description: The sleep rule's main episode of every night in the range (at most 366), with every source that recorded it.
      security: [{session: []}, {appSession: []}, {apiKey: ['read:health']}]
      parameters:
        - $ref: '#/components/parameters/StartDateRequired'
        - $ref: '#/components/parameters/EndDateRequired'
      responses:
        '200':
          description: Selected episodes.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ResolvedSleep'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}

  /api/v1/resolved/workouts:
    get:
      tags: [resolved]
      operationId: getResolvedWorkouts
      summary: Resolved workouts
      description: >
        Overlapping workouts clustered as in docs/architecture/resolution.md#sleep-episode-alignment,
        one entry per cluster starting on a local date of the range (at most 366), with the member
        the rule picks marked as selected.
      security: [{session: []}, {appSession: []}, {apiKey: ['read:health']}]
      parameters:
        - $ref: '#/components/parameters/StartDateRequired'
        - $ref: '#/components/parameters/EndDateRequired'
      responses:
        '200':
          description: Selected workouts.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ResolvedWorkouts'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}

  /api/v1/resolved/{metric}/{window_key}/sources:
    get:
      tags: [resolved]
      operationId: getResolvedSources
      summary: All-sources drilldown for one metric and window
      description: Example in docs/architecture/api.md#example-all-sources-drilldown.
      security: [{session: []}, {appSession: []}, {apiKey: ['read:health']}]
      parameters:
        - $ref: '#/components/parameters/MetricPath'
        - name: window_key
          in: path
          required: true
          description: Window key, e.g. a local date (2026-09-14) or an hour start in UTC (2026-09-14T08:00:00Z).
          schema: {type: string}
        - name: window
          in: query
          required: false
          description: >
            Window kind (local_day, local_night, hour, bucket, sleep_episode). For a date key the
            default is the kind /resolved/daily uses for the metric; for an instant key the rule's
            bucket or sleep_episode window, else hour.
          schema: {type: string}
      responses:
        '200':
          description: Every source, including excluded ones.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SourcesDrilldown'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}

  /api/v1/resolution/preview:
    post:
      tags: [resolved]
      operationId: previewResolution
      summary: Resolve a draft rule over a range without writing anything
      description: >
        Validates the draft like POST /rules/{metric}/versions (422, or 409
        rule_warning_unacknowledged) and resolves it live beside the rule in effect, one window per
        local date (at most 366): the draft's local_day or local_night window, else local_day.
        Nothing is stored: no rule version, no cache rows, no jobs.
      security: [{session: [], csrf: []}, {appSession: []}, {apiKey: ['read:health']}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResolutionPreviewRequest'}
      responses:
        '200':
          description: Preview results.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ResolutionPreview'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}

  /api/v1/resolved/summary:
    get:
      tags: [resolved]
      operationId: getResolvedSummary
      summary: Dashboard summary per metric
      description: >
        Per metric: the resolved value of date (the window /resolved/daily uses), the 30 resolved
        daily values ending at date, and 7-, 30- and 90-day display rollups of the resolved daily
        values ending at date (mean, min, max, n, coverage). Rollups are plain statistics of
        resolved values, not a resolution strategy; values of windows still open are left out.
        Everything comes from the resolver and its cache.
      security: [{session: []}, {appSession: []}, {apiKey: ['read:health']}]
      parameters:
        - name: metrics
          in: query
          required: true
          description: Comma-separated metric codes or rule families (repeating the parameter also works); at most 20.
          style: form
          explode: false
          schema: {type: array, items: {type: string}, minItems: 1}
        - name: date
          in: query
          required: false
          description: Local date; today in the owner's timezone when omitted.
          schema: {type: string, format: date}
        - name: compare
          in: query
          required: false
          description: >
            true adds comparisons to every metric: the rollups of the 7, 30, 90 and 365 local dates
            ending at date beside those of the equally long period before them. Resolves up to 730
            dates per metric, so it is off by default.
          schema: {type: boolean, default: false}
      responses:
        '200':
          description: One summary per metric.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ResolvedSummary'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}

  /api/v1/resolved/trend:
    get:
      tags: [resolved]
      operationId: getResolvedTrend
      summary: Weekly or monthly rollups of resolved daily values
      description: >
        Display rollups (mean, min, max, n, coverage, and sum for additive metrics) of one metric's
        resolved daily values per ISO week (Monday first) or calendar month, clipped to the range.
        The range may span up to 3,660 dates, past the 366-date cap of the daily endpoints. Values
        of windows still open are left out. Everything comes from the resolver and its cache.
      security: [{session: []}, {appSession: []}, {apiKey: ['read:health']}]
      parameters:
        - name: metric
          in: query
          required: true
          description: Catalogue code or rule family (sleep, blood_pressure).
          schema: {type: string}
        - $ref: '#/components/parameters/StartDateRequired'
        - $ref: '#/components/parameters/EndDateRequired'
        - name: grain
          in: query
          required: false
          schema: {type: string, enum: [week, month], default: week}
      responses:
        '200':
          description: One rollup per week or month.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ResolvedTrend'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}

