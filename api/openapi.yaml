      responses:
        '200':
          description: The PDF.
          content:
            application/pdf:
              schema: {type: string, contentMediaType: application/pdf}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
