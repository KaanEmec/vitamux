              schema: {$ref: '#/components/schemas/Coverage'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}

  /api/v1/system/status:
    get:
      tags: [system]
      operationId: getSystemStatus
      summary: Instance diagnostics
      description: Versions, database and blob sizes, last backup, degraded connections, failing jobs.
      security: [{session: []}, {apiKey: ['read:config']}]
      responses:
        '200':
          description: Status.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SystemStatus'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}

  /api/v1/system/version:
    get:
      tags: [system]
      operationId: getSystemVersion
      summary: Build version of the running server
      security: [{session: []}, {apiKey: ['read:config']}]
      responses:
        '200':
          description: Version.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SystemVersion'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}

  /api/v1/jobs:
    get:
      tags: [system]
      operationId: listJobs
      summary: List background jobs
      security: [{session: []}, {apiKey: ['read:config']}]
      parameters:
        - name: status
          in: query
          required: false
          schema: {type: string}
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of jobs.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JobPage'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}

  # ---------------------------------------------------------------- connections
  /api/v1/connections:
    get:
      tags: [connections]
      operationId: listConnections
      summary: List connections with health
      security: [{session: []}, {apiKey: ['read:config']}]
      responses:
        '200':
          description: All connections.
          content:
            application/json:
              schema:
                type: object
                required: [connections]
                properties:
                  connections: {type: array, items: {$ref: '#/components/schemas/Connection'}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      tags: [connections]
      operationId: createConnection
      summary: Create a connection
      security: [{session: [], csrf: []}, {apiKey: ['write:config']}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConnectionInput'}
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Connection'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}

  /api/v1/connections/{id}:
    get:
      tags: [connections]
      operationId: getConnection
      summary: Get one connection
      security: [{session: []}, {apiKey: ['read:config']}]
      parameters:
        - $ref: '#/components/parameters/ConnectionIDPath'
      responses:
        '200':
          description: The connection.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Connection'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
    patch:
      tags: [connections]
      operationId: updateConnection
      summary: Update a connection
      security: [{session: [], csrf: []}, {apiKey: ['write:config']}]
      parameters:
        - $ref: '#/components/parameters/ConnectionIDPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConnectionPatch'}
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Connection'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
    delete:
      tags: [connections]
      operationId: deleteConnection
      summary: Delete a connection, keeping or deleting its data
      security: [{session: [], csrf: []}, {apiKey: ['write:config']}]
      parameters:
        - $ref: '#/components/parameters/ConnectionIDPath'
        - name: data
          in: query
          required: true
          description: >
            keep deletes the credentials and disables the connection; its data stays.
            delete also removes its raw payloads, canonical rows, cursors, schedules and jobs
            (refused with 409 while one of its jobs runs).
          schema: {type: string, enum: [keep, delete]}
      responses:
        '204':
          description: Deleted.
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}

  /api/v1/connections/{id}/auth/begin:
    post:
      tags: [connections]
      operationId: beginConnectionAuth
      summary: Reauthorize a connection (OAuth redirect or credential prompt)
      description: >
        OAuth: answers {"redirect_url"} and sets the short-lived browser-binding cookie that the
        provider callback needs (docs/architecture/connectors.md#oauth-connection-flow). Owner
        session only, since the state is bound to it.
      security: [{session: [], csrf: []}]
      parameters:
        - $ref: '#/components/parameters/ConnectionIDPath'
      responses:
        '200':
          description: Next step.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthStep'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}

  /api/v1/providers/{provider}/auth/begin:
    post:
      tags: [connections]
      operationId: beginProviderAuth
      summary: Connect an account of a provider (OAuth redirect)
      description: >
        Like beginConnectionAuth, for an account not connected yet. The callback creates the
        connection, or reuses the existing one when the same provider account connects again.
      security: [{session: [], csrf: []}]
      parameters:
        - name: provider
          in: path
          required: true
          schema: {type: string, pattern: '^[a-z][a-z0-9_]*$'}
      responses:
        '200':
          description: Next step.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthStep'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}

  /api/v1/connections/{id}/auth/continue:
    post:
      tags: [connections]
      operationId: continueConnectionAuth
      summary: Continue interactive authorization (e.g. an MFA code)
      security: [{session: [], csrf: []}, {apiKey: ['write:config']}]
      parameters:
        - $ref: '#/components/parameters/ConnectionIDPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AuthContinueInput'}
      responses:
        '200':
          description: Next step, or done.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthStep'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}

  /api/v1/connections/{id}/sync:
    post:
      tags: [connections]
      operationId: syncConnection
      summary: Queue a manual sync (coalesced with a pending one)
      description: One sync job per stream of the connector. A request while one is queued or running answers that job, so repeated clicks queue nothing new.
      security: [{session: [], csrf: []}, {apiKey: ['write:config']}]
      parameters:
        - $ref: '#/components/parameters/ConnectionIDPath'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      responses:
        '202':
          description: Queued.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SyncQueued'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}

  /api/v1/connections/{id}/backfills:
    get:
      tags: [connections]
      operationId: listBackfills
      summary: List a connection's backfills, newest first
      security: [{session: []}, {apiKey: ['read:config']}]
