      security: [{session: [], csrf: []}]
      responses:
        '200':
          description: Secret and otpauth URI (shown once).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TOTPEnrollment'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}

  /api/v1/auth/totp/confirm:
    post:
      tags: [auth]
      operationId: confirmTOTP
      summary: Confirm TOTP enrolment with a code
      security: [{session: [], csrf: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: {type: string}
      responses:
        '200':
          description: Recovery codes (shown once).
          content:
            application/json:
              schema:
                type: object
                required: [recovery_codes]
                properties:
                  recovery_codes: {type: array, items: {type: string}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}

  /api/v1/auth/totp/disable:
    post:
      tags: [auth]
      operationId: disableTOTP
      summary: Disable TOTP (password plus a code or recovery code)
      security: [{session: [], csrf: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: {type: string}
                totp_code: {type: string}
                recovery_code: {type: string}
      responses:
        '204':
          description: Disabled.
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}

  /api/v1/api-keys:
    get:
      tags: [auth]
      operationId: listAPIKeys
      summary: List API keys
      security: [{session: []}, {apiKey: [admin]}]
      responses:
        '200':
          description: API keys (never the secret).
          content:
            application/json:
              schema:
                type: object
                required: [api_keys]
                properties:
                  api_keys: {type: array, items: {$ref: '#/components/schemas/APIKey'}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      tags: [auth]
      operationId: createAPIKey
      summary: Create an API key; the token is returned once
      security: [{session: [], csrf: []}, {apiKey: [admin]}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scopes]
              properties:
                name: {type: string, minLength: 1, maxLength: 100}
                scopes: {type: array, minItems: 1, items: {$ref: '#/components/schemas/Scope'}}
                expires_at: {type: string, format: date-time}
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CreatedAPIKey'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}

  /api/v1/api-keys/{id}:
    delete:
      tags: [auth]
      operationId: revokeAPIKey
      summary: Revoke an API key
      security: [{session: [], csrf: []}, {apiKey: [admin]}]
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '204':
          description: Revoked.
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}

  # ---------------------------------------------------------------- settings
  /api/v1/settings:
    get:
      tags: [settings]
      operationId: getSettings
      summary: Owner settings
      security: [{session: []}, {apiKey: ['read:config']}]
      responses:
        '200':
          description: Settings.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Settings'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
    patch:
      tags: [settings]
      operationId: updateSettings
      summary: Change settings (merge patch)
      security: [{session: [], csrf: []}, {apiKey: ['write:config']}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Settings'}
      responses:
        '200':
          description: Updated settings.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Settings'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}

  /api/v1/timezone-periods:
    get:
      tags: [settings]
      operationId: listTimezonePeriods
      summary: List timezone periods
      security: [{session: []}, {apiKey: ['read:config']}]
      responses:
        '200':
          description: Periods, oldest first.
          content:
            application/json:
              schema:
                type: object
                required: [timezone_periods]
                properties:
                  timezone_periods: {type: array, items: {$ref: '#/components/schemas/TimezonePeriod'}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      tags: [settings]
      operationId: createTimezonePeriod
      summary: Add a timezone period (local dates are recomputed)
      security: [{session: [], csrf: []}, {apiKey: ['write:config']}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TimezonePeriod'}
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TimezonePeriod'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: vitamux_session
      description: Owner session cookie set by POST /api/v1/auth/login (HttpOnly, Secure, SameSite=Strict).
    csrf:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Required with the session cookie on mutating requests; the value comes from login or GET /api/v1/auth/session.
    apiKey:
      type: http
      scheme: bearer
      description: 'API key `vmx_pat_<id>_<secret>`. The listed role is the scope it needs; `admin` implies every scope.'
    clientToken:
      type: http
      scheme: bearer
      description: 'Client token `vmx_cli_<id>_<secret>` with scope `ingest:<connection_id>`.'

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 1, maxLength: 255}
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      description: Replays the stored response for the same request; a different request with the same key is 409.
      schema: {type: string, minLength: 1, maxLength: 255}
    ContentEncoding:
      name: Content-Encoding
      in: header
      required: false
      schema: {type: string, enum: [gzip]}
    BatchID:
      name: batch_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/BatchID'}
    ID:
      name: id
      in: path
      required: true
      schema: {type: string, minLength: 1}
    ConnectionIDPath:
      name: id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/ConnectionID'}
    MetricPath:
      name: metric
      in: path
      required: true
      schema: {type: string}
    MetricCodePath:
      name: code
      in: path
      required: true
      schema: {type: string}
    Limit:
      name: limit
      in: query
      required: false
      description: Page size. Endpoints may cap it lower than 10,000.
      schema: {type: integer, minimum: 1, maximum: 10000, default: 500}
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque next_cursor from the previous page of the same query.
      schema: {type: string}
    Start:
      name: start
      in: query
      required: false
      description: Inclusive start instant (RFC 3339 with offset).
      schema: {type: string, format: date-time}
    End:
      name: end
      in: query
      required: false
      description: Exclusive end instant (RFC 3339 with offset).
      schema: {type: string, format: date-time}
    StartDate:
      name: start_date
      in: query
      required: false
      description: First local date, inclusive.
      schema: {type: string, format: date}
    EndDate:
      name: end_date
      in: query
      required: false
      description: Last local date, inclusive.
      schema: {type: string, format: date}
    StartDateRequired:
      name: start_date
      in: query
      required: true
      description: First local date, inclusive.
      schema: {type: string, format: date}
    EndDateRequired:
      name: end_date
      in: query
      required: true
      description: Last local date, inclusive.
      schema: {type: string, format: date}
    MetricFilter:
      name: metric
      in: query
      required: false
      description: Metric code; repeatable.
      schema: {type: array, items: {type: string}}
    ProviderFilter:
      name: provider
      in: query
      required: false
      description: Provider code; repeatable.
      schema: {type: array, items: {type: string}}
    ConnectionFilter:
      name: connection
      in: query
      required: false
      description: Connection id; repeatable.
      schema: {type: array, items: {$ref: '#/components/schemas/ConnectionID'}}
    DeviceFilter:
      name: device
      in: query
      required: false
      description: Device id; repeatable.
      schema: {type: array, items: {type: string}}
    OriginFilter:
      name: origin
      in: query
      required: false
      description: Origin key (e.g. a HealthKit bundle id); repeatable.
      schema: {type: array, items: {type: string}}
    KindFilter:
      name: kind
      in: query
      required: false
      description: Measurement kind; repeatable.
      schema: {type: array, items: {type: string, enum: [sample, interval, cumulative, daily_value]}}
    Include:
      name: include
      in: query
      required: false
      description: Comma-separated expansions.
      style: form
      explode: false
      schema: {type: array, items: {type: string, enum: [provenance, stages, segments, superseded]}}

  responses:
    Problem:
      description: Error (RFC 9457 problem+json; codes in internal/api/problem.go).
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}

  schemas:
    # ------------------------------------------------ shared
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        code: {type: string}
        request_id: {type: string}
        errors:
          type: array
          items:
            type: object
            required: [pointer, detail]
            properties:
              pointer: {type: string}
              detail: {type: string}
    PageInfo:
      type: object
      required: [has_more]
      properties:
        has_more: {type: boolean}
        next_cursor: {type: string, description: Present when has_more is true.}
    ConnectionID:
      type: string
      pattern: '^conn_[0-9a-f]{32}$'
    Scope:
      type: string
      enum: ['read:health', 'read:config', 'write:config', 'write:documents', admin]

    # ------------------------------------------------ ingest
    BatchID:
      type: string
      pattern: '^bat_[0-9a-f]{32}$'
    ItemOutcome:
      type: object
      additionalProperties: false
      required: [external_key, status, raw_payload_id]
      properties:
        external_key: {type: string}
        status: {type: string, enum: [stored, duplicate, new_version]}
        raw_payload_id: {type: string, pattern: '^[0-9]+$'}
    BatchAccepted:
      type: object
      additionalProperties: false
      required: [batch_id, items, normalization]
      properties:
        batch_id: {$ref: '#/components/schemas/BatchID'}
        items:
          type: array
          items: {$ref: '#/components/schemas/ItemOutcome'}
        normalization: {type: string, enum: [queued]}
    BatchStatus:
      type: object
      required: [batch_id, received_at, normalization, items]
      properties:
        batch_id: {$ref: '#/components/schemas/BatchID'}
        received_at: {type: string, format: date-time}
        normalization: {type: string, enum: [queued, running, done, failed]}
        items:
          type: array
          items:
            type: object
            required: [external_key, raw_payload_id, status]
            properties:
              external_key: {type: string}
              raw_payload_id: {type: string, pattern: '^[0-9]+$'}
              status: {type: string, enum: [stored, normalized, normalize_failed, quarantined]}
    BlobStored:
      type: object
      additionalProperties: false
      required: [blob_sha256, size_bytes]
      properties:
        blob_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        size_bytes: {type: integer, minimum: 0}

    # ------------------------------------------------ resolved (docs/architecture/resolution.md#result-shape)
    ResolvedDaily:
      type: object
      required: [timezone, days]
      properties:
        timezone: {type: string, description: IANA timezone of the requested period.}
        days:
          type: array
          items:
            type: object
            required: [local_date, metrics]
            properties:
              local_date: {type: string, format: date}
              metrics:
                type: object
                additionalProperties: {$ref: '#/components/schemas/ResolvedValue'}
    ResolvedValue:
      type: object
      required: [status, explanation]
      properties:
        status: {type: string, enum: [direct, fallback, calculated, overridden, no_data]}
        value: {description: 'A number, or an object of components (e.g. blood pressure systolic/diastolic/pulse).'}
        unit: {type: string}
        partial: {type: boolean}
        window: {$ref: '#/components/schemas/Window'}
        rule: {$ref: '#/components/schemas/RuleRef'}
        inputs: {type: array, items: {$ref: '#/components/schemas/ResolvedInput'}}
        warnings:
          type: array
          items:
            type: object
            required: [code]
            properties:
              code: {type: string}
              group: {type: string}
        explanation: {type: string}
        computed_at: {type: string, format: date-time}
        links:
          type: object
          properties:
            sources: {type: string}
    Window:
      type: object
      required: [kind]
      properties:
        kind: {type: string, description: 'e.g. local_day, hour, bucket, night, latest.'}
        start: {type: string, format: date-time}
        end: {type: string, format: date-time}
        local_date: {type: string, format: date}
    RuleRef:
      type: object
      required: [ref, version]
      properties:
        ref: {type: string, description: 'builtin:<metric> or user:<metric>.'}
        version: {type: integer}
        strategy: {type: string}
    ResolvedInput:
      type: object
      required: [group, status]
      properties:
        group: {type: string}
        status: {type: string, description: 'e.g. used, no_data, below_quality, excluded.'}
        selected: {type: boolean}
        value: {description: Same shape as ResolvedValue.value.}
        basis: {type: string, description: 'e.g. daily_value, intervals, samples, reading.'}
        coverage: {type: number, format: double, minimum: 0, maximum: 1}
        readings: {type: integer}
        reason: {type: string}
        sources:
          type: array
          items:
            type: object
            properties:
              provider: {type: string}
              connection_id: {type: string}
              device: {$ref: '#/components/schemas/DeviceRef'}
        record_refs: {type: array, items: {type: string}}
    DeviceRef:
      type: object
      properties:
        type: {type: string}
    SourcesDrilldown:
      type: object
      required: [metric, window, rule, sources]
      properties:
        metric: {type: string}
        window: {$ref: '#/components/schemas/Window'}
        rule: {$ref: '#/components/schemas/RuleRef'}
        sources:
          type: array
          items:
            type: object
            required: [group, rule_status, provider]
            properties:
              group: {type: [string, 'null'], description: Rule group; null when the source is outside the rule.}
              rule_status: {type: string, enum: [used, excluded, not_in_rule]}
              reason: {type: string}
              provider: {type: string}
              device: {$ref: '#/components/schemas/DeviceRef'}
              origin:
                type: object
                properties:
                  key: {type: string}
                  name: {type: string}
                  relayed_provider: {type: string}
              values:
                type: object
                description: Per-basis values, e.g. daily_value, interval_sum, intervals.
                additionalProperties: {type: number, format: double}
              records:
                type: object
                required: [href]
                properties:
                  href: {type: string}
              provenance:
                type: object
                properties:
                  raw_payload_ids: {type: array, items: {type: string}}
                  normalizer: {type: string}
                  fetched_at: {type: string, format: date-time}
    ResolvedSeries:
      type: object
      description: Open object; properties are added with the endpoint.
    ResolvedEvents:
      type: object
      description: Open object; properties are added with the endpoint.
    ResolutionPreviewRequest:
      type: object
      description: A draft rule and a date range. Open object; properties are added with the endpoint.
    ResolutionPreview:
      type: object
      description: Open object; properties are added with the endpoint.

    # ------------------------------------------------ system
    SystemVersion:
      type: object
      additionalProperties: false
      required: [version, commit]
      properties:
        version: {type: string}
        commit: {type: string}
    SystemStatus:
      type: object
      description: Open object; properties are added with the endpoint.
    Coverage:
      type: object
      description: Open object; properties are added with the endpoint.
    Job:
      type: object
      description: Open object; properties are added with the endpoint.
    JobPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [jobs]
          properties:
            jobs: {type: array, items: {$ref: '#/components/schemas/Job'}}

    # ------------------------------------------------ exports (docs/architecture/api.md#exports)
    ExportRequest:
      type: object
      required: [format]
      properties:
        scope: {type: object, description: What to export; everything when omitted. Properties are added with the endpoint.}
        format: {type: string, enum: [ndjson, csv]}
        include_raw: {type: boolean, default: false}
    Export:
      type: object
      required: [id, status, created_at]
      properties:
        id: {type: string}
        status: {type: string, enum: [queued, running, done, failed]}
        format: {type: string, enum: [ndjson, csv]}
        include_raw: {type: boolean}
        created_at: {type: string, format: date-time}
        finished_at: {type: string, format: date-time}
        size_bytes: {type: integer, minimum: 0}
        download_url: {type: string, description: One-time, short-lived; present when status is done.}

    # ------------------------------------------------ auth (matches internal/api/auth.go)
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: {type: string}
        password: {type: string}
        totp_code: {type: string}
        recovery_code: {type: string}
    User:
      type: object
      required: [id, username, totp_enabled]
      properties:
        id: {type: string, format: uuid}
        username: {type: string}
        totp_enabled: {type: boolean}
    Session:
      type: object
      required: [user, csrf_token]
      properties:
        user: {$ref: '#/components/schemas/User'}
        csrf_token: {type: string}
    TOTPEnrollment:
      type: object
      required: [secret, otpauth_uri]
      properties:
        secret: {type: string}
        otpauth_uri: {type: string}
    APIKey:
      type: object
      required: [id, name, scopes, created_at, last_used_at, expires_at, revoked_at]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        scopes: {type: array, items: {$ref: '#/components/schemas/Scope'}}
        created_at: {type: string, format: date-time}
        last_used_at: {type: [string, 'null'], format: date-time}
        expires_at: {type: [string, 'null'], format: date-time}
        revoked_at: {type: [string, 'null'], format: date-time}
    CreatedAPIKey:
      allOf:
        - $ref: '#/components/schemas/APIKey'
        - type: object
          required: [token]
          properties:
            token: {type: string, description: Shown in this response only.}

    # ------------------------------------------------ open objects: properties are added with each endpoint
    Metric: {type: object, description: Catalogue metric (docs/architecture/metric-catalog.md). Open object.}
    Measurement: {type: object, description: Normalized measurement (docs/architecture/data-model.md#measurements). Open object.}
    MeasurementPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [measurements]
          properties:
            measurements: {type: array, items: {$ref: '#/components/schemas/Measurement'}}
    ManualMeasurementInput: {type: object, description: Open object.}
    Group: {type: object, description: Measurement group (bp_reading, body_composition). Open object.}
    GroupPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [groups]
          properties:
            groups: {type: array, items: {$ref: '#/components/schemas/Group'}}
    BloodPressureReading: {type: object, description: Open object.}
    BloodPressurePage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [readings]
          properties:
            readings: {type: array, items: {$ref: '#/components/schemas/BloodPressureReading'}}
    SleepSession: {type: object, description: Open object.}
    SleepPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [sleep]
          properties:
            sleep: {type: array, items: {$ref: '#/components/schemas/SleepSession'}}
    Workout: {type: object, description: Open object.}
    WorkoutPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [workouts]
          properties:
            workouts: {type: array, items: {$ref: '#/components/schemas/Workout'}}
    Provenance: {type: object, description: Provenance trace (internal/provenance). Open object.}
    Rule: {type: object, description: Open object.}
    RuleVersion: {type: object, description: Open object.}
    RuleVersionInput: {type: object, description: Typed rule (docs/architecture/resolution.md). Open object.}
    RuleActivation:
      type: object
      required: [version]
      properties:
        version: {type: integer, minimum: 1}
        acknowledge_warnings: {type: array, items: {type: string}}
    Override: {type: object, description: Open object.}
    OverrideInput: {type: object, description: Open object.}
    OverridePage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [overrides]
          properties:
            overrides: {type: array, items: {$ref: '#/components/schemas/Override'}}
    Connection: {type: object, description: Connection with health; never credentials. Open object.}
    ConnectionInput: {type: object, description: Open object.}
    ConnectionPatch: {type: object, description: Open object.}
    AuthStep: {type: object, description: Next interactive auth step (redirect URL, prompt, or done). Open object.}
    AuthContinueInput: {type: object, description: Open object.}
    BackfillInput: {type: object, description: Open object.}
    Run: {type: object, description: Open object.}
    RunPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [runs]
          properties:
            runs: {type: array, items: {$ref: '#/components/schemas/Run'}}
    Stream: {type: object, description: Open object.}
    PairedDevice: {type: object, description: Open object.}
    PairingCode: {type: object, description: Open object.}
    Document: {type: object, description: Open object.}
    DocumentPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [documents]
          properties:
            documents: {type: array, items: {$ref: '#/components/schemas/Document'}}
    ExtractionInput: {type: object, description: Extractor choice and consent to send externally. Open object.}
    Extraction: {type: object, description: Open object.}
    ExtractionRow: {type: object, description: Open object.}
    ExtractionRowPatch: {type: object, description: Open object.}
    LabResult: {type: object, description: Open object.}
    LabResultPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [lab_results]
